    <div class="card">
      <div class="card-label">Crédito CAIXA disponível</div>
      <div class="card-value">${money(r.creditoCaixaDisponivelContabil)}</div>
      <div class="card-sub">Crédito CAIXA total − gasto PLS + provisão da quinzena</div>
    </div>
    <div class="card">
      <div class="card-label">Valor caixa liberado</div>
      ${cardValueDrill('caixaLiberado', r.caixaLiberadaAcumulada)}
      <div class="card-sub">Medições liberadas pelo banco (${money(r.caixaLiberadaAcumulada - (Number(VIEW.parametros.custoLoteExecutado) || 0))}) + valor que o CAIXA já passou do lote (${money(VIEW.parametros.custoLoteExecutado)})</div>
    </div>
    <div class="card ${r.saldoRecursoDisponivel < 0 ? 'warn' : 'good'}">
      <div class="card-label">Saldo de recurso próprio disponível</div>
      ${cardValueDrill('recursoProprio', r.saldoRecursoDisponivel)}
      <div class="card-sub">${origemSaldoRecursoLabel(r.origemSaldoRecurso, r)}</div>
    </div>
    <div class="card">
      <div class="card-label">Total administração (RS Engenharia)</div>
      <div class="card-value">${money(r.totalAdmPago)}</div>
      <div class="card-sub">Taxa: ${pct(VIEW.parametros.taxaAdministracaoPercent)}</div>
    </div>
    <div class="card">
      <div class="card-label">Gasto no cartão (realizado)</div>
      <div class="card-value">${money(r.totalCartaoPago)}</div>
      <div class="card-sub">Total gasto acumulado: ${money(r.totalGastoAcumulado)}</div>
    </div>
    <div class="card">
      <div class="card-label">Serviços preliminares</div>
      <div class="card-value">${money(r.totalPagoDiretoProprietario)}</div>
      <div class="card-sub">Pago direto pelo proprietário (fora do empreiteiro): topografia, projetos, prefeitura, cartório. Já descontado do saldo de recurso próprio disponível.</div>
    </div>
  `;
  ligarDrills(cards);
  root.appendChild(cards);
  root.appendChild(renderConciliacaoEmpreiteiro());
  root.appendChild(renderVerbaFuturaBlock());

  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `
    <div class="panel-header">
      <div>
        <h2>Contas a Pagar — parcelas quinzenais (documento enviado ao cliente)</h2>
        <div class="muted">Editável em qualquer campo. "Total a transferir" e "Custo total" são calculados automaticamente, mas podem ser sobrescritos quando o valor real vier diferente do planejado.</div>
      </div>
      <button class="btn primary" id="btnNovaParcela">+ Nova parcela</button>
    </div>
    <div class="mesFilterSlot"></div>
    <div class="table-scroll"><table class="data" id="tblParcelas">
      <thead><tr>
        <th>Parcela</th><th>Mês / Parcela</th><th class="num">Empreiteiro (PIX)</th><th class="num">ADM (PIX)</th>
        <th class="num">Cartão</th><th class="num">Total a transferir</th><th class="num">Evolução Caixa</th>
        <th class="num">Custo total</th><th>Data do custo</th><th>Venc. planejado</th><th>Venc. real</th><th>Status</th><th class="wrap">Obs.</th><th></th>
      </tr></thead>
      <tbody></tbody>
      <tfoot></tfoot>
    </table></div>
  `;
  root.appendChild(panel);

  // Filtro por QUINZENA (não por mês): a parcela é quinzenal, então filtrar
  // pelo mês inteiro junta duas parcelas diferentes. Mesmas pílulas do
  // "Custo total do período", para a leitura ser a mesma nas duas telas.
  panel.querySelector('.mesFilterSlot').appendChild(renderQuinzenaChips({
    selecionada: FILTRO_QUINZENA_PARCELAS,
    onChange: (v) => { FILTRO_QUINZENA_PARCELAS = v; renderDashboard(); },
  }));
  const parcelasFiltradas = VIEW.parcelas.filter((p) => {
    if (!FILTRO_QUINZENA_PARCELAS) return true;
    return `${p.mesReferencia}|${p.quinzena || 1}` === FILTRO_QUINZENA_PARCELAS;
  });

  const tbody = panel.querySelector('tbody');
  if (!parcelasFiltradas.length) {
    tbody.innerHTML = `<tr><td colspan="14" class="muted">${FILTRO_QUINZENA_PARCELAS ? 'Nenhuma parcela nessa quinzena.' : 'Nenhuma parcela lançada ainda.'}</td></tr>`;
  }
  for (const p of parcelasFiltradas) {
    const tr = document.createElement('tr');
    tr.appendChild(td(textInput({ value: p.label, onSave: (v) => updateParcela(p.id, { label: v }) })));
    tr.appendChild(td(`<span class="badge gray">${esc(p.mesReferenciaLabel || 'Sem data')}</span>`));
    tr.appendChild(td(moneyInput({ value: p.totalEmpreiteiroPix, onSave: (v) => updateParcela(p.id, { totalEmpreiteiroPix: v }) })));
    const parcelaReal = STATE.parcelas.find((x) => x.id === p.id);
    const admManual = parcelaReal ? admEhManual(parcelaReal) : false;
    const admCell = document.createElement('td');
    admCell.appendChild(moneyInput({
      value: p.totalAdmPix,
      manual: admManual,
      titulo: parcelaReal
        ? `${pct(STATE.parametros.taxaAdministracaoPercent)} sobre ${money(baseAdmParcela(parcelaReal))} (${STATE.parametros.admBase === 'custoTotal' ? 'custo total da quinzena' : 'empreiteiro PIX + cartão'}) = ${money(admDerivadaParcela(parcelaReal))}.${admManual ? ' Este valor foi digitado à mão — clique em ↺ para voltar ao cálculo.' : ''}`
        : '',
      onSave: (v) => updateParcela(p.id, { totalAdmPix: v }),
    }));
    if (admManual) {
      const volta = document.createElement('button');
      volta.type = 'button';
      volta.className = 'icon-btn';
      volta.textContent = '↺';
      volta.title = 'Voltar a ADM ao cálculo automático sobre a base.';
      volta.onclick = () => recalcularAdmPelaBase(p.id);
      admCell.appendChild(volta);
    }
    tr.appendChild(admCell);
    tr.appendChild(td(moneyInput({
      value: p.gastoCartao,
      readOnly: !!STATE.parametros.cartaoAutoSync,
      titulo: STATE.parametros.cartaoAutoSync
        ? 'Sincronização automática ligada: este valor é a soma dos itens de cartão daquela fatura no Detalhamento FC. Para mudar, edite os itens (ou o mês da fatura) lá.'
        : '',
      onSave: (v) => updateParcela(p.id, { gastoCartao: v }),
    })));
    tr.appendChild(td(moneyInput({ value: p.totalATransferir, manual: !!p.overrides?.totalATransferir, onSave: (v) => updateParcela(p.id, { totalATransferir: v }) })));
    tr.appendChild(td(moneyInput({ value: p.parcelaEvolucaoCaixa, onSave: (v) => updateParcela(p.id, { parcelaEvolucaoCaixa: v }) })));
    tr.appendChild(td(moneyInput({ value: p.custoTotal, manual: !!p.overrides?.custoTotal, onSave: (v) => updateParcela(p.id, { custoTotal: v }) })));
    tr.appendChild(td(dateInput({ value: p.dataGeracaoCusto, onSave: (v) => updateParcela(p.id, { dataGeracaoCusto: v }) })));
    tr.appendChild(td(dateInput({ value: p.vencPlanejado, onSave: (v) => updateParcela(p.id, { vencPlanejado: v }) })));
    tr.appendChild(td(dateInput({ value: p.vencimento, onSave: (v) => updateParcela(p.id, { vencimento: v }) })));
    tr.appendChild(td(statusSelect({ value: p.status, onSave: (v) => updateParcela(p.id, { status: v }) })));
    marcarLinhaStatus(tr, p.status);
    tr.appendChild(td(textInput({ value: p.obs, wide: true, onSave: (v) => updateParcela(p.id, { obs: v }) })));
    const delTd = document.createElement('td');
    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn'; delBtn.textContent = '🗑';
    delBtn.onclick = async () => { if (await confirmDialog(`Remover parcela "${p.label || '(sem rótulo)'}"?`)) deleteParcela(p.id); };
    delTd.appendChild(delBtn);
    tr.appendChild(delTd);
    tbody.appendChild(tr);
  }

  const tfoot = panel.querySelector('tfoot');
  /* O rodapé somava TODAS as linhas — realizadas e planejadas juntas. Os
     cards do topo contam só o que já foi REALIZADO. Dava dois totais para a
     mesma coluna na mesma tela, e não havia como saber qual estava certo:
     estavam os dois, respondendo perguntas diferentes. Agora o rodapé separa
     realizado, planejado e total, e a linha "REALIZADO" é a que fecha com os
     cards. */
  const COLUNAS_TOTAL = ['totalEmpreiteiroPix', 'totalAdmPix', 'gastoCartao', 'totalATransferir', 'parcelaEvolucaoCaixa', 'custoTotal'];
  const somaDe = (f, filtro) => round2(parcelasFiltradas.filter(filtro).reduce((a, p) => a + (Number(p[f]) || 0), 0));
  const ehReal = (p) => p.status === 'REALIZADO';
  const ehPlan = (p) => p.status !== 'REALIZADO';
  const temPlanejadas = parcelasFiltradas.some(ehPlan);
  const temRealizadas = parcelasFiltradas.some(ehReal);
  const escopo = FILTRO_QUINZENA_PARCELAS ? 'DA QUINZENA' : '';
  const linhaTotal = (rotulo, filtro, cls, dica) => `<tr class="${cls}" title="${esc(dica)}">
    <td>${esc(rotulo)}</td>
    <td></td>
    ${COLUNAS_TOTAL.map((f) => `<td class="num">${money(somaDe(f, filtro))}</td>`).join('')}
    <td colspan="6"></td>
  </tr>`;

  tfoot.innerHTML = [
    temRealizadas && temPlanejadas
      ? linhaTotal(`REALIZADO ${escopo}`.trim(), ehReal, 'total-realizado', 'Só as quinzenas com status REALIZADO. É esta linha que bate com os cards do topo da tela e com o Dashboard.')
      : '',
    temRealizadas && temPlanejadas
      ? linhaTotal(`PLANEJADO ${escopo}`.trim(), ehPlan, 'total-planejado', 'Só as quinzenas ainda PLANEJADAS — dinheiro que ainda não saiu. Não entra nos cards de valores pagos.')
      : '',
    linhaTotal(`TOTAL ${escopo}`.trim() || 'TOTAL', () => true, 'total-geral', 'Realizado + planejado. Só coincide com os cards do topo quando não há nenhuma quinzena planejada na lista.'),
  ].join('');

  document.getElementById('btnNovaParcela').onclick = () => openNovaParcelaModal();
}

function openNovaParcelaModal() {
  const r = VIEW.resumo;
  openModal('Nova parcela (Contas a Pagar)', (body, close) => {
    const form = document.createElement('form');
    form.className = 'form-grid';
    form.innerHTML = `
      <label>Rótulo (ex.: SETEMBRO/3º PARCELA)
        <input name="label" value="NOVA PARCELA" required />
      </label>
      <label>Total empreiteiro (PIX)
        <input name="totalEmpreiteiroPix" type="number" step="0.01" value="${r.sugestaoProximaParcelaEmpreiteiro}" />
      </label>
      <label>Total ADM (PIX)
        <input name="totalAdmPix" type="number" step="0.01" value="${r.sugestaoProximaParcelaAdm}" />
      </label>
      <label>Gasto cartão
        <input name="gastoCartao" type="number" step="0.01" value="0" />
      </label>
      <label>Parcela evolução caixa
        <input name="parcelaEvolucaoCaixa" type="number" step="0.01" value="0" />
      </label>
      <label>Data em que o custo foi gerado
        <input name="dataGeracaoCusto" type="date" />
      </label>
      <label>Para qual mês/parcela ele vai ocorrer (vencimento planejado)
        <input name="vencPlanejado" type="date" />
      </label>
      <label>Vencimento real
        <input name="vencimento" type="date" />
      </label>
      <label>Status
        <select name="status"><option>PLANEJADO</option><option>REALIZADO</option></select>
      </label>
      <label style="grid-column: 1 / -1">Observação
        <textarea name="obs"></textarea>
      </label>
      <div style="grid-column: 1 / -1; display:flex; gap:8px; justify-content:flex-end;">
        <button type="button" class="btn" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn primary">Criar parcela</button>
      </div>
    `;
    form.querySelector('#cancelBtn').onclick = close;

    // Cartão é sempre pago na 1ª quinzena do mês — nunca na 2ª. Ao escolher a
    // data, detecta a quinzena e já sugere o valor de cartão lançado no
    // Detalhamento FC para aquele mês.
    const cartaoInput = form.querySelector('[name="gastoCartao"]');
    const vencField = form.querySelector('[name="vencPlanejado"]');
    vencField.addEventListener('change', () => {
      const p = periodoFromDateStr(vencField.value);
      if (!p) return;
      if (p.quinzena === 2) {
        cartaoInput.value = '0';
        cartaoInput.disabled = true;
        cartaoInput.title = 'Cartão é sempre pago na 1ª quinzena do mês — nunca na 2ª.';
      } else {
        cartaoInput.disabled = false;
        cartaoInput.title = '';
        cartaoInput.value = sugestaoCartaoDoMes(p.mes, p.quinzena);
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const payload = Object.fromEntries(new FormData(form).entries());
      const ajusteOcorreu = addParcela(payload);
      close();
      if (!ajusteOcorreu) toast('Parcela criada.');
    });
    const hint = document.createElement('div');
    hint.className = 'muted';
    hint.textContent = `Sugestão automática = medido até agora (${money(r.totalMedido)}) − já pago (${money(r.totalEmpreiteiroPago)}).`;
    body.appendChild(hint);
    body.appendChild(form);
  });
}

// Histórico de avanços — tabela única editável com avanços PLANEJADO e
// REALIZADO lado a lado, filtro por quinzena igual ao Fluxo de Caixa (mesmo
// componente renderQuinzenaFilter). Edite % novo, data, status ou observação
// de qualquer linha, ou confirme um Planejado como Realizado quando o avanço
// acontecer de fato — só REALIZADO conta no % de avanço efetivo da
// categoria (ver recomputeCategoriaPercManual).
function renderHistoricoAvancosPanel() {
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `
    <div class="panel-header">
      <div>
        <h2>Histórico de avanços — planejados e realizados</h2>
        <div class="muted">Edite o % ou a data de qualquer avanço já lançado, ou confirme o status (Planejado → Realizado) quando o avanço acontecer de fato. Um avanço Planejado fica visível aqui, mas só entra no % efetivo da categoria depois de confirmado como Realizado. Filtre por quinzena para ver só aquele período.</div>
      </div>
      <button class="btn primary" id="btnNovoAvanco">+ Novo avanço</button>
    </div>
    <div class="quinzenaFilterSlot"></div>
    <div class="table-scroll"></div>
  `;
  const periods = buildQuinzenaPeriods(VIEW.meta?.dataInicio, VIEW.meta?.previsaoTermino);
  panel.querySelector('.quinzenaFilterSlot').appendChild(renderQuinzenaFilter({
    periods,
    selected: FILTRO_QUINZENA_AVANCOS,
    onChange: (v) => { FILTRO_QUINZENA_AVANCOS = v; renderAvancos(); },
  }));
  const wrap = panel.querySelector('.table-scroll');
  const entries = [...(STATE.historicoAvancos || [])]
    .filter((h) => dataNaQuinzena(h.data, FILTRO_QUINZENA_AVANCOS))
    .sort((a, b) => (a.data || '').localeCompare(b.data || ''));
  if (!entries.length) {
    wrap.innerHTML = `<div class="muted">${FILTRO_QUINZENA_AVANCOS ? 'Nenhum avanço lançado nessa quinzena.' : 'Nenhum avanço lançado ainda.'}</div>`;
  } else {
    const tbl = document.createElement('table');
    tbl.className = 'data';
    tbl.innerHTML = `<thead><tr>
      <th>Data</th><th class="wrap">Categoria</th><th class="num">% anterior</th><th class="num">% novo</th>
      <th>Status</th><th class="wrap">Observação</th><th></th>
    </tr></thead><tbody></tbody>`;
    const tbody = tbl.querySelector('tbody');
    for (const h of entries) {
      const tr = document.createElement('tr');
      tr.appendChild(td(dateInput({ value: h.data, onSave: (v) => updateHistoricoAvanco(h.id, { data: v }) })));
      tr.appendChild(td(`<span class="wrap">${esc(h.categoriaNome)}</span>`));
      tr.appendChild(td(`<span class="num">${h.percAvancoAnterior == null ? '—' : pct(h.percAvancoAnterior)}</span>`));
      tr.appendChild(td(percentInput({ value: h.percAvancoNovo, onSave: (v) => updateHistoricoAvanco(h.id, { percAvancoNovo: v }) })));
      tr.appendChild(td(statusSelect({ value: h.status, onSave: (v) => updateHistoricoAvanco(h.id, { status: v }) })));
      marcarLinhaStatus(tr, h.status || 'REALIZADO');
      tr.appendChild(td(textInput({ value: h.obs, wide: true, onSave: (v) => updateHistoricoAvanco(h.id, { obs: v }) })));
      const delTd = document.createElement('td');
      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn'; delBtn.textContent = '🗑';
      delBtn.onclick = async () => { if (await confirmDialog(`Remover avanço de "${h.categoriaNome}"?`)) deleteHistoricoAvanco(h.id); };
      delTd.appendChild(delBtn);
      tr.appendChild(delTd);
      tbody.appendChild(tr);
    }
    wrap.appendChild(tbl);
  }
  panel.querySelector('#btnNovoAvanco').onclick = () => openNovoAvancoModal();
  return panel;
}

      <label style="grid-column: 1 / -1">Observação<input name="obs" /></label>
      <div style="grid-column: 1 / -1; display:flex; gap:8px; justify-content:flex-end;">
        <button type="button" class="btn" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn primary">Adicionar</button>
      </div>
    `;
    form.querySelector('#cancelBtn').onclick = close;
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const payload = Object.fromEntries(new FormData(form).entries());
      payload.percAvancoNovo = Number(payload.percAvancoNovo) / 100;
      addHistoricoAvanco(payload);
      close();
    });
    body.appendChild(form);
  });
}

function clampPerc(v) {
  return Math.max(0, Math.min(1, v));
}

      <div class="card-sub">Início: ${dateBR(VIEW.meta?.dataInicio)} · Término previsto: ${dateBR(VIEW.meta?.previsaoTermino)}</div>
    </div>
    <div class="card">
      <div class="card-label">Etapa PCI corrente</div>
      <div class="card-value">${etapaAtual ? `${etapaAtual.etapa} — ${esc(etapaAtual.descricao)}` : '—'}</div>

      const barStart = clampPerc((ini.getTime() - projInicio.getTime()) / projTotalMs);
      const barEnd = clampPerc((fim.getTime() - projInicio.getTime()) / projTotalMs);

// Gasto no cartão por mês/quinzena — mesma fonte e agrupamento do campo
// "Cartão" em Contas a Pagar (parcela.gastoCartao + mesReferenciaLabel), não
// recalculado a partir dos itens: garante que bate exatamente com o extrato
// do cartão (fechamento dia 05, sempre lançado na 1ª quinzena do mês — por
// isso toda linha "2º PARCELA" aparece com R$ 0,00, igual à fatura real).
function renderGastoCartaoMensal() {
  const rows = [...VIEW.parcelas]
    .filter((p) => p.mesReferenciaLabel)
    .sort((a, b) => (a.vencimento || a.vencPlanejado || '').localeCompare(b.vencimento || b.vencPlanejado || ''));
  const totalGeral = rows.reduce((a, p) => a + (Number(p.gastoCartao) || 0), 0);
  const details = document.createElement('details');
  details.className = 'scurve-table-details';
  details.innerHTML = `<summary>Ver gasto no cartão por quinzena (${money(totalGeral)} no total)</summary>`;
  const wrap = document.createElement('div');
  wrap.className = 'table-scroll';
  if (!rows.length) {
    wrap.innerHTML = '<div class="muted" style="padding:8px 0">Nenhuma parcela lançada ainda.</div>';
  } else {
    wrap.innerHTML = `<table class="data"><thead><tr><th>Mês</th><th class="num">Gasto do cartão</th></tr></thead><tbody>${rows.map((p) => `
      <tr><td>${esc(p.mesReferenciaLabel)}</td><td class="num">${money(p.gastoCartao)}</td></tr>
    `).join('')}</tbody></table>`;
  }
  details.appendChild(wrap);
  return details;
}

/* Interruptor da sincronização automática do cartão.
   -------------------------------------------------------------------------
   Ligado, a coluna "Cartão" de Contas a Pagar deixa de ser um campo digitável
   e passa a ser sempre a soma dos itens de cartão daquela fatura no
   Detalhamento FC — uma fonte só. Ligar é uma decisão com consequência
   (sobrescreve o que já está lançado), então a confirmação mostra antes,
   quinzena por quinzena, exatamente o que vai mudar. */
function switchAutoSyncCartao() {
  const ligado = !!STATE.parametros.cartaoAutoSync;
  const lab = document.createElement('label');
  lab.className = 'auto-switch';
  lab.title = ligado
    ? 'Desligue para voltar a digitar a coluna Cartão manualmente.'
    : 'Ligue para a coluna Cartão ser sempre calculada a partir dos itens do Detalhamento FC.';
  const chk = document.createElement('input');
  chk.type = 'checkbox';
  chk.checked = ligado;
  const trilho = document.createElement('span');
  trilho.className = 'trilho';
  const txt = document.createElement('span');
  txt.textContent = 'Sincronização automática';
  lab.append(chk, trilho, txt);

  chk.addEventListener('change', async () => {
    if (!chk.checked) {
      updateParametros({ cartaoAutoSync: false });
      toast('Sincronização automática desligada — a coluna Cartão voltou a ser editável.');
      return;
    }
    chk.checked = false; // só liga depois do "sim"
    const { divergentes } = conferirCartao();
    let corpo = 'A coluna "Cartão" de Contas a Pagar passa a ser sempre a soma dos itens de cartão daquela fatura no Detalhamento FC, e deixa de ser editável à mão.';
    if (divergentes.length) {
      const linhasTxt = divergentes.map((l) => {
        const nome = l.parcelaLabel || mesQuinzenaLabel(l.mes, 1);
        return `• ${nome}: ${money(l.naParcela)} → ${money(l.itens)} (${l.dif > 0 ? '+' : ''}${money(l.dif)})`;
      }).join('\n');
      const totalDif2 = round2(divergentes.reduce((a3, l) => a3 + l.dif, 0));
      corpo += `\n\nHoje ${divergentes.length} quinzena(s) estão diferentes. Ligar agora muda estes valores imediatamente:\n\n${linhasTxt}\n\nEfeito no custo total: ${totalDif2 > 0 ? '+' : ''}${money(totalDif2)}.\n\nSe alguma dessas quinzenas já estava certa, corrija antes o mês da fatura do item no Detalhamento FC — senão o valor certo será substituído.`;
    } else {
      corpo += '\n\nHoje as duas fontes já batem em todos os meses, então nada muda agora.';
    }
    if (await confirmDialog(corpo, { title: 'Ligar sincronização automática do cartão', okLabel: 'Ligar', danger: !!divergentes.length })) {
      chk.checked = true;
      updateParametros({ cartaoAutoSync: true });
      toast(divergentes.length
        ? `Sincronização automática ligada — ${divergentes.length} quinzena(s) atualizada(s).`
        : 'Sincronização automática ligada.');
    }
  });
  return lab;
}

/* Painel de conferência do cartão, no topo do Detalhamento FC.
   Mostra, mês a mês, o que os itens somam contra o que está na coluna
   "Cartão" de Contas a Pagar — e oferece o botão para igualar. */
function renderConferenciaCartao() {
  const { linhas, divergentes } = conferirCartao();
  const auto = !!STATE.parametros.cartaoAutoSync;
  const wrap = document.createElement('div');
  wrap.className = 'conf-cartao';
  if (!linhas.length) { wrap.hidden = true; return wrap; }

  if (auto || !divergentes.length) {
    wrap.className += auto ? ' auto' : ' ok';
    const cabOk = document.createElement('div');
    cabOk.className = 'conf-topo';
    cabOk.innerHTML = auto
      ? `<div><div class="conf-titulo">Cartão em sincronização automática</div>
         <div class="conf-texto">A coluna "Cartão" de Contas a Pagar é calculada a partir dos itens de cartão do Detalhamento FC, pelo mês da fatura de cada compra. Para mudar um valor, edite o item (ou o mês da fatura dele) aqui embaixo — a parcela e o custo total acompanham sozinhos.</div></div>`
      : `<div><div class="conf-titulo">Cartão conferido: o Detalhamento FC e a coluna Cartão de Contas a Pagar batem em todos os meses.</div>
         <div class="conf-texto">Ligue a sincronização automática para que continuem batendo sem precisar conferir.</div></div>`;
    const acoesOk = document.createElement('div');
    acoesOk.className = 'conf-acoes';
    acoesOk.appendChild(switchAutoSyncCartao());
    cabOk.appendChild(acoesOk);
    wrap.appendChild(cabOk);
    if (auto) wrap.appendChild(tabelaConferenciaCartao(linhas));
    return wrap;
  }

  const totalDif = round2(divergentes.reduce((a2, l) => a2 + l.dif, 0));
  const cab = document.createElement('div');
  cab.className = 'conf-topo';
  cab.innerHTML = `<div><div class="conf-titulo">Cartão não bate com Contas a Pagar em ${divergentes.length} mês(es) — diferença de ${money(totalDif)}</div>
    <div class="conf-texto">O que está lançado como item de cartão nas categorias não corresponde à coluna "Cartão" das parcelas. Enquanto isso durar, o custo total não reflete o gasto real do cartão.</div></div>`;
  const acoes = document.createElement('div');
  acoes.className = 'conf-acoes';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'btn primary small';
  btn.textContent = 'Sincronizar agora';
  btn.title = 'Faz a coluna Cartão de cada quinzena receber exatamente a soma dos itens de cartão daquela fatura.';
  btn.onclick = async () => {
    if (await confirmDialog(`Isso vai substituir a coluna "Cartão" de ${divergentes.length} quinzena(s) pela soma dos itens do Detalhamento FC, e ajustar o custo total de cada uma. Continuar?`, { title: 'Sincronizar cartão', okLabel: 'Sincronizar', danger: false })) {
      sincronizarCartaoComDetalhamento();
    }
  };
  acoes.appendChild(btn);
  acoes.appendChild(switchAutoSyncCartao());
  cab.appendChild(acoes);
  wrap.appendChild(cab);
  wrap.appendChild(tabelaConferenciaCartao(linhas));
  return wrap;
}

function tabelaConferenciaCartao(linhas) {
  const tbl = document.createElement('div');
  tbl.className = 'table-scroll';
  tbl.innerHTML = `<table class="extrato-table">
    <thead><tr><th>Fatura</th><th class="num">Itens no Detalhamento</th><th class="num">Coluna Cartão</th><th class="num">Diferença</th></tr></thead>
    <tbody>${linhas.map((l) => {
      const div = Math.abs(l.dif) > 0.02;
      return `<tr class="${div ? 'planejado-linha' : ''}">
        <td>${esc(l.parcelaLabel || mesQuinzenaLabel(l.mes, 1))}</td>
        <td class="num">${money(l.itens)}</td>
        <td class="num">${money(l.naParcela)}</td>
        <td class="num"><strong>${div ? (l.dif > 0 ? '+' : '') + money(l.dif) : '—'}</strong></td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
  return tbl;
}

      realizadoCell.appendChild(numberInput({ value: it.valorRealizado, manual: true, onSave: (v) => updateItem(c.id, it.id, { valorRealizado: v }) }));
      if (it.valorRealizadoOriginal !== undefined) {
        const warn = document.createElement('span');

        warn.style.display = 'block';
        warn.style.marginTop = '4px';
        warn.style.width = 'max-content';

        warn.title = `Valor lançado: ${money(it.valorRealizadoOriginal)}. Reduzido automaticamente para ${money(it.valorRealizado)} porque os demais itens desta categoria já somam o restante do orçado — o total da categoria nunca ultrapassa o valor orçado.`;

      if (ehCartao(it.formaPagamento)) {

          const valor = round2(Number(it.valorRealizado) || 0);
          const primeira = mesFaturaDoItem(it);
          const ok = await confirmDialog(
            `"${it.descricao}" de ${money(valor)} vira ${n} parcelas de ${money(round2(valor / n))}, uma por fatura, de ${primeira ? mesQuinzenaLabel(primeira, 1) : 'a 1ª fatura'} em diante. O valor total não muda — só passa a ser distribuído mês a mês.`,
            { title: `Parcelar em ${n}x`, okLabel: 'Parcelar', danger: false },
          );
          if (ok) parcelarItemCartao(c.id, it.id, n);
        };
        const vezes = document.createElement('span');
        vezes.className = 'parcelar-x';
        vezes.textContent = 'x';
        parcelaBox.append(qtdInp, vezes, parcelarBtn);
        formaCell.appendChild(parcelaBox);

        const destino = document.createElement('span');
        destino.className = 'cartao-destino';
        const mesDaRegra = mesFaturaDoItem(it);
        const parcelaVinc = it.cartaoVinculo ? (VIEW.parcelas || []).find((x) => x.id === it.cartaoVinculo.parcelaId) : null;
        const mesDoVinculo = parcelaVinc ? monthKeyFromDateStr(parcelaVinc.vencimento || parcelaVinc.vencPlanejado) : null;
        if (!mesDaRegra) {
          destino.className += ' pendente';
          destino.textContent = '→ informe a data';
          destino.title = 'Enquanto não houver data de compra e valor realizado, este gasto de cartão não entra em Contas a Pagar.';
        } else if (parcelaVinc && mesDoVinculo === mesDaRegra) {
          destino.textContent = `→ ${parcelaVinc.mesReferenciaLabel || parcelaVinc.label}`;
          destino.title = `Este gasto entrou em Contas a Pagar na parcela "${parcelaVinc.label}", somando ${money(it.cartaoVinculo.valor)} à coluna Cartão.`;
        } else {
          // A regra do ciclo aponta uma fatura; Contas a Pagar ainda está com
          // outra (ou com nenhuma). Mostrar as duas é mais honesto que
          // esconder a diferença — a sincronização é que resolve.
          destino.className += ' pendente';
          destino.textContent = `→ ${mesQuinzenaLabel(mesDaRegra, 1)} (a sincronizar)`;
          destino.title = parcelaVinc
            ? `Pelo ciclo do cartão este gasto pertence à fatura de ${mesQuinzenaLabel(mesDaRegra, 1)}, mas em Contas a Pagar ele ainda está em "${parcelaVinc.label}". Sincronize o cartão no topo desta aba para acertar.`
            : `Pelo ciclo do cartão este gasto pertence à fatura de ${mesQuinzenaLabel(mesDaRegra, 1)}, mas ainda não foi somado à coluna Cartão de Contas a Pagar. Sincronize o cartão no topo desta aba.`;
        }
        formaCell.appendChild(destino);
      }
      tr.appendChild(formaCell);
      const delTd = document.createElement('td');
      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn'; delBtn.textContent = '🗑';
      delBtn.onclick = async () => { if (await confirmDialog('Remover este item?')) deleteItem(c.id, it.id); };
      delTd.appendChild(delBtn);
      tr.appendChild(delTd);
      tbody.appendChild(tr);
    }
    body.appendChild(tableWrap);

    const addBtn = document.createElement('button');
    addBtn.className = 'btn small';
    addBtn.style.marginTop = '10px';
    addBtn.textContent = '+ Adicionar item';
    addBtn.onclick = () => { OPEN_CATEGORIES.add(c.id); addItem(c.id, { descricao: 'Novo item', unidade: '', valorOrcado: 0, valorRealizado: 0 }); };
    body.appendChild(addBtn);

    const parceladaBtn = document.createElement('button');
    parceladaBtn.className = 'btn small';
    parceladaBtn.style.marginTop = '10px';
    parceladaBtn.style.marginLeft = '8px';
    parceladaBtn.textContent = '💳 Lançar compra parcelada no cartão';
    parceladaBtn.onclick = () => openCompraParceladaModal(c);
    body.appendChild(parceladaBtn);

    block.appendChild(body);
    root.appendChild(block);
  }
}

function openCompraParceladaModal(categoria) {
  openModal(`Compra parcelada no cartão — ${categoria.nome}`, (body, close) => {
    const form = document.createElement('form');
    form.className = 'form-grid';
    form.innerHTML = `
      <label style="grid-column: 1 / -1">Descrição da compra
        <input name="descricao" placeholder="Ex.: Madeira para formas" required />
      </label>
      <label>Valor total (R$)
        <input name="valorTotal" type="number" step="0.01" min="0.01" required />
      </label>
      <label>Quantidade de parcelas
        <input name="qtdParcelas" type="number" step="1" min="1" value="1" />
      </label>
      <label>Data da compra
        <input name="dataCompra" type="date" value="${new Date().toISOString().slice(0, 10)}" />
      </label>
      <label>Mês da 1ª fatura (as demais seguem mês a mês)
        <input name="primeiraFatura" type="date" value="${new Date().toISOString().slice(0, 10)}" />
      </label>
      <div style="grid-column: 1 / -1; display:flex; gap:8px; justify-content:flex-end;">
        <button type="button" class="btn" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn primary">Lançar</button>
      </div>
    `;
    form.querySelector('#cancelBtn').onclick = close;
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const payload = Object.fromEntries(fd.entries());
      OPEN_CATEGORIES.add(categoria.id);
      const cp = lancarCompraParcelada(categoria.id, payload);
      close();
      if (cp) toast(`Lançado: ${money(cp.valorTotal)} em ${cp.qtdParcelas}x, somado ao cartão de ${cp.parcelasAfetadas.map((p) => p.label).join(', ')}.`);
    });
    const hint = document.createElement('div');
    hint.className = 'muted';
    hint.style.marginBottom = '8px';
    hint.textContent = 'O valor total é dividido igualmente entre as parcelas (a última absorve o arredondamento). Cada parcela vira um item no Detalhamento FC e soma automaticamente no cartão da parcela de Contas a Pagar do respectivo mês/quinzena (criando a parcela se ainda não existir).';
    body.appendChild(hint);
    body.appendChild(form);
  });
}

/* ==========================================================================
   TAB 4 — Fluxo de Caixa: lançar avanço do mês (gera parcela em Contas a Pagar)
   ========================================================================== */
function renderLancamentoQuinzenaPanel() {
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `
    <div class="panel-header">
      <div>
        <h2>Lançar avanço da quinzena</h2>
        <div class="muted">Escolha a quinzena (mês/1ª ou 2ª parcela) e informe o novo % acumulado de cada categoria que avançou — o valor orçado de cada categoria rateia o valor gerado. O sistema desconta o cartão (já lançado no Detalhamento FC), sugere o PIX ao empreiteiro e à administração, e gera automaticamente a parcela em Contas a Pagar para essa quinzena exata.</div>
      </div>
    </div>
  `;

  const periods = buildQuinzenaPeriods(VIEW.meta?.dataInicio, VIEW.meta?.previsaoTermino);
  const hoje = VIEW.resumo.dataReferenciaCronograma || new Date().toISOString().slice(0, 10);
  const periodoAtual = periodoFromDateStr(hoje);
  const defaultIdx = Math.max(0, periods.findIndex((p) => p.mes === periodoAtual?.mes && p.quinzena === periodoAtual?.quinzena));

  const periodoRow = document.createElement('div');
  periodoRow.className = 'form-grid';
  periodoRow.innerHTML = `
    <label>Quinzena
      <select id="lqPeriodo">${periods.map((p, i) => `<option value="${i}">${esc(p.label)}</option>`).join('')}</select>
    </label>
    <label>Status
      <select id="lqStatus"><option value="PLANEJADO">PLANEJADO</option><option value="REALIZADO">REALIZADO</option></select>
    </label>
    <label>Data em que o custo foi gerado
      <input id="lqDataCusto" type="date" value="${new Date().toISOString().slice(0, 10)}" />
    </label>
    <label>Gasto no cartão nesta quinzena (R$)
      <input id="lqCartao" type="number" step="0.01" value="0" />
    </label>
  `;
  periodoRow.querySelector('#lqPeriodo').value = String(defaultIdx);
  panel.appendChild(periodoRow);

  const body = document.createElement('div');
  body.className = 'table-scroll';
  body.innerHTML = `<table class="data">
    <thead><tr>
      <th>Nº</th><th class="wrap">Categoria</th><th class="num">Peso</th><th class="num">Valor orçado</th>
      <th class="num">% atual (acumulado)</th><th class="num">Novo % acumulado</th><th class="num">Valor gerado</th>
    </tr></thead>
    <tbody></tbody>
  </table>`;
  const tbody = body.querySelector('tbody');

  const rows = [];
  for (const c of VIEW.categorias) {
    const tr = document.createElement('tr');
    tr.appendChild(td(`${c.numero}`));
    tr.appendChild(td(`<span class="wrap">${esc(c.nome)}</span>`));
    tr.appendChild(td(`<span class="num">${pct(c.peso)}</span>`));
    tr.appendChild(td(`<span class="num">${money(c.valorOrcado)}</span>`));
    tr.appendChild(td(`<span class="num">${pct(c.percAvancoEfetivo)}</span>`));

    const percAtual = Math.round(c.percAvancoEfetivo * 1000) / 10;
    const novoPercInput = document.createElement('input');
    novoPercInput.type = 'number'; novoPercInput.step = '0.1'; novoPercInput.min = '0'; novoPercInput.max = '100';
    novoPercInput.className = 'cell-input';
    novoPercInput.value = percAtual;
    novoPercInput.title = 'Teto de medição: nunca mais que 100%.';
    tr.appendChild(td(novoPercInput));

    const valorGeradoCell = document.createElement('td');
    valorGeradoCell.className = 'num';
    valorGeradoCell.textContent = money(0);
    tr.appendChild(valorGeradoCell);

    tbody.appendChild(tr);
    rows.push({ categoria: c, percAtual, novoPercInput, valorGeradoCell });
  }
  panel.appendChild(body);

  const totals = document.createElement('div');
  totals.className = 'cards-grid';
  totals.style.marginTop = '4px';
  totals.innerHTML = `
    <div class="card"><div class="card-label">Valor gerado na quinzena</div><div class="card-value" id="lqValorGerado">${money(0)}</div></div>
    <div class="card"><div class="card-label">Sugestão empreiteiro (PIX)</div><div class="card-value" id="lqEmpreiteiro">${money(0)}</div></div>
    <div class="card"><div class="card-label">Sugestão administração (PIX)</div><div class="card-value" id="lqAdm">${money(0)}</div></div>
  `;
  panel.appendChild(totals);

  const obsRow = document.createElement('div');
  obsRow.className = 'form-grid';
  obsRow.style.marginTop = '4px';
  obsRow.innerHTML = `<label style="grid-column: 1 / -1">Observação<textarea id="lqObs"></textarea></label>`;
  panel.appendChild(obsRow);

  const cartaoInput = periodoRow.querySelector('#lqCartao');

  const origemCartao = document.createElement('div');
  origemCartao.className = 'cartao-origem muted';
  panel.appendChild(origemCartao);

  function quinzenaAtual() { return periods[Number(periodoRow.querySelector('#lqPeriodo').value)]; }

  function atualizarSugestaoCartao() {
    const p = quinzenaAtual();
    if (!p) return;
    if (p.quinzena === 2) {
      cartaoInput.value = '0';
      cartaoInput.disabled = true;
      cartaoInput.title = 'Cartão é sempre pago na 1ª quinzena do mês — nunca na 2ª.';
    } else {
      cartaoInput.disabled = false;
      cartaoInput.title = '';
      cartaoInput.value = sugestaoCartaoDoMes(p.mes, p.quinzena);
    }
    mostrarOrigemCartao(p);
    recalcPreview();
  }

  // De onde veio o valor do cartão: lista os itens do Detalhamento FC que
  // compõem a fatura da quinzena, para o lançamento não virar caixa-preta.
  function mostrarOrigemCartao(p) {
    origemCartao.innerHTML = '';
    if (!p || p.quinzena === 2) {
      origemCartao.className = 'cartao-origem muted';
      origemCartao.textContent = 'Cartão é sempre cobrado na 1ª quinzena — nesta não entra cartão.';
      return;
    }
    const itens = itensCartaoDoMes(p.mes, p.quinzena);
    if (!itens.length) {
      origemCartao.className = 'cartao-origem muted';
      origemCartao.textContent = 'Nenhum gasto de cartão lançado no Detalhamento FC para este mês. Se houver fatura, lance lá — o valor vem sozinho para cá.';
      return;
    }
    const total = round2(itens.reduce((a2, i) => a2 + i.valor, 0));
    origemCartao.className = 'cartao-origem';
    origemCartao.innerHTML = `<div class="cartao-origem-titulo">Cartão de ${money(total)} vindo do Detalhamento FC — ${itens.length} lançamento(s)</div>`
      + itens.map((i) => `<div class="cartao-origem-item"><span>${esc(i.descricao)} <span class="muted">· ${esc(i.categoria)}</span></span><span class="mono">${money(i.valor)}</span></div>`).join('');
  }

  function recalcPreview() {
    let valorGeradoPeriodo = 0;
    for (const r of rows) {
      const novoPerc = Math.min(100, Math.max(0, Number(r.novoPercInput.value) || 0));
      const deltaValor = r.categoria.valorOrcado * ((novoPerc - r.percAtual) / 100);
      r.valorGeradoCell.textContent = money(deltaValor);
      r.valorGeradoCell.style.color = deltaValor > 0.004 ? 'var(--good)' : deltaValor < -0.004 ? 'var(--danger)' : '';
      valorGeradoPeriodo += deltaValor;
    }
    const gastoCartao = Number(cartaoInput.value) || 0;
    const taxaAdm = VIEW.parametros.taxaAdministracaoPercent || 0;
    const empreiteiro = Math.max(0, valorGeradoPeriodo - gastoCartao);
    const adm = (empreiteiro + gastoCartao) * taxaAdm;
    panel.querySelector('#lqValorGerado').textContent = money(valorGeradoPeriodo);
    panel.querySelector('#lqEmpreiteiro').textContent = money(empreiteiro);
    panel.querySelector('#lqAdm').textContent = money(adm);
  }
  rows.forEach((r) => r.novoPercInput.addEventListener('input', recalcPreview));
  cartaoInput.addEventListener('input', recalcPreview);
  periodoRow.querySelector('#lqPeriodo').addEventListener('change', atualizarSugestaoCartao);
  atualizarSugestaoCartao();

  const actions = document.createElement('div');
  actions.style.cssText = 'display:flex; justify-content:flex-end; margin-top:12px;';
  const submitBtn = document.createElement('button');
  submitBtn.className = 'btn primary';
  submitBtn.textContent = 'Lançar avanço e gerar parcela';
  submitBtn.onclick = () => {
    const avancos = rows
      .filter((r) => Math.abs(Number(r.novoPercInput.value) - r.percAtual) > 0.001)
      .map((r) => ({ categoriaId: r.categoria.id, novoPerc: Math.min(1, Math.max(0, Number(r.novoPercInput.value) / 100)) }));
    if (!avancos.length) { toast('Altere o % de ao menos uma categoria.', true); return; }
    const p = quinzenaAtual();
    const resultado = lancamentoQuinzena({
      mes: p.mes,
      quinzena: p.quinzena,
      avancos,
      gastoCartao: Number(cartaoInput.value) || 0,
      dataGeracaoCusto: periodoRow.querySelector('#lqDataCusto').value || null,
      status: periodoRow.querySelector('#lqStatus').value,
      obs: obsRow.querySelector('#lqObs').value,
    });
    if (resultado.ok) {
      renderAll();
      if (!resultado.ajusteOcorreu) toast(`Avanço lançado — parcela "${resultado.label}" atualizada em Contas a Pagar.`);
    }
  };
  actions.appendChild(submitBtn);
  panel.appendChild(actions);

  return panel;
}

// Liberações reais do CAIXA: cada medição efetivamente paga pelo banco,
// lançada manualmente conforme o extrato, mais o valor que o CAIXA já passou
// do lote (taxas e projetos, financiado junto da aquisição do lote). É essa
// soma — não o cronograma de etapas acima — que define
// resumo.caixaLiberadaAcumulada e o card "Valor caixa liberado".
function renderLiberacoesCaixaPanel() {
  const panel = document.createElement('div');
  panel.className = 'panel';
  const custoLoteExecutado = Number((VIEW.parametros || {}).custoLoteExecutado) || 0;
  panel.innerHTML = `
    <div class="panel-header">
      <div>
        <h2>Liberações reais do CAIXA</h2>
        <div class="muted">Lance aqui cada medição do banco (data, valor e status). Marque como Planejado uma medição ainda não confirmada e mude para Realizado quando o banco liberar de fato — só Realizado entra no total liberado e no card "Valor caixa liberado". A soma das medições Realizado com o valor que o CAIXA já passou do lote (${money(custoLoteExecutado)}, ajustável em Parâmetros) é o card "Valor caixa liberado". Filtre por quinzena para ver só as liberações daquele período (o valor do lote, sem data específica, some do filtro).</div>
      </div>
      <button class="btn primary" id="btnNovaLiberacao">+ Nova liberação</button>
    </div>
    <div class="quinzenaFilterSlot"></div>
    <div class="table-scroll"></div>
  `;
  const periodsPci = buildQuinzenaPeriods(VIEW.meta?.dataInicio, VIEW.meta?.previsaoTermino);
  panel.querySelector('.quinzenaFilterSlot').appendChild(renderQuinzenaFilter({
    periods: periodsPci,
    selected: FILTRO_QUINZENA_PCI,
    onChange: (v) => { FILTRO_QUINZENA_PCI = v; renderPCI(); },
  }));
  const wrap = panel.querySelector('.table-scroll');
  const liberacoes = (VIEW.liberacoesCaixa || []).filter((l) => dataNaQuinzena(l.data, FILTRO_QUINZENA_PCI));
  const mostrarLote = !FILTRO_QUINZENA_PCI && custoLoteExecutado > 0;
  const loteRow = mostrarLote
    ? `<tr>
        <td>—</td>
        <td class="num">${money(custoLoteExecutado)}</td>
        <td><span class="badge green">REALIZADO</span></td>
        <td class="wrap">Valor que o CAIXA já passou do lote (taxas e projetos)</td>
        <td></td>
      </tr>`
    : '';
  // Só REALIZADO conta no total efetivamente liberado (mesmo valor de
  // resumo.caixaLiberadaAcumulada) — uma liberação PLANEJADO fica registrada
  // mas ainda não aconteceu de fato, igual às parcelas e avanços PLANEJADO.
  const totalFiltrado = (mostrarLote ? custoLoteExecutado : 0)
    + liberacoes.filter((l) => l.status !== 'PLANEJADO').reduce((a, l) => a + (Number(l.valor) || 0), 0);
  if (!liberacoes.length && !mostrarLote) {
    wrap.innerHTML = `<div class="muted">${FILTRO_QUINZENA_PCI ? 'Nenhuma liberação lançada nessa quinzena.' : 'Nenhuma liberação lançada ainda.'}</div>`;
  } else {
    const tbl = document.createElement('table');
    tbl.className = 'data';
    tbl.innerHTML = `<thead><tr><th>Data</th><th class="num">Valor</th><th>Status</th><th class="wrap">Observação</th><th></th></tr></thead>
      <tbody>${loteRow}</tbody>
      <tfoot><tr><td>${FILTRO_QUINZENA_PCI ? 'TOTAL REALIZADO (quinzena filtrada)' : 'TOTAL REALIZADO'}</td><td class="num">${money(FILTRO_QUINZENA_PCI ? totalFiltrado : VIEW.resumo.caixaLiberadaAcumulada)}</td><td colspan="3"></td></tr></tfoot>`;
    const tbody = tbl.querySelector('tbody');
    for (const l of liberacoes) {
      const tr = document.createElement('tr');
      tr.appendChild(td(dateInput({ value: l.data, onSave: (v) => updateLiberacaoCaixa(l.id, { data: v }) })));
      tr.appendChild(td(moneyInput({ value: l.valor, onSave: (v) => updateLiberacaoCaixa(l.id, { valor: v }) })));
      tr.appendChild(td(statusSelect({ value: l.status, onSave: (v) => updateLiberacaoCaixa(l.id, { status: v }) })));
      marcarLinhaStatus(tr, l.status || 'REALIZADO');
      tr.appendChild(td(textInput({ value: l.obs, wide: true, onSave: (v) => updateLiberacaoCaixa(l.id, { obs: v }) })));
      const delTd = document.createElement('td');
      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn'; delBtn.textContent = '🗑';
      delBtn.onclick = async () => { if (await confirmDialog('Remover esta liberação?')) deleteLiberacaoCaixa(l.id); };
      delTd.appendChild(delBtn);
      tr.appendChild(delTd);
      tbody.appendChild(tr);
    }
    wrap.appendChild(tbl);
  }
  panel.querySelector('#btnNovaLiberacao').onclick = () => openNovaLiberacaoCaixaModal();
  return panel;
}

/* ==========================================================================
   Modal genérico
   ========================================================================== */
// Confirmação em modal próprio (não usa window.confirm) — o Artifact roda
// dentro de um iframe sandbox que bloqueia diálogos nativos do navegador
// (confirm/alert/prompt): "if (confirm(...))" sempre falso lá, então os
// botões de excluir pareciam não fazer nada. Retorna uma Promise<boolean>.
function confirmDialog(message, { title = 'Confirmar', okLabel = 'Remover', danger = true } = {}) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (v, close) => { if (!done) { done = true; resolve(v); } close(); };
    openModal(title, (body, close) => {
      body.innerHTML = `<p style="margin:0 0 16px; white-space:pre-wrap;">${esc(message)}</p>`;
      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex; gap:8px; justify-content:flex-end;';
      const cancelBtn = document.createElement('button');
      cancelBtn.type = 'button'; cancelBtn.className = 'btn'; cancelBtn.textContent = 'Cancelar';
      cancelBtn.onclick = () => finish(false, close);
      const okBtn = document.createElement('button');
      okBtn.type = 'button'; okBtn.className = danger ? 'btn danger' : 'btn primary'; okBtn.textContent = okLabel;
      okBtn.onclick = () => finish(true, close);
      actions.appendChild(cancelBtn);
      actions.appendChild(okBtn);
      body.appendChild(actions);
      const backdrop = body.closest('.modal-backdrop');
      if (backdrop) {
        backdrop.querySelector('.modal-close').onclick = () => finish(false, close);
        backdrop.addEventListener('click', (e) => { if (e.target === backdrop) finish(false, close); });
      }
      okBtn.focus();
    });
  });
}

function openModal(title, buildBody, opts = {}) {
  const tpl = document.getElementById('tpl-modal');
  const node = tpl.content.cloneNode(true);
  const backdrop = node.querySelector('.modal-backdrop');
  if (opts.wide) node.querySelector('.modal').classList.add('wide');
  node.querySelector('h3').textContent = title;
  const body = node.querySelector('.modal-body');
  const close = () => backdrop.remove();
  node.querySelector('.modal-close').onclick = close;
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
  buildBody(body, close);
  document.body.appendChild(node);
}

/* ==========================================================================
   Ajuda contextual — esconde os textos explicativos atrás de um "i"
   --------------------------------------------------------------------------
   A tela do app estava tomada por parágrafos de explicação embaixo de cada
   título e de cada card. Aqui esses textos continuam existindo (ninguém
   perde a explicação), mas saem da tela: viram o conteúdo de um popover
   aberto por um botãozinho "i" ao lado do título. A varredura é genérica e
   roda depois de qualquer re-render (MutationObserver), então vale para
   TODAS as abas e para painéis criados depois — não é preciso alterar cada
   render individualmente.
   ========================================================================== */

// Só vira "i" o texto que é realmente explicação. Subtítulos curtos que
// carregam número (ex.: "Executado: R$ 390.706,66 · 36,12%") continuam
// visíveis, porque neles o texto É o dado.
const INFO_MIN_LEN_PANEL = 55;
const INFO_MIN_LEN_CARD = 78;

function closeAllInfoPops(except) {
  document.querySelectorAll('.info-pop').forEach((p) => {
    if (p === except) return;
    p.hidden = true;
    const btn = p.parentElement && p.parentElement.querySelector('.info-btn');
    if (btn) btn.setAttribute('aria-expanded', 'false');
  });
}

function makeInfoHost(text, html) {
  const host = document.createElement('span');
  host.className = 'info-host';

  const btn = document.createElement('button');
  btn.type = 'button';
  // .filter-control: é controle de visualização, não de dados — continua
  // clicável mesmo no modo somente leitura.
  btn.className = 'info-btn filter-control';
  btn.textContent = 'i';
  btn.title = 'Ver explicação';
  btn.setAttribute('aria-label', 'Ver explicação');
  btn.setAttribute('aria-expanded', 'false');

  const pop = document.createElement('div');
  pop.className = 'info-pop';
  pop.hidden = true;
  if (html) pop.innerHTML = html; else pop.textContent = text;

  btn.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const wasOpen = !pop.hidden;
    closeAllInfoPops();
    if (wasOpen) return;
    pop.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    // Se o popover estourar a borda direita da tela, ancora pela direita.
    pop.classList.remove('right');
    const r = pop.getBoundingClientRect();
    if (r.right > window.innerWidth - 8) pop.classList.add('right');
  });
  pop.addEventListener('click', (e) => e.stopPropagation());

  host.appendChild(btn);
  host.appendChild(pop);
  return host;
}

document.addEventListener('click', () => closeAllInfoPops());
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllInfoPops(); });

function applyInfoIcons(root) {
  if (!root) return;

  // 1) Subtítulo explicativo logo abaixo do título de um painel.
  root.querySelectorAll('.panel-header .muted').forEach((el) => {
    if (el.dataset.infoDone || el.closest('.info-pop')) return;
    const txt = (el.textContent || '').trim();
    const head = el.parentElement ? el.parentElement.querySelector('h2, h3') : null;
    if (!head || txt.length < INFO_MIN_LEN_PANEL) { el.dataset.infoDone = 'skip'; return; }
    el.dataset.infoDone = '1';
    el.hidden = true;
    if (head.dataset.infoAttached) return;
    head.dataset.infoAttached = '1';
    head.appendChild(document.createTextNode(' '));
    head.appendChild(makeInfoHost(txt));
  });

  // 2) Rodapé explicativo dos cards de KPI (o ".card-sub" comprido).
  root.querySelectorAll('.card').forEach((card) => {
    const sub = card.querySelector('.card-sub');
    const label = card.querySelector('.card-label');
    if (!sub || sub.dataset.infoDone || !label) return;
    const txt = (sub.textContent || '').trim();
    if (txt.length < INFO_MIN_LEN_CARD) { sub.dataset.infoDone = 'skip'; return; }
    sub.dataset.infoDone = '1';
    sub.hidden = true;
    if (label.dataset.infoAttached) return;
    label.dataset.infoAttached = '1';
    label.appendChild(document.createTextNode(' '));
    label.appendChild(makeInfoHost(txt));
  });

  // 3) Qualquer outro parágrafo explicativo marcado com .info-collapse
  //    (usado, por ex., no rodapé do quadro de detalhe da categoria).
  root.querySelectorAll('.info-collapse').forEach((el) => {
    if (el.dataset.infoDone || el.closest('.info-pop')) return;
    const anchor = el.dataset.infoAnchor
      ? (el.closest('.panel, .painel-select-detail') || root).querySelector(el.dataset.infoAnchor)
      : null;
    const txt = (el.textContent || '').trim();
    if (!anchor || !txt) { el.dataset.infoDone = 'skip'; return; }
    el.dataset.infoDone = '1';
    el.hidden = true;
    if (anchor.dataset.infoAttached) return;
    anchor.dataset.infoAttached = '1';
    anchor.appendChild(document.createTextNode(' '));
    anchor.appendChild(makeInfoHost(txt));
  });
}

/* Colunas dos cards: linhas sempre cheias.
   -------------------------------------------------------------------------
   Com "auto-fit" o navegador enfia quantas colunas couberem e sobra uma
   caixa órfã na linha de baixo, com um vazio enorme do lado. Aqui a conta é
   outra: descobrimos quantas colunas cabem e escolhemos o maior número que
   DIVIDE a quantidade de caixas — 6 caixas viram 6 (ou 3, ou 2), 10 viram 5.
   Assim nenhuma linha fica pela metade. Se a quantidade for um número que
   não divide bem (7, 11...), usamos o máximo que cabe, que ainda é melhor
   do que deixar buraco no meio. */
function ajustarCardsGrid(grid) {
  const n = grid.children.length;
  const w = grid.clientWidth;
  if (!n || !w) return;
  const gap = window.innerWidth <= 720 ? 10 : 12;
  const minCard = window.innerWidth <= 720 ? 150 : (window.innerWidth <= 1024 ? 185 : 180);
  let cabem = Math.max(1, Math.floor((w + gap - 2) / (minCard + gap)));
  cabem = Math.min(cabem, n);
  let cols = 1;
  for (let k = cabem; k >= 1; k -= 1) { if (n % k === 0) { cols = k; break; } }
  if (cols * 2 < cabem) cols = cabem;
  grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
}

function ajustarGrids() {
  document.querySelectorAll('#app .cards-grid').forEach(ajustarCardsGrid);
}

let AJUSTE_GRID_T = null;
window.addEventListener('resize', () => {
  clearTimeout(AJUSTE_GRID_T);
  AJUSTE_GRID_T = setTimeout(ajustarGrids, 120);
});

let INFO_PASS_SCHEDULED = false;
const INFO_OBSERVER = new MutationObserver(() => {
  if (INFO_PASS_SCHEDULED) return;
  INFO_PASS_SCHEDULED = true;
  requestAnimationFrame(() => {
    INFO_PASS_SCHEDULED = false;
    INFO_OBSERVER.disconnect();
    try { applyInfoIcons(document.getElementById('app')); ajustarGrids(); } finally { startInfoObserver(); }
  });
});
function startInfoObserver() {
  const app = document.getElementById('app');
  if (app) INFO_OBSERVER.observe(app, { childList: true, subtree: true });
}
