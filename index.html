const fmtBRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtNum = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 });
function money(v) { return fmtBRL.format(Number(v) || 0); }
function pct(v) { return `${fmtNum.format((Number(v) || 0) * 100)}%`; }
function dateBR(iso) {
  if (!iso) return '—';
  const s = String(iso).slice(0, 10);
  const [y, m, d] = s.split('-');
  if (!y || !m || !d) return s;
  return `${d}/${m}/${y}`;
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const MONTH_NAMES_PT = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
function mesParcelaLabel(dateStr) {
  if (!dateStr) return '';
  const [y, m, d] = String(dateStr).slice(0, 10).split('-').map(Number);
  if (!y || !m || !d) return '';
  const quinzena = d <= 15 ? '1º' : '2º';
  return `${MONTH_NAMES_PT[m - 1].toUpperCase()}/${quinzena} PARCELA`;
}

// Rótulo "Mês/Ano — 1ª/2ª Parcela" a partir de um mês (YYYY-MM) + quinzena (1|2).
function mesQuinzenaLabel(mes, quinzena) {
  if (!mes) return 'Sem data';
  const [y, m] = mes.split('-');
  return `${MONTH_NAMES_PT[Number(m) - 1]}/${y} — ${quinzena}ª Parcela`;
}

// {mes, quinzena} a partir de uma data 'YYYY-MM-DD' (dia ≤15 = 1ª parcela).
function periodoFromDateStr(dateStr) {
  if (!dateStr) return null;
  const [y, m, d] = String(dateStr).slice(0, 10).split('-').map(Number);
  if (!y || !m || !d) return null;
  return { mes: `${y}-${String(m).padStart(2, '0')}`, quinzena: d <= 15 ? 1 : 2 };
}

// Lista todos os períodos (mês/quinzena) entre o início da obra e a previsão de
// término, na mesma convenção de data usada nas parcelas reais (dia 10 = 1ª
// parcela, dia 25 = 2ª) — usada para o seletor de período em "Lançar Avanços".
function buildQuinzenaPeriods(dataInicio, previsaoTermino) {
  const out = [];
  if (!dataInicio) return out;
  let [y, m] = dataInicio.slice(0, 7).split('-').map(Number);
  const [yEnd, mEnd] = (previsaoTermino || dataInicio).slice(0, 7).split('-').map(Number);
  let guard = 0;
  while ((y < yEnd || (y === yEnd && m <= mEnd)) && guard < 120) {
    const mes = `${y}-${String(m).padStart(2, '0')}`;
    out.push({ mes, quinzena: 1, vencPlanejado: `${mes}-10`, label: mesQuinzenaLabel(mes, 1) });
    out.push({ mes, quinzena: 2, vencPlanejado: `${mes}-25`, label: mesQuinzenaLabel(mes, 2) });
    m += 1;
    if (m > 12) { m = 1; y += 1; }
    guard += 1;
  }
  return out;
}

// true se a data (YYYY-MM-DD) cair dentro da quinzena selecionada ({mes, quinzena}).
function dataNaQuinzena(dateStr, filtro) {
  if (!filtro) return true;
  const p = periodoFromDateStr(dateStr);
  return !!p && p.mes === filtro.mes && p.quinzena === filtro.quinzena;
}

// Seletor "Filtrar por quinzena" reutilizável nas abas Lançar Avanços,
// Cronograma de Obra, Fluxo de Caixa e Liberação PCI — filtra a tabela

// Seletor "Filtrar por mês" — variante mais simples do filtro de quinzena,
// usada em Contas a Pagar (mostra as duas parcelas do mês juntas, já que a
// tabela ali é o documento enviado ao cliente por mês). `months` é a lista
// de mesReferencia ("2026-09") já presentes na tabela, na ordem em que
// devem aparecer.
/* Pílulas de quinzena para filtrar uma tabela — uma só selecionada por vez.
   Reaproveita o visual do seletor do "Custo total do período" para que
   filtrar signifique a mesma coisa nas duas telas. */
function renderQuinzenaChips({ selecionada, onChange }) {
  const parcelas = VIEW.parcelas || [];
  const mapa = new Map();
  for (const p of parcelas) {
    if (!p.mesReferencia) continue;
    const key = `${p.mesReferencia}|${p.quinzena || 1}`;
    if (!mapa.has(key)) mapa.set(key, { mes: p.mesReferencia, quinzena: p.quinzena || 1, label: p.mesReferenciaLabel || mesQuinzenaLabel(p.mesReferencia, p.quinzena || 1) });
  }
  const periodos = [...mapa.values()].sort((a, b) => a.mes.localeCompare(b.mes) || a.quinzena - b.quinzena);

  const wrap = document.createElement('div');
  wrap.className = 'qz-picker';

  const barra = document.createElement('div');
  barra.className = 'qz-toolbar';
  const btnTodas = document.createElement('button');
  btnTodas.type = 'button';
  btnTodas.className = `btn small filter-control${selecionada ? '' : ' primary'}`;
  btnTodas.textContent = 'Todas as quinzenas';
  btnTodas.onclick = () => onChange(null);
  barra.appendChild(btnTodas);
  const contador = document.createElement('span');
  contador.className = 'qz-count';
  const atual = selecionada ? periodos.find((p) => `${p.mes}|${p.quinzena}` === selecionada) : null;
  contador.textContent = atual ? atual.label : `${periodos.length} quinzenas lançadas`;
  barra.appendChild(contador);
  wrap.appendChild(barra);

  const grupos = document.createElement('div');
  grupos.className = 'qz-groups';
  const porMes = new Map();
  for (const p of periodos) {
    if (!porMes.has(p.mes)) porMes.set(p.mes, []);
    porMes.get(p.mes).push(p);
  }
  for (const [mes, lista] of porMes) {
    const grupo = document.createElement('div');
    grupo.className = 'qz-group';
    const [ano, m] = mes.split('-');
    const rotulo = document.createElement('span');
    rotulo.className = 'qz-month';
    rotulo.textContent = `${MONTH_NAMES_PT[Number(m) - 1].slice(0, 3)}/${ano.slice(2)}`;
    grupo.appendChild(rotulo);
    for (const p of lista) {
      const key = `${p.mes}|${p.quinzena}`;
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = `qz-chip filter-control${selecionada === key ? ' on' : ''}`;
      chip.textContent = `${p.quinzena}ª`;
      chip.title = p.label;
      chip.onclick = () => onChange(selecionada === key ? null : key);
      grupo.appendChild(chip);
    }
    grupos.appendChild(grupo);
  }
  wrap.appendChild(grupos);
  return wrap;
}

// "Saldo em conta": liberações do CAIXA menos custo total das parcelas, só a
// partir de `marco` (Junho/2ª — ver STATE.resumo.marcoSaldoConta) até
// `ateData` (inclusive; null = sem limite superior). `incluirPlanejado`
// decide se conta só REALIZADO ou também PLANEJADO — mesma lógica de
// saldoContaNoPeriodo() em recompute(), duplicada aqui porque o filtro
// (janela 2) é só do cliente, sem recalcular STATE inteiro a cada mudança.
function saldoContaAte(liberacoesCaixa, parcelas, marco, ateData, incluirPlanejado) {
  const entradas = (liberacoesCaixa || [])
    .filter((l) => (incluirPlanejado || l.status !== 'PLANEJADO') && (l.data || '') >= marco && (!ateData || (l.data || '') <= ateData))
    .reduce((a, l) => a + (Number(l.valor) || 0), 0);
  const saidas = (parcelas || [])
    .filter((p) => {
      if (!incluirPlanejado && p.status !== 'REALIZADO') return false;
      const dataOcorrencia = p.vencimento || p.vencPlanejado || '';
      return dataOcorrencia >= marco && (!ateData || dataOcorrencia <= ateData);
    })
    .reduce((a, p) => a + (Number(p.custoTotal) || 0), 0);
  return Math.round((entradas - saidas) * 100) / 100;
}

// Constrói um painel de "saldo em conta" com seu próprio filtro "até qual
// quinzena" — usado para as duas janelas do Dashboard Executivo (uma conta
// só REALIZADO, a outra REALIZADO + PLANEJADO). Cada janela tem seu próprio
// filtro independente (getFiltro/setFiltro apontam para variáveis
// diferentes), então dá pra comparar, por exemplo, "o que já foi realizado
// até Julho" com "o projetado até Dezembro" ao mesmo tempo.
function renderSaldoContaPanel({ title, subtitle, filtroLabel, getFiltro, setFiltro, incluirPlanejado, marco, periodos, liberacoesCaixa, parcelas, rerender, padrao }) {
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `
    <div class="panel-header"><div>
      <h2>${esc(title)}</h2>
      <div class="muted">${subtitle}</div>
    </div></div>
    <div class="saldo-conta-linha">
      <div class="saldoContaFiltroSlot"></div>
      <div class="card-value saldo-conta-valor"></div>
    </div>
  `;

  const ultimoPeriodo = periodos[periodos.length - 1] || null;
  const selecionado = getFiltro() || padrao || ultimoPeriodo;

  const filtroWrap = document.createElement('div');
  filtroWrap.className = 'form-grid';
  filtroWrap.style.maxWidth = '250px';
  filtroWrap.innerHTML = `<label>${esc(filtroLabel)}
    <select class="cell-input filter-control">
      ${periodos.map((p) => `<option value="${p.mes}|${p.quinzena}">${esc(p.label)}</option>`).join('')}
    </select>
  </label>`;
  const select = filtroWrap.querySelector('select');
  if (selecionado) select.value = `${selecionado.mes}|${selecionado.quinzena}`;
  select.addEventListener('change', () => {
    const [mes, quinzena] = select.value.split('|');
    setFiltro(periodos.find((p) => p.mes === mes && p.quinzena === Number(quinzena)) || null);
    rerender();
  });
  panel.querySelector('.saldoContaFiltroSlot').appendChild(filtroWrap);

  const ateData = selecionado ? selecionado.vencPlanejado : null;
  const valor = saldoContaAte(liberacoesCaixa, parcelas, marco, ateData, incluirPlanejado);
  const valorEl = panel.querySelector('.card-value');
  valorEl.textContent = money(valor);
  valorEl.style.color = valor < 0 ? 'var(--danger)' : 'var(--good)';

  /* Saldo negativo não é só um número vermelho: significa que a obra vai
     consumir recurso próprio naquela data. Dizemos quanto, e quanto sobraria
     da verba própria depois disso — que é a decisão real por trás do sinal. */
  if (valor < 0) {
    const falta = round2(Math.abs(valor));
    const disponivel = Number(VIEW.resumo.saldoRecursoDisponivel) || 0;
    const sobra = round2(disponivel - falta);
    const aviso = document.createElement('div');
    aviso.className = `saldo-negativo${sobra < 0 ? ' critico' : ''}`;
    aviso.innerHTML = sobra < 0
      ? `<strong>Faltam ${money(falta)} nessa data.</strong> O recurso próprio disponível (${money(disponivel)}) não cobre — ficariam ${money(Math.abs(sobra))} descobertos. É preciso antecipar medição da CAIXA ou remanejar parcelas.`
      : `<strong>Faltam ${money(falta)} nessa data</strong>, que serão consumidos da verba de recurso próprio. Restariam ${money(sobra)} dos ${money(disponivel)} disponíveis hoje.`;
    panel.appendChild(aviso);
  }

  return panel;
}

// As duas "janelas" de saldo em conta do Dashboard Executivo: uma conta só
// REALIZADO, a outra também soma o PLANEJADO (medições CAIXA planejadas e
// custos planejados) — cada uma com seu próprio filtro "até qual quinzena",
// do marco (Junho/2ª) até o fim do contrato.
/* A janela projetada abre sempre na próxima quinzena a vencer — uma
   quinzena à frente de hoje. Ver o saldo no fim do contrato é informação de
   planejamento; o que se decide no dia a dia é a posição de caixa da
   quinzena que está chegando. Trocar o filtro na mão continua valendo e a
   escolha se mantém enquanto a aba estiver aberta. */
function proximaQuinzena(periodos, hoje) {
  return periodos.find((p) => p.vencPlanejado > hoje) || periodos[periodos.length - 1] || null;
}

function renderSaldoContaGrid() {
  const r = VIEW.resumo;
  const marco = r.marcoSaldoConta;
  const periodos = buildQuinzenaPeriods(VIEW.meta?.dataInicio, VIEW.meta?.previsaoTermino).filter((p) => p.vencPlanejado >= marco);

  const grid = document.createElement('div');
  grid.className = 'scurve-grid';
  grid.appendChild(renderSaldoContaPanel({
    title: 'Saldo em conta (realizado)',
    subtitle: `Liberações do CAIXA já realizadas menos o custo total já realizado (coluna "Custo total" de Contas a Pagar), contando de ${dateBR(marco)} até a quinzena escolhida — antes do marco, Maio e Junho/1ª foram cobertos por recurso próprio.`,
    filtroLabel: 'Contar até',
    getFiltro: () => FILTRO_SALDO_CONTA_REALIZADO_ATE,
    setFiltro: (v) => { FILTRO_SALDO_CONTA_REALIZADO_ATE = v; },
    incluirPlanejado: false,
    marco, periodos,
    liberacoesCaixa: VIEW.liberacoesCaixa, parcelas: VIEW.parcelas,
    rerender: renderPainel,
  }));
  grid.appendChild(renderSaldoContaPanel({
    title: 'Saldo em conta projetado (com planejado)',
    subtitle: 'Mesmo cálculo, mas somando também o que está PLANEJADO — medições do CAIXA planejadas e custos (parcelas) planejados — até a quinzena escolhida.',
    filtroLabel: 'Projetar até',
    getFiltro: () => FILTRO_SALDO_CONTA_ATE,
    setFiltro: (v) => { FILTRO_SALDO_CONTA_ATE = v; },
    incluirPlanejado: true,
    padrao: proximaQuinzena(periodos, r.dataReferenciaCronograma),
    marco, periodos,
    liberacoesCaixa: VIEW.liberacoesCaixa, parcelas: VIEW.parcelas,
    rerender: renderPainel,
  }));
  return grid;
}

// "Custo total do período": soma o "Custo total" (mesma coluna de Contas a
// Pagar, respeitando overrides) das quinzenas marcadas — qualquer status
// (REALIZADO ou PLANEJADO), já que aqui é "quanto custou/vai custar essa
// quinzena", não um saldo em conta. Lista só as quinzenas que já têm
// alguma parcela lançada (não o calendário inteiro do contrato). Por
// padrão todas vêm marcadas (soma o total geral); desmarcando dá pra
// somar só uma ou algumas quinzenas específicas.
/* Qual quinzena é "a de hoje".
   -------------------------------------------------------------------------
   Dia 1 a 15 é a 1ª quinzena do mês; 16 em diante, a 2ª. Se aquela quinzena
   ainda não tem parcela lançada, cai na primeira lançada dali para frente e,
   não havendo nenhuma, na última do histórico — assim a tela nunca abre
   vazia. */
function quinzenaCorrenteKey(periods) {
  if (!periods.length) return null;
  const hoje = (VIEW.resumo && VIEW.resumo.dataReferenciaCronograma) || new Date().toISOString().slice(0, 10);
  const mes = hoje.slice(0, 7);
  const quinzena = Number(hoje.slice(8, 10)) <= 15 ? 1 : 2;
  const exata = periods.find((p) => p.mes === mes && p.quinzena === quinzena);
  if (exata) return `${exata.mes}|${exata.quinzena}`;
  const adiante = periods.find((p) => p.mes > mes || (p.mes === mes && p.quinzena >= quinzena));
  const alvo = adiante || periods[periods.length - 1];
  return `${alvo.mes}|${alvo.quinzena}`;
}

function renderCustoTotalPeriodoPanel() {
  const parcelas = VIEW.parcelas || [];
  const periodsMap = new Map();
  for (const p of parcelas) {
    if (!p.mesReferencia) continue;
    const key = `${p.mesReferencia}|${p.quinzena || 1}`;
    if (!periodsMap.has(key)) {
      periodsMap.set(key, { mes: p.mesReferencia, quinzena: p.quinzena || 1, label: p.mesReferenciaLabel || mesQuinzenaLabel(p.mesReferencia, p.quinzena || 1) });
    }
  }
  const periods = [...periodsMap.values()].sort((a, b) => a.mes.localeCompare(b.mes) || a.quinzena - b.quinzena);

  // Abre sempre na quinzena de hoje. Quem chega nesta tela quer saber quanto
  // custa a quinzena corrente, não o acumulado da obra inteira — o acumulado
  // continua a um clique, no atalho "Tudo".
  const chaveCorrente = quinzenaCorrenteKey(periods);
  if (FILTRO_CUSTO_TOTAL_QUINZENAS === null) {
    FILTRO_CUSTO_TOTAL_QUINZENAS = new Set(chaveCorrente ? [chaveCorrente] : periods.map((p) => `${p.mes}|${p.quinzena}`));
  }

  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `
    <div class="panel-header">
      <div>
        <h2>Custo total do período</h2>
        <div class="muted">Abre na quinzena de hoje${chaveCorrente ? ` (${esc(periods.find((p) => `${p.mes}|${p.quinzena}` === chaveCorrente)?.label || '')})` : ''}. Soma o "Custo total" das quinzenas marcadas (mesma coluna de Contas a Pagar). Clique numa quinzena para incluir ou tirar do total; clique no nome do mês para o mês inteiro; "Tudo" mostra o acumulado da obra. Quinzenas já realizadas ficam preenchidas quando marcadas; as ainda planejadas ficam só contornadas.</div>
      </div>
    </div>
    <div class="qz-picker"></div>
    <button type="button" class="value-drill filter-control" id="custoTotalPeriodoValor" title="Clique para ver o extrato — de onde sai esse número">
      <span class="drill-value card-value" style="font-size:25px; font-weight:700;"></span>
      <span class="drill-hint">ver extrato</span>
    </button>
  `;

  // Seletor de quinzenas: em vez de uma fileira de checkboxes soltos, as
  // quinzenas vêm agrupadas por mês em botões-pílula. Clicar no nome do mês
  // liga/desliga o mês inteiro; os atalhos à direita cobrem os recortes que
  // mais se usa (tudo, nada, só o que já aconteceu, só o que está por vir).
  const keyOf = (p) => `${p.mes}|${p.quinzena}`;
  const allKeys = periods.map(keyOf);
  const statusDe = (key) => {
    const doPeriodo = parcelas.filter((p) => p.mesReferencia && `${p.mesReferencia}|${p.quinzena || 1}` === key);
    return doPeriodo.some((p) => p.status === 'REALIZADO') ? 'REALIZADO' : 'PLANEJADO';
  };
  const valorDe = (key) => parcelas
    .filter((p) => p.mesReferencia && `${p.mesReferencia}|${p.quinzena || 1}` === key)
    .reduce((a, p) => a + (Number(p.custoTotal) || 0), 0);

  const aplicar = (keys) => { FILTRO_CUSTO_TOTAL_QUINZENAS = new Set(keys); renderPainel(); };

  const picker = panel.querySelector('.qz-picker');

  const toolbar = document.createElement('div');
  toolbar.className = 'qz-toolbar';
  const atalhos = [
    { rotulo: 'Quinzena atual', keys: () => (chaveCorrente ? [chaveCorrente] : []), dica: 'Volta para a quinzena de hoje — é como esta tela abre.' },
    { rotulo: 'Tudo', keys: () => allKeys },
    { rotulo: 'Limpar', keys: () => [] },
    { rotulo: 'Só realizadas', keys: () => allKeys.filter((k) => statusDe(k) === 'REALIZADO') },
    { rotulo: 'Só planejadas', keys: () => allKeys.filter((k) => statusDe(k) === 'PLANEJADO') },
  ];
  for (const a of atalhos) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn small filter-control';
    b.textContent = a.rotulo;
    if (a.dica) b.title = a.dica;
    b.onclick = () => aplicar(a.keys());
    toolbar.appendChild(b);
  }
  const contador = document.createElement('span');
  contador.className = 'qz-count';
  const marcadas = allKeys.filter((k) => FILTRO_CUSTO_TOTAL_QUINZENAS.has(k)).length;
  contador.textContent = marcadas === allKeys.length
    ? `todas as ${allKeys.length} quinzenas`
    : `${marcadas} de ${allKeys.length} quinzenas`;
  toolbar.appendChild(contador);
  picker.appendChild(toolbar);

  const grupos = document.createElement('div');
  grupos.className = 'qz-groups';
  const porMes = new Map();
  for (const p of periods) {
    if (!porMes.has(p.mes)) porMes.set(p.mes, []);
    porMes.get(p.mes).push(p);
  }
  for (const [mes, lista] of porMes) {
    const grupo = document.createElement('div');
    grupo.className = 'qz-group';
    const [ano, m] = mes.split('-');
    const chavesMes = lista.map(keyOf);
    const todasOn = chavesMes.every((k) => FILTRO_CUSTO_TOTAL_QUINZENAS.has(k));

    const mesBtn = document.createElement('button');
    mesBtn.type = 'button';
    mesBtn.className = `qz-month filter-control${todasOn ? ' on' : ''}`;
    mesBtn.textContent = `${MONTH_NAMES_PT[Number(m) - 1].slice(0, 3)}/${ano.slice(2)}`;
    mesBtn.title = todasOn ? 'Desmarcar o mês inteiro' : 'Marcar o mês inteiro';
    mesBtn.onclick = () => {
      const atual = new Set(FILTRO_CUSTO_TOTAL_QUINZENAS);
      chavesMes.forEach((k) => { if (todasOn) atual.delete(k); else atual.add(k); });
      aplicar([...atual]);
    };
    grupo.appendChild(mesBtn);

    for (const p of lista) {
      const key = keyOf(p);
      const on = FILTRO_CUSTO_TOTAL_QUINZENAS.has(key);
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = `qz-chip filter-control${on ? ' on' : ''}${statusDe(key) === 'PLANEJADO' ? ' planejada' : ''}`;
      chip.textContent = `${p.quinzena}ª`;
      chip.title = `${p.label} · ${money(valorDe(key))} · ${statusDe(key) === 'REALIZADO' ? 'realizada' : 'planejada'}`;
      chip.onclick = () => {
        const atual = new Set(FILTRO_CUSTO_TOTAL_QUINZENAS);
        if (on) atual.delete(key); else atual.add(key);
        aplicar([...atual]);
      };
      grupo.appendChild(chip);
    }
    grupos.appendChild(grupo);
  }
  picker.appendChild(grupos);

  const selecionadas = parcelas
    .filter((p) => p.mesReferencia && FILTRO_CUSTO_TOTAL_QUINZENAS.has(`${p.mesReferencia}|${p.quinzena || 1}`));
  const total = selecionadas.reduce((a, p) => a + (Number(p.custoTotal) || 0), 0);

  const drill = panel.querySelector('#custoTotalPeriodoValor');
  drill.querySelector('.drill-value').textContent = money(total);
  drill.onclick = () => abrirExtratoCustoTotal(selecionadas, total);

  return panel;
}

// Extrato do "Custo total do período": abre a composição do número, quinzena
// a quinzena, mostrando de onde sai cada real — empreiteiro (PIX),
// administração (PIX), cartão e evolução Caixa — e sinalizando quando o
// "Custo total" da parcela foi sobrescrito na mão (override), caso em que a
// soma das colunas não fecha exatamente com o total lançado.
function abrirExtratoCustoTotal(parcelas, total) {
  const linhas = [...parcelas].sort((a, b) => {
    const ka = `${a.mesReferencia}|${a.quinzena || 1}`;
    const kb = `${b.mesReferencia}|${b.quinzena || 1}`;
    return ka.localeCompare(kb) || String(a.vencPlanejado || '').localeCompare(String(b.vencPlanejado || ''));
  });

  const som = (campo) => linhas.reduce((a, p) => a + (Number(p[campo]) || 0), 0);
  const somaEmp = som('totalEmpreiteiroPix');
  const somaAdm = som('totalAdmPix');
  const somaCartao = som('gastoCartao');
  const somaEvol = som('parcelaEvolucaoCaixa');
  const realizado = linhas.filter((p) => p.status === 'REALIZADO').reduce((a, p) => a + (Number(p.custoTotal) || 0), 0);
  const planejado = total - realizado;
  const temOverride = linhas.some((p) => p.overrides && p.overrides.custoTotal);

  openModal('Extrato — Custo total do período', (body) => {
    if (!linhas.length) {
      body.innerHTML = '<div class="extrato-empty">Nenhuma quinzena marcada. Marque ao menos uma quinzena na lista para ver o extrato.</div>';
      return;
    }

    const topo = document.createElement('div');
    topo.className = 'extrato-total-line';
    topo.innerHTML = `<span>${linhas.length} quinzena(s) marcada(s)</span><strong>${money(total)}</strong>`;
    body.appendChild(topo);

    const resumo = document.createElement('div');
    resumo.className = 'muted';
    resumo.innerHTML = `Já realizado: <strong>${money(realizado)}</strong> &nbsp;·&nbsp; Ainda planejado: <strong>${money(planejado)}</strong>`;
    body.appendChild(resumo);

    const wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    wrap.style.maxHeight = '46vh';
    wrap.innerHTML = `
      <table class="extrato-table">
        <thead><tr>
          <th>Quinzena</th>
          <th class="num">Empreiteiro (PIX)</th>
          <th class="num">ADM (PIX)</th>
          <th class="num">Cartão</th>
          <th class="num">Evolução Caixa</th>
          <th class="num">Custo total</th>
        </tr></thead>
        <tbody>${linhas.map((p) => `
          <tr class="${p.status === 'PLANEJADO' ? 'planejado' : ''}">
            <td>${esc(p.mesReferenciaLabel || p.label || mesQuinzenaLabel(p.mesReferencia, p.quinzena || 1))}</td>
            <td class="num">${money(p.totalEmpreiteiroPix)}</td>
            <td class="num">${money(p.totalAdmPix)}</td>
            <td class="num">${money(p.gastoCartao)}</td>
            <td class="num">${money(p.parcelaEvolucaoCaixa)}</td>
            <td class="num"><strong>${money(p.custoTotal)}</strong>${p.overrides && p.overrides.custoTotal ? ' <span title="Valor sobrescrito manualmente">✎</span>' : ''}</td>
          </tr>`).join('')}
        </tbody>
        <tfoot><tr>
          <td>Total</td>
          <td class="num">${money(somaEmp)}</td>
          <td class="num">${money(somaAdm)}</td>
          <td class="num">${money(somaCartao)}</td>
          <td class="num">${money(somaEvol)}</td>
          <td class="num">${money(total)}</td>
        </tr></tfoot>
      </table>`;
    body.appendChild(wrap);

    // Divergência: onde o "Custo total" lançado não bate com a soma das
    // colunas. É o que fazia o cartão aparecer zerado com total maior.
    const divergentes = linhas
      .map((p) => ({ p, dif: divergenciaParcela(p) }))
      .filter((x) => Math.abs(x.dif) > 0.02);

    if (divergentes.length) {
      const box = document.createElement('div');
      box.className = 'divergencia-box';
      const totalDif = round2(divergentes.reduce((a2, x) => a2 + x.dif, 0));
      box.innerHTML = `<div class="divergencia-titulo">Custo total não fecha com a soma das colunas — diferença de ${money(totalDif)}</div>
        <div class="divergencia-texto">Nestas parcelas o "Custo total" foi sobrescrito na mão e não corresponde a Empreiteiro + ADM + Cartão + Evolução Caixa. Enquanto a diferença existir, o total acima está usando o valor sobrescrito, não os lançamentos.</div>`;
      for (const { p: parc, dif } of divergentes) {
        const linha = document.createElement('div');
        linha.className = 'divergencia-linha';
        linha.innerHTML = `<span>${esc(parc.mesReferenciaLabel || parc.label)}</span>
          <span class="mono">soma ${money(somaComponentesParcela(parc))} · lançado ${money(parc.custoTotal)} · <strong>${dif > 0 ? '+' : ''}${money(dif)}</strong></span>`;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn small';
        btn.textContent = 'Recalcular pela soma';
        btn.title = 'Descarta o valor sobrescrito e refaz o custo pela soma das colunas desta parcela.';
        btn.onclick = () => {
          recalcularParcelaPelaSoma(parc.id);
          const bd = body.closest('.modal-backdrop');
          if (bd) bd.remove();
        };
        linha.appendChild(btn);
        box.appendChild(linha);
      }
      body.appendChild(box);
    }

    const nota = document.createElement('div');
    nota.className = 'muted';
    nota.innerHTML = temOverride
      ? '✎ = parcela com "Custo total" sobrescrito na mão. A partir de agora, todo lançamento novo (cartão, PIX, evolução) é somado ao valor sobrescrito, em vez de ser ignorado — então o total volta a acompanhar os lançamentos.'
      : 'Custo total = Empreiteiro (PIX) + ADM (PIX) + Cartão + Evolução Caixa, parcela a parcela. É a mesma coluna "Custo total" da aba Contas a Pagar.';
    body.appendChild(nota);
  }, { wide: true });
}

function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.hidden = false;
  el.classList.toggle('error', isError);
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.hidden = true; }, 3200);
}

// Mostra o toast do ajuste automático (parcelas planejadas reorganizadas para
// caber no orçado); retorna true se mostrou, para o chamador decidir se ainda
// quer mostrar sua própria mensagem de sucesso por cima.
function toastAjuste(ajuste) {
  if (!ajuste) return false;
  toast(`Ajuste automático: ${ajuste.qtd} parcela(s) planejada(s) reduzida(s) para caber no orçado restante do contrato (${money(ajuste.tetoPlanejado)}).`);
  return true;
}

function newId(prefix) {
  const rand = (window.crypto && crypto.randomUUID) ? crypto.randomUUID().slice(0, 8) : Math.random().toString(36).slice(2, 10);
  return `${prefix}-${rand}`;
}

function setStatus(kind) {
  const chip = document.getElementById('statusChip');
  const text = document.getElementById('statusChipText');
  if (!chip || !text) return;
  chip.className = `status-chip ${kind}`;
  const labels = { saving: 'Salvando…', saved: 'Sincronizado', error: 'Erro ao salvar', readonly: 'Somente leitura', local: 'Salvo neste navegador' };
  text.textContent = labels[kind] || kind;
}

/* ==========================================================================
   Sessão de lançamento (login)
   --------------------------------------------------------------------------
   O painel abre travado para quem só vai olhar. Quem lança dados entra com
   usuário e senha e destrava os campos. A credencial fica guardada como
   hash, não em texto claro — mas isto NÃO é segurança de verdade: o app é um
   arquivo único que roda inteiro no navegador, então quem baixar o arquivo
   consegue contornar a trava. Serve para evitar edição acidental e para tirar
   a tarja de "somente leitura" da frente de quem trabalha, não para proteger
   dado sigiloso.

   Onde o app consegue publicar (dentro do Claude, com permissão de escrita),
   salvar continua sendo publicar uma nova versão. Onde não consegue (cópia
   no GitHub Pages, ou visitante sem permissão), o lançamento é guardado no
   navegador de quem está lançando e precisa ser exportado para virar oficial.
   ========================================================================== */
const CREDENCIAL_HASH = '96861735b01dcf0bce66ec73559217e32fa4f8c8c1959ac1e92929d8b9a98549';
const CHAVE_SESSAO = 'lct_sessao';
const CHAVE_RASCUNHO = 'lct_rascunho';
/* Quando um rascunho local é restaurado, o que está na tela deixa de ser a
   versão publicada e passa a ser uma cópia guardada NESTE navegador. Isso
   precisa ficar visível: um rascunho antigo pode segurar números que já foram
   corrigidos na versão publicada, e sem aviso a pessoa fica olhando um valor
   velho achando que a correção não chegou. */
let RASCUNHO_RESTAURADO = null;

function descartarRascunhoLocal() {
  try { localStorage.removeItem(CHAVE_RASCUNHO); } catch (e) { /* ignore */ }
  RASCUNHO_RESTAURADO = null;
  location.reload();
}

let SESSAO = null;          // { usuario } quando destravado
let PODE_PUBLICAR = null;   // null = ainda verificando; true/false depois

async function hashCredencial(usuario, senha) {
  const texto = `lct|${String(usuario).trim().toLowerCase()}|${String(senha).trim()}`;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}

function lerSessao() {
  try {
    const raw = sessionStorage.getItem(CHAVE_SESSAO);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function gravarSessao(sessao) {
  try {
    if (sessao) sessionStorage.setItem(CHAVE_SESSAO, JSON.stringify(sessao));
    else sessionStorage.removeItem(CHAVE_SESSAO);
  } catch (e) { /* navegador sem storage: a sessão vale só até recarregar */ }
}

function aplicarModo() {
  READONLY = !SESSAO;

  const btn = document.getElementById('btnSessao');
  if (btn) {
    btn.textContent = SESSAO ? `${SESSAO.usuario} · sair` : 'Entrar para lançar';
    btn.classList.toggle('ativo', !!SESSAO);
    btn.title = SESSAO ? 'Encerrar a sessão de lançamento' : 'Entrar para inserir e editar lançamentos';
  }

  const banner = document.getElementById('modoBanner');
  if (banner) {
    if (!SESSAO) {
      banner.hidden = true;
      banner.className = 'modo-banner';
      banner.textContent = '';
      setStatus('readonly');
    } else if (PODE_PUBLICAR === false) {
      banner.hidden = false;
      banner.className = 'modo-banner local';
      banner.innerHTML = `<span>Modo lançamento — ${esc(SESSAO.usuario)}. Esta cópia não publica no servidor: o que você lançar fica guardado <strong>só neste navegador</strong>. Exporte o arquivo para tornar oficial.</span>`;
      const acao = document.createElement('button');
      acao.type = 'button';
      acao.className = 'btn small modo-acao filter-control';
      acao.textContent = 'Salvar cópia em HTML';
      acao.onclick = exportarCopiaHtml;
      banner.appendChild(acao);
      setStatus('local');
    } else {
      banner.hidden = true;
      banner.className = 'modo-banner';
      banner.textContent = '';
      setStatus('saved');
    }
  }
}

function abrirLogin() {
  openModal('Entrar para lançar', (body, close) => {
    const form = document.createElement('form');
    form.className = 'login-form';
    form.innerHTML = `
      <label>Usuário<input name="usuario" autocomplete="username" autocapitalize="none" required /></label>
      <label>Senha<input name="senha" type="password" autocomplete="current-password" required /></label>
      <div class="login-erro" hidden></div>
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button type="button" class="btn" id="cancelaLogin">Cancelar</button>
        <button type="submit" class="btn primary">Entrar</button>
      </div>
      <div class="login-nota">A sessão vale só nesta aba do navegador e cai quando você a fecha. Esta trava evita edição acidental — não é proteção de dado sigiloso, já que o app roda inteiro no navegador.</div>
    `;
    form.querySelector('#cancelaLogin').onclick = close;
    const erro = form.querySelector('.login-erro');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const dados = Object.fromEntries(new FormData(form).entries());
      const hash = await hashCredencial(dados.usuario || '', dados.senha || '');
      if (hash !== CREDENCIAL_HASH) {
        erro.hidden = false;
        erro.textContent = 'Usuário ou senha não confere.';
        return;
      }
      SESSAO = { usuario: String(dados.usuario).trim() };
      gravarSessao(SESSAO);
      close();
      aplicarModo();
      renderAll();
      toast(`Modo lançamento ativo — ${SESSAO.usuario}.`);
    });
    body.appendChild(form);
    setTimeout(() => form.querySelector('input[name="usuario"]').focus(), 30);
  });
}

async function sairDaSessao() {
  if (!await confirmDialog('Encerrar a sessão de lançamento? O painel volta a ficar travado para edição.', { title: 'Sair', okLabel: 'Sair' })) return;
  SESSAO = null;
  gravarSessao(null);
  aplicarModo();
  renderAll();
}

// Guarda o lançamento no navegador de quem está lançando, quando a cópia não
// tem como publicar no servidor.
function salvarRascunhoLocal() {
  try {
    localStorage.setItem(CHAVE_RASCUNHO, JSON.stringify({ salvoEm: new Date().toISOString(), estado: STATE }));
    setStatus('local');
  } catch (e) {
    setStatus('error');
    toast('Não foi possível guardar o lançamento neste navegador.', true);
  }
}

/* Completa parâmetros que uma versão anterior não tinha.
   -------------------------------------------------------------------------
   O estado pode vir de um arquivo salvo, de um rascunho local ou de uma
   importação antiga. Qualquer um deles pode não conhecer um parâmetro criado
   depois — e um parâmetro ausente vale `undefined`, que é falso, desligando
   funções que deveriam vir ligadas. Aqui só se preenche o que falta; nada do
   que já existe é tocado. */
function normalizarParametros() {
  const p = STATE.parametros = STATE.parametros || {};
  const padroes = {
    cartaoAutoSync: true,
    cartaoDiaFechamento: 5,
    cartaoDiaVencimento: 15,
    admBase: 'empreiteiroCartao',
  };
  for (const [k, v] of Object.entries(padroes)) {
    if (p[k] === undefined || p[k] === null) p[k] = v;
  }
  return p;
}

function restaurarRascunhoLocal() {
  try {
    const raw = localStorage.getItem(CHAVE_RASCUNHO);
    if (!raw) return false;
    const r = JSON.parse(raw);
    if (!r || !r.estado) return false;
    // Só vale se for mais recente do que o estado embutido no arquivo.
    if (r.estado.updatedAt && STATE.updatedAt && r.estado.updatedAt <= STATE.updatedAt) return false;
    // STATE é const: substituímos o CONTEÚDO, não a referência.
    for (const k of Object.keys(STATE)) delete STATE[k];
    Object.assign(STATE, r.estado);
    // Rascunho salvo por uma versão anterior não conhece parâmetros novos.
    // Sem isto, um rascunho antigo desliga em silêncio funções que já vieram
    // ligadas de fábrica — foi o que escondeu a sincronização do cartão.
    normalizarParametros();
    RASCUNHO_RESTAURADO = r.salvoEm || true;
    VIEW = recompute(STATE);
    return true;
  } catch (e) { return false; }
}

function enterReadOnly() {
  PODE_PUBLICAR = false;
  aplicarModo();
  renderAll();
}

function stashViewState() {
  try { sessionStorage.setItem('lc_viewState', JSON.stringify({ tab: ACTIVE_TAB, open: [...OPEN_CATEGORIES] })); } catch (e) { /* ignore */ }
}
function restoreViewState() {
  try {
    const raw = sessionStorage.getItem('lc_viewState');
    if (raw) {
      const v = JSON.parse(raw);
      if (v.tab) ACTIVE_TAB = v.tab;
      if (Array.isArray(v.open)) v.open.forEach((id) => OPEN_CATEGORIES.add(id));
      sessionStorage.removeItem('lc_viewState');
    }
  } catch (e) { /* ignore */ }
}

async function doSave() {
  const ns = await ARTIFACT_NS_PROMISE;
  if (!ns) { PODE_PUBLICAR = false; salvarRascunhoLocal(); aplicarModo(); return; }
  try {
    stashViewState();
    await ns.publish(buildFullDocument(STATE));
    // sucesso: a própria plataforma recarrega esta visão para a nova versão.
  } catch (e) {
    if (e && (e.code === 'not_writer' || e.code === 'not_granted')) {
      PODE_PUBLICAR = false;
      salvarRascunhoLocal();
      aplicarModo();
    } else if (e && e.code === 'conflict') {
      // outra edição venceu; a visão já está sendo recarregada para ela.
    } else {
      setStatus('error');
      toast('Não foi possível salvar agora. Tentando novamente…', true);
      saveTimer = setTimeout(doSave, 4000);
    }
  }
}

function afterMutation() {
  // Com a sincronização automática ligada, a coluna "Cartão" das parcelas é
  // sempre derivada dos itens do Detalhamento FC — uma fonte só, sem briga.
  if (STATE.parametros.cartaoAutoSync) aplicarCartaoDerivado();
  STATE.updatedAt = new Date().toISOString();
  VIEW = recompute(STATE);
  renderAll();
  if (READONLY) return;
  setStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, SAVE_DEBOUNCE_MS);
}

/* ==========================================================================
   Mutadores de estado (equivalentes às rotas do backend original)
   ========================================================================== */
function updateMeta(patch) { Object.assign(STATE.meta, patch); afterMutation(); }
function updateParametros(patch) { Object.assign(STATE.parametros, patch); afterMutation(); }

function updateCategoria(id, patch) {
  const cat = STATE.categorias.find((c) => c.id === id); if (!cat) return;
  if (patch.nome !== undefined) cat.nome = patch.nome;
  if (patch.valorOrcado !== undefined) cat.valorOrcado = Number(patch.valorOrcado);
  if (patch.observacao !== undefined) cat.observacao = patch.observacao;
  if (patch.verbaCaixa !== undefined) cat.verbaCaixa = Number(patch.verbaCaixa);
  if (patch.liberadoCaixaManual !== undefined) cat.liberadoCaixaManual = patch.liberadoCaixaManual === null ? null : Number(patch.liberadoCaixaManual);
  if (patch.percItensManual !== undefined) cat.percItensManual = patch.percItensManual === null ? null : Number(patch.percItensManual);
  if (patch.percAvancoManual !== undefined) {
    cat.percAvancoManual = patch.percAvancoManual === null ? null : Number(patch.percAvancoManual);
    cat.dataUltimoAvanco = new Date().toISOString().slice(0, 10);
  }
  afterMutation();
}

function lancarAvanco(id, { perc, data, obs }) {
  const cat = STATE.categorias.find((c) => c.id === id); if (!cat) return;
  const percAvancoAnterior = cat.percAvancoManual;
  cat.percAvancoManual = Number(perc);
  cat.dataUltimoAvanco = data || new Date().toISOString().slice(0, 10);
  if (obs !== undefined) cat.observacao = obs;
  STATE.historicoAvancos.unshift({
    id: newId('avanco'), categoriaId: cat.id, categoriaNome: cat.nome,
    percAvancoAnterior, percAvancoNovo: cat.percAvancoManual,
    data: cat.dataUltimoAvanco, obs: obs || '', timestamp: new Date().toISOString(),
  });
  afterMutation();
}

function limparAvancoManual(id) {
  const cat = STATE.categorias.find((c) => c.id === id); if (!cat) return;
  cat.percAvancoManual = null;
  afterMutation();
}

/* Item de cartão → parcela de Contas a Pagar.
   -------------------------------------------------------------------------
   Antes, lançar um item com forma de pagamento CARTÃO no Detalhamento FC não
   mexia em nada: o gasto ficava preso na lista da categoria e nunca virava
   custo. Agora cada item de cartão fica AMARRADO à parcela da fatura
   correspondente, e essa amarração é mantida quando o item muda de valor, de
   data ou de forma de pagamento — o valor antigo sai da parcela antiga antes
   de o novo entrar na nova, então editar nunca duplica.

   O vínculo fica gravado no próprio item (item.cartaoVinculo = {parcelaId,
   valor}), o que torna a conta auditável e reversível: apagar o item devolve
   o valor à parcela. */
/* Mês da FATURA de um item de cartão.
   -------------------------------------------------------------------------
   A data que se lança no item é a data da COMPRA. O cartão, porém, é cobrado
   na fatura — que pode cair em outro mês. Confundir as duas foi o que fez o
   gasto aparecer no mês errado (ou não aparecer). A ordem de prioridade é:
   1) o campo mesFatura do item, quando preenchido à mão;
   2) o mês escrito na forma de pagamento ("CARTÃO — fatura 2026-09" ou
      "CARTÃO EM SETEMBRO", como vinha da planilha);
   3) na falta dos dois, o mês da data de compra. */
const MESES_TEXTO = ['JANEIRO', 'FEVEREIRO', 'MARÇO', 'ABRIL', 'MAIO', 'JUNHO', 'JULHO', 'AGOSTO', 'SETEMBRO', 'OUTUBRO', 'NOVEMBRO', 'DEZEMBRO'];

/* Ciclo da fatura do cartão.
   -------------------------------------------------------------------------
   O cartão fecha no dia 5 e vence no dia 15. Compra feita ANTES do dia 5 cai
   na fatura que vence dia 15 DAQUELE mês; do dia 5 em diante entra na fatura
   do mês seguinte — por isso comprar no dia 5 "empurra" o custo um mês para
   frente. Os dois dias ficam em Parâmetros porque cartão trocado é ciclo
   trocado, e a regra inteira do app passa por aqui. */
function diaFechamentoCartao() {
  const d = Number(STATE.parametros.cartaoDiaFechamento);
  return Number.isFinite(d) && d >= 1 && d <= 28 ? d : 5;
}
function diaVencimentoCartao() {
  const d = Number(STATE.parametros.cartaoDiaVencimento);
  return Number.isFinite(d) && d >= 1 && d <= 28 ? d : 15;
}
// Mês (YYYY-MM) da fatura que vai cobrar uma compra feita nesta data.
function faturaDaCompra(dataCompra) {
  if (!dataCompra) return null;
  const s = String(dataCompra).slice(0, 10);
  const ano = Number(s.slice(0, 4));
  const mes = Number(s.slice(5, 7));
  const dia = Number(s.slice(8, 10));
  if (!ano || !mes || !dia) return null;
  const empurra = dia >= diaFechamentoCartao() ? 1 : 0;
  const total = (mes - 1) + empurra;
  return `${ano + Math.floor(total / 12)}-${String((total % 12) + 1).padStart(2, '0')}`;
}
// Data em que a fatura daquele mês é efetivamente paga.
function vencimentoDaFatura(mesFatura) {
  return mesFatura ? `${mesFatura}-${String(diaVencimentoCartao()).padStart(2, '0')}` : null;
}

function mesFaturaDoItem(item, anoBase) {
  if (item.mesFatura && /^\d{4}-\d{2}$/.test(item.mesFatura)) return item.mesFatura;
  const forma = String(item.formaPagamento || '');
  const m1 = /fatura\s+(\d{4}-\d{2})/i.exec(forma);
  if (m1) return m1[1];
  const semAcento = forma.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  for (let i = 0; i < 12; i += 1) {
    const nome = MESES_TEXTO[i].normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    if (semAcento.includes(' EM ' + nome)) {
      const ano = anoBase || (item.dataPagamento ? String(item.dataPagamento).slice(0, 4) : String(new Date().getFullYear()));
      return `${ano}-${String(i + 1).padStart(2, '0')}`;
    }
  }
  // Sem indicação explícita, vale o ciclo: fecha dia 5, vence dia 15.
  return faturaDaCompra(item.dataPagamento);
}

function ehCartao(formaPagamento) {
  return String(formaPagamento || '').toUpperCase().includes('CART');
}

// Soma das colunas que compõem o custo de uma parcela.
function somaComponentesParcela(parcela) {
  return round2(
    (Number(parcela.totalEmpreiteiroPix) || 0)
    + (Number(parcela.totalAdmPix) || 0)
    + (Number(parcela.gastoCartao) || 0)
    + (Number(parcela.parcelaEvolucaoCaixa) || 0),
  );
}

// Quanto o "Custo total" lançado se afastou da soma das colunas. Zero = a
// parcela fecha; diferente de zero = alguém sobrescreveu o total na mão e os
// lançamentos posteriores deixaram de bater.
function divergenciaParcela(parcela) {
  return round2((Number(parcela.custoTotal) || 0) - somaComponentesParcela(parcela));
}

/* Recalcula o custo da parcela depois de um lançamento.
   -------------------------------------------------------------------------
   Regra: sem override, o custo é a soma das colunas. COM override, o valor
   sobrescrito é respeitado, mas o lançamento novo é somado a ele — senão o
   total congela e passa a mentir (era exatamente o que acontecia: cartão
   entrava e o custo total não se mexia). O `delta` é o quanto acabou de
   entrar ou sair de alguma coluna. */
/* Base de cálculo da taxa de administração.
   -------------------------------------------------------------------------
   A ADM de 10% da RS Engenharia incide sobre o custo de execução da quinzena
   — o que o empreiteiro recebe em PIX MAIS o que foi gasto no cartão, já que
   o cartão também é descontado do que ele tem a receber. Era exatamente por
   isso que uma quinzena com o cartão zerado mostrava ADM pequena demais:
   faltava metade da base. A parcela de evolução da CAIXA é pagamento de
   financiamento, não execução; quem quiser incluí-la muda "Base da
   administração" em Parâmetros para "custo total da quinzena". */
function baseAdmParcela(parcela) {
  const pix = Number(parcela.totalEmpreiteiroPix) || 0;
  const cartao = Number(parcela.gastoCartao) || 0;
  const evolucao = Number(parcela.parcelaEvolucaoCaixa) || 0;
  return STATE.parametros.admBase === 'custoTotal'
    ? round2(pix + cartao + evolucao)
    : round2(pix + cartao);
}
function admDerivadaParcela(parcela) {
  return round2(baseAdmParcela(parcela) * (Number(STATE.parametros.taxaAdministracaoPercent) || 0));
}
// A ADM só é "manual" quando alguém digitou nela. Fora isso é derivada e tem
// de acompanhar a base — senão congela e mente, como estava acontecendo.
function admEhManual(parcela) {
  return !!(parcela.overrides && parcela.overrides.totalAdmPix);
}

function recalcularCustoParcela(parcela, delta = 0) {
  if (!parcela) return;
  if (!admEhManual(parcela)) {
    const novaAdm = admDerivadaParcela(parcela);
    const antigaAdm = Number(parcela.totalAdmPix) || 0;
    if (Math.abs(novaAdm - antigaAdm) > 0.005) {
      parcela.totalAdmPix = novaAdm;
      delta = round2(delta + (novaAdm - antigaAdm));
    }
  }
  if (!parcela.overrides?.totalATransferir) {
    parcela.totalATransferir = round2((Number(parcela.totalEmpreiteiroPix) || 0) + (Number(parcela.totalAdmPix) || 0));
  }
  if (parcela.overrides?.custoTotal) {
    if (delta) parcela.custoTotal = round2((Number(parcela.custoTotal) || 0) + delta);
  } else {
    parcela.custoTotal = somaComponentesParcela(parcela);
  }
}

// Devolve a ADM digitada à mão ao cálculo automático sobre a base.
function recalcularAdmPelaBase(parcelaId) {
  const parcela = STATE.parcelas.find((x) => x.id === parcelaId);
  if (!parcela) return;
  parcela.overrides = parcela.overrides || {};
  parcela.overrides.totalAdmPix = false;
  const antes = Number(parcela.totalAdmPix) || 0;
  recalcularCustoParcela(parcela);
  afterMutation();
  toast(`ADM de "${parcela.label}" voltou ao cálculo: ${money(antes)} → ${money(parcela.totalAdmPix)}.`);
}

// Descarta o valor sobrescrito e devolve o custo à soma das colunas.
function recalcularParcelaPelaSoma(parcelaId) {
  const parcela = STATE.parcelas.find((x) => x.id === parcelaId);
  if (!parcela) return;
  if (parcela.overrides) parcela.overrides.custoTotal = false;
  parcela.custoTotal = somaComponentesParcela(parcela);
  afterMutation();
  toast(`Custo de "${parcela.label}" recalculado pela soma das colunas.`);
}

// Parcela criada só para abrigar uma fatura de cartão e que ficou sem nada
// dentro não deve continuar poluindo Contas a Pagar.
function descartarParcelaCartaoVazia(parcela) {
  if (!parcela || parcela.status === 'REALIZADO') return;
  if (!String(parcela.label || '').includes('(cartão)')) return;
  const zerada = ['totalEmpreiteiroPix', 'totalAdmPix', 'gastoCartao', 'parcelaEvolucaoCaixa']
    .every((k) => !(Number(parcela[k]) || 0));
  if (!zerada) return;
  const usada = (STATE.categorias || []).some((c) => (c.itens || []).some((i) => i.cartaoVinculo && i.cartaoVinculo.parcelaId === parcela.id));
  if (usada) return;
  STATE.parcelas = STATE.parcelas.filter((x) => x.id !== parcela.id);
}

function parcelaPorId(id) {
  return id ? STATE.parcelas.find((x) => x.id === id) || null : null;
}

// Refaz o vínculo do item com a parcela da fatura. Chamada em toda criação,
// edição e exclusão de item — é ela que garante que o custo acompanhe.
function sincronizarItemCartao(item, { removendo = false } = {}) {
  const vinculo = item.cartaoVinculo || null;

  // 1) desfaz a contribuição anterior, onde quer que ela esteja
  if (vinculo) {
    const antiga = parcelaPorId(vinculo.parcelaId);
    if (antiga) {
      const saiu = Math.min(Number(antiga.gastoCartao) || 0, Number(vinculo.valor) || 0);
      antiga.gastoCartao = round2((Number(antiga.gastoCartao) || 0) - saiu);
      recalcularCustoParcela(antiga, -saiu);
    }
    // O vínculo sai ANTES do descarte: senão a própria parcela ainda parece
    // estar em uso por este item e nunca seria removida.
    delete item.cartaoVinculo;
    if (antiga) descartarParcelaCartaoVazia(antiga);
  }
  if (removendo) return null;

  // 2) refaz com os dados atuais do item
  const valor = round2(Number(item.valorRealizado) || 0);
  if (!ehCartao(item.formaPagamento) || valor <= 0) return null;
  // A parcela é a da FATURA, não a da compra.
  const mesFatura = mesFaturaDoItem(item);
  if (!mesFatura) return null;
  const data = vencimentoDaFatura(mesFatura);

  const parcela = findOrCreateParcelaPorData(data, ' (cartão)');
  parcela.gastoCartao = round2((Number(parcela.gastoCartao) || 0) + valor);
  recalcularCustoParcela(parcela, valor);
  item.cartaoVinculo = { parcelaId: parcela.id, valor };
  return parcela;
}

function addItem(catId, patch) {
  const cat = STATE.categorias.find((c) => c.id === catId); if (!cat) return;
  const item = {
    id: newId('item'), descricao: patch.descricao || 'Novo item', unidade: patch.unidade || '',
    valorOrcado: Number(patch.valorOrcado) || 0, valorRealizado: Number(patch.valorRealizado) || 0,
    dataPagamento: patch.dataPagamento || null, formaPagamento: patch.formaPagamento || '',
    mesFatura: patch.mesFatura || null,
  };
  cat.itens.push(item);
  const parcela = sincronizarItemCartao(item);
  afterMutation();
  if (parcela) toast(`Gasto de cartão lançado em "${parcela.label}" — Contas a Pagar atualizado.`);
}

function updateItem(catId, itemId, patch) {
  const cat = STATE.categorias.find((c) => c.id === catId); if (!cat) return;
  const item = cat.itens.find((i) => i.id === itemId); if (!item) return;
  if (patch.descricao !== undefined) item.descricao = patch.descricao;
  if (patch.unidade !== undefined) item.unidade = patch.unidade;
  if (patch.valorOrcado !== undefined) item.valorOrcado = Number(patch.valorOrcado);
  if (patch.valorRealizado !== undefined) item.valorRealizado = Number(patch.valorRealizado);
  if (patch.dataPagamento !== undefined) item.dataPagamento = patch.dataPagamento;
  if (patch.formaPagamento !== undefined) item.formaPagamento = patch.formaPagamento;
  if (patch.mesFatura !== undefined) item.mesFatura = patch.mesFatura || null;
  // Valor, data, forma e mês da fatura mudam o destino do gasto: refaz o vínculo sempre.
  const mexeuNoCartao = patch.valorRealizado !== undefined || patch.dataPagamento !== undefined || patch.formaPagamento !== undefined || patch.mesFatura !== undefined;
  if (mexeuNoCartao || item.cartaoVinculo) sincronizarItemCartao(item);
  afterMutation();
}

function deleteItem(catId, itemId) {
  const cat = STATE.categorias.find((c) => c.id === catId); if (!cat) return;
  const item = cat.itens.find((i) => i.id === itemId);
  if (item) sincronizarItemCartao(item, { removendo: true });
  cat.itens = cat.itens.filter((i) => i.id !== itemId);
  afterMutation();
}

/* Conferência do cartão: Detalhamento FC × Contas a Pagar.
   -------------------------------------------------------------------------
   São duas fontes para o mesmo número — os itens de cartão lançados nas
   categorias e a coluna "Cartão" das parcelas. Quando elas divergem, o custo
   mente. Esta função só COMPARA; sincronizar é uma ação explícita, porque
   sobrescrever o lançamento de alguém sem avisar seria pior que a divergência. */
function conferirCartao() {
  const porFatura = new Map();
  for (const cat of STATE.categorias || []) {
    for (const it of cat.itens || []) {
      if (!ehCartao(it.formaPagamento)) continue;
      const valor = Number(it.valorRealizado) || 0;
      if (valor <= 0) continue;
      const mes = mesFaturaDoItem(it);
      if (!mes) continue;
      if (!porFatura.has(mes)) porFatura.set(mes, { mes, itens: 0, detalhes: [] });
      const reg = porFatura.get(mes);
      reg.itens = round2(reg.itens + valor);
      reg.detalhes.push({ categoria: cat.nome, descricao: it.descricao, valor });
    }
  }
  // Cartão sempre cai na 1ª quinzena do mês da fatura.
  for (const p2 of STATE.parcelas || []) {
    const d = p2.vencimento || p2.vencPlanejado;
    if (!d) continue;
    if (quinzenaFromDateStr(d) !== 1) continue;
    const mes = monthKeyFromDateStr(d);
    if (!porFatura.has(mes)) porFatura.set(mes, { mes, itens: 0, detalhes: [] });
    const reg = porFatura.get(mes);
    reg.parcelaId = p2.id;
    reg.parcelaLabel = p2.label;
    reg.naParcela = round2(Number(p2.gastoCartao) || 0);
  }
  const linhas = [...porFatura.values()].map((r) => ({
    ...r,
    naParcela: r.naParcela || 0,
    dif: round2((r.itens || 0) - (r.naParcela || 0)),
  })).sort((a2, b2) => a2.mes.localeCompare(b2.mes));
  return { linhas, divergentes: linhas.filter((l) => Math.abs(l.dif) > 0.02) };
}

/* Aplica a derivação do cartão SEM disparar outro ciclo de gravação — é
   chamada de dentro do afterMutation, então não pode chamá-lo de volta.
   Devolve quantas quinzenas mudaram. */
function aplicarCartaoDerivado() {
  const { divergentes } = conferirCartao();
  let mexeu = 0;
  for (const linha of divergentes) {
    // Mês sem nenhum item de cartão não é zerado por aqui. Se a coluna tem
    // valor e o Detalhamento não tem a compra, isso é buraco de lançamento —
    // apagar o número em silêncio esconderia o problema em vez de resolvê-lo.
    // Item removido de verdade já desconta pelo próprio sincronizarItemCartao.
    if (!(linha.itens > 0)) continue;
    let parcela = linha.parcelaId ? STATE.parcelas.find((x) => x.id === linha.parcelaId) : null;
    if (!parcela) parcela = findOrCreateParcelaPorData(vencimentoDaFatura(linha.mes), ' (cartão)');
    const delta = round2(linha.itens - (Number(parcela.gastoCartao) || 0));
    if (!delta) continue;
    parcela.gastoCartao = round2(linha.itens);
    /* Um "Custo total" digitado à mão foi digitado ANTES de o cartão desta
       fatura entrar na coluna — e quem digitou já sabia do gasto do cartão,
       então ele quase sempre já estava embutido naquele número. Somar o
       cartão por cima do valor sobrescrito contaria o mesmo gasto duas vezes.
       Por isso a sincronização abre mão do valor sobrescrito: com todas as
       colunas preenchidas, o custo da quinzena é a soma delas. Quem quiser
       um total diferente da soma digita de novo, agora sobre a base completa. */
    if (parcela.overrides && parcela.overrides.custoTotal) parcela.overrides.custoTotal = false;
    // recalcularCustoParcela refaz a ADM sobre a nova base e recalcula o
    // custo da quinzena pela soma das colunas.
    recalcularCustoParcela(parcela, delta);
    mexeu += 1;
  }
  return mexeu;
}

// Faz a coluna "Cartão" das parcelas bater com os itens do Detalhamento.
function sincronizarCartaoComDetalhamento() {
  const { divergentes } = conferirCartao();
  let mexeu = 0;
  for (const linha of divergentes) {
    let parcela = linha.parcelaId ? STATE.parcelas.find((x) => x.id === linha.parcelaId) : null;
    if (!parcela) {
      if (!(linha.itens > 0)) continue;
      parcela = findOrCreateParcelaPorData(vencimentoDaFatura(linha.mes), ' (cartão)');
    }
    const delta = round2(linha.itens - (Number(parcela.gastoCartao) || 0));
    parcela.gastoCartao = round2(linha.itens);
    recalcularCustoParcela(parcela, delta);
    mexeu += 1;
  }
  if (!mexeu) { toast('Cartão já estava batendo com o Detalhamento FC.'); return; }
  afterMutation();
  toast(`${mexeu} quinzena(s) sincronizada(s) com o Detalhamento FC.`);
}

/* Recupera o mês da fatura que a planilha original trazia.
   -------------------------------------------------------------------------
   No arquivo de origem a forma de pagamento dizia "CARTÃO EM AGOSTO",
   "CARTÃO EM SETEMBRO" — era ali que morava a informação de qual fatura
   cobrava cada compra. Em algum momento isso virou só "CARTÃO" e a
   distribuição mês a mês das compras parceladas se perdeu. Esta migração lê
   a semente original pelo id do item e devolve o mês da fatura, sem tocar em
   nada mais. Roda uma vez; o campo fica editável para ajustar exceções. */
function migrarMesFaturaDaPlanilha() {
  const original = new Map();
  const corrigida = new Map();
  for (const cat of (ORIGINAL_SEED.categorias || [])) {
    for (const it of (cat.itens || [])) {
      if (!ehCartao(it.formaPagamento)) continue;
      original.set(it.id, it.formaPagamento);
      // Mês de fatura já gravado na semente vale mais que o texto antigo da
      // planilha: é ali que ficam as correções conferidas com o extrato real
      // (havia itens marcados "EM SETEMBRO" que na verdade caíram antes).
      if (it.mesFatura) corrigida.set(it.id, it.mesFatura);
    }
  }
  let mexeu = 0;
  for (const cat of STATE.categorias || []) {
    for (const item of cat.itens || []) {
      if (!ehCartao(item.formaPagamento)) continue;
      const jaCorrigida = corrigida.get(item.id);
      if (jaCorrigida) {
        if (item.mesFatura !== jaCorrigida) { item.mesFatura = jaCorrigida; mexeu += 1; }
        continue;
      }
      if (item.mesFatura) continue;
      const formaOriginal = original.get(item.id);
      if (!formaOriginal) continue;
      // Só vale quando a planilha REALMENTE nomeava o mês ("CARTÃO EM
      // AGOSTO"). Sem nome, o item segue o ciclo do cartão e continua vivo:
      // se o dia de fechamento mudar, ele acompanha. Gravar aqui o resultado
      // da regra congelaria o item numa fatura fixa.
      if (!/ EM |fatura\s+\d{4}-\d{2}/i.test(formaOriginal)) continue;
      const mes = mesFaturaDoItem({ formaPagamento: formaOriginal, dataPagamento: item.dataPagamento });
      if (mes) { item.mesFatura = mes; mexeu += 1; }
    }
  }
  return mexeu;
}

// Amarra os itens de cartão que já existiam antes desta função existir, para
// que o histórico também passe a refletir em Contas a Pagar. Roda uma vez.
/* Separa, uma única vez, a ADM que veio de fórmula da que alguém digitou.
   -------------------------------------------------------------------------
   Até aqui a coluna ADM era um número solto: quando o cartão entrava, ela
   ficava para trás e a taxa saía menor que os 10% reais. Agora a ADM é
   derivada da base. Para não apagar lançamento humano, quem já está em 10%
   de alguma base plausível (PIX, PIX+cartão ou o custo inteiro) passa a ser
   derivado; qualquer outro valor é tratado como digitado à mão e fica
   preservado, marcado como manual na tela. */
function migrarBaseAdm() {
  if (STATE.parametros.admMigrada) return;
  const taxa = Number(STATE.parametros.taxaAdministracaoPercent) || 0;
  for (const p of STATE.parcelas || []) {
    p.overrides = p.overrides || {};
    if (p.overrides.totalAdmPix !== undefined) continue;
    const adm = Number(p.totalAdmPix) || 0;
    const pix = Number(p.totalEmpreiteiroPix) || 0;
    const cartao = Number(p.gastoCartao) || 0;
    const evol = Number(p.parcelaEvolucaoCaixa) || 0;
    const bases = [pix, pix + cartao, pix + cartao + evol];
    const veioDeFormula = adm === 0 || bases.some((b) => Math.abs(adm - round2(b * taxa)) <= 0.05);
    p.overrides.totalAdmPix = !veioDeFormula;
    if (veioDeFormula) recalcularCustoParcela(p);
  }
  STATE.parametros.admMigrada = true;
}

function migrarItensCartaoSemVinculo() {
  let mexeu = 0;
  for (const cat of STATE.categorias || []) {
    for (const item of cat.itens || []) {
      if (item.cartaoVinculo) continue;
      if (!ehCartao(item.formaPagamento)) continue;
      if (!(Number(item.valorRealizado) > 0) || !item.dataPagamento) continue;
      // Marca como já contabilizado, sem somar de novo: os lançamentos
      // antigos já estão dentro do gastoCartao das parcelas da planilha.
      const data = String(item.dataPagamento).slice(0, 10);
      const parcela = STATE.parcelas.find((x) => {
        const d = x.vencimento || x.vencPlanejado || null;
        return monthKeyFromDateStr(d) === monthKeyFromDateStr(data);
      });
      if (parcela) { item.cartaoVinculo = { parcelaId: parcela.id, valor: round2(Number(item.valorRealizado)) }; mexeu += 1; }
    }
  }
  return mexeu;
}

function addMonthsToDate(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setMonth(d.getMonth() + n);
  return d.toISOString().slice(0, 10);
}

function findOrCreateParcelaPorData(dataStr, labelSufixo) {
  const mesReferencia = monthKeyFromDateStr(dataStr);
  // Cartão é sempre pago na 1ª quinzena do mês da fatura (fechamento dia 05,
  // vencimento dia 15) — nunca cai na 2ª parcela, independentemente do dia
  // exato informado na compra.
  const quinzena = 1;
  let parcela = STATE.parcelas.find((p) => {
    const dataOcorrencia = p.vencimento || p.vencPlanejado || null;
    return monthKeyFromDateStr(dataOcorrencia) === mesReferencia && quinzenaFromDateStr(dataOcorrencia) === quinzena;
  });
  if (!parcela) {
    parcela = {
      id: newId('parcela'),
      label: `${monthQuinzenaLabel(mesReferencia, quinzena || 1)}${labelSufixo || ''}`,
      totalEmpreiteiroPix: 0, totalAdmPix: 0, gastoCartao: 0, totalATransferir: 0,
      parcelaEvolucaoCaixa: 0, custoTotal: 0,
      dataGeracaoCusto: dataStr, vencimento: null, vencPlanejado: dataStr,
      status: 'PLANEJADO', obs: '', overrides: {},
    };
    STATE.parcelas.push(parcela);
  }
  return parcela;
}

// Lança uma compra parcelada no cartão: cria N itens (um por parcela) no
// Detalhamento FC da categoria e soma automaticamente cada parcela na
// respectiva parcela de Contas a Pagar (mês/quinzena da fatura) — mesma lógica
// do endpoint /api/categorias/:id/compra-parcelada do app Node.
function lancarCompraParcelada(catId, b) {
  const cat = STATE.categorias.find((c) => c.id === catId); if (!cat) return null;
  const descricao = (b.descricao || 'Compra no cartão').trim();
  const valorTotal = round2(Number(b.valorTotal) || 0);
  const qtdParcelas = Math.max(1, Math.min(48, Math.round(Number(b.qtdParcelas) || 1)));
  const dataCompra = b.dataCompra || new Date().toISOString().slice(0, 10);
  // A 1ª parcela cai na fatura do ciclo (fecha dia 5): compra do dia 5 em
  // diante já é do mês seguinte. As demais seguem mês a mês a partir dela.
  const primeiraFatura = String(b.primeiraFatura || '').slice(0, 7) || faturaDaCompra(dataCompra);
  if (!valorTotal || valorTotal <= 0) { toast('Informe o valor total da compra.', true); return null; }
  if (!primeiraFatura) { toast('Informe a data da compra.', true); return null; }

  const valorParcelaBase = round2(valorTotal / qtdParcelas);
  const parcelasAfetadas = [];
  for (let i = 0; i < qtdParcelas; i++) {
    const valorParcela = i === qtdParcelas - 1
      ? round2(valorTotal - valorParcelaBase * (qtdParcelas - 1))
      : valorParcelaBase;
    const mesFatura = addMonthsToDate(`${primeiraFatura}-01`, i).slice(0, 7);
    const item = {
      id: newId('item'),
      descricao: qtdParcelas > 1 ? `${descricao} (parcela ${i + 1}/${qtdParcelas})` : descricao,
      unidade: b.unidade || 'UNID',
      valorOrcado: 0,
      valorRealizado: valorParcela,
      dataPagamento: dataCompra,
      formaPagamento: 'CARTÃO',
      mesFatura,
    };
    cat.itens.push(item);
    // Mesmo caminho de qualquer item de cartão: cria o vínculo, soma na
    // parcela da fatura e recalcula o custo. Sem atalho próprio, sem risco
    // de a compra parcelada divergir do resto do app.
    const parcela = sincronizarItemCartao(item);
    if (parcela) parcelasAfetadas.push({ id: parcela.id, label: parcela.label, valor: valorParcela });
  }
  afterMutation();
  return { qtdParcelas, valorTotal, parcelasAfetadas };
}

/* Transforma um item de cartão já lançado em N parcelas mensais.
   -------------------------------------------------------------------------
   O item vira a 1ª parcela e o valor é dividido; as demais nascem nas faturas
   dos meses seguintes. É a resposta ao "informe a quantidade de parcelas e o
   sistema projeta no respectivo mês" direto na linha do Detalhamento. */
function parcelarItemCartao(catId, itemId, qtd) {
  const cat = STATE.categorias.find((c) => c.id === catId); if (!cat) return null;
  const idx = cat.itens.findIndex((i) => i.id === itemId); if (idx < 0) return null;
  const item = cat.itens[idx];
  const n = Math.max(1, Math.min(48, Math.round(Number(qtd) || 1)));
  if (n <= 1) return null;
  const total = round2(Number(item.valorRealizado) || 0);
  if (total <= 0) { toast('Informe o valor realizado antes de parcelar.', true); return null; }
  const primeira = mesFaturaDoItem(item) || faturaDaCompra(item.dataPagamento);
  if (!primeira) { toast('Informe a data da compra antes de parcelar.', true); return null; }

  const base = round2(total / n);
  const descricaoBase = String(item.descricao || 'Compra no cartão').replace(/\s*\(parcela \d+\/\d+\)\s*$/i, '');

  // O próprio item vira a parcela 1/N.
  item.descricao = `${descricaoBase} (parcela 1/${n})`;
  item.valorRealizado = base;
  item.mesFatura = primeira;
  sincronizarItemCartao(item);

  const novos = [];
  for (let i = 1; i < n; i += 1) {
    const valor = i === n - 1 ? round2(total - base * (n - 1)) : base;
    const novo = {
      id: newId('item'),
      descricao: `${descricaoBase} (parcela ${i + 1}/${n})`,
      unidade: item.unidade || 'UNID',
      valorOrcado: 0,
      valorRealizado: valor,
      dataPagamento: item.dataPagamento || null,
      formaPagamento: 'CARTÃO',
      mesFatura: addMonthsToDate(`${primeira}-01`, i).slice(0, 7),
    };
    novos.push(novo);
    sincronizarItemCartao(novo);
  }
  cat.itens.splice(idx + 1, 0, ...novos);
  afterMutation();
  toast(`"${descricaoBase}" dividido em ${n}x de ${money(base)} — projetado de ${mesQuinzenaLabel(primeira, 1)} em diante.`);
  return n;
}

function updateLiberacaoPCI(etapaNum, patch) {
  const etapa = STATE.liberacaoPCI.find((e) => e.etapa === etapaNum); if (!etapa) return;
  if (patch.descricao !== undefined) etapa.descricao = patch.descricao;
  if (patch.valor !== undefined) etapa.valor = Number(patch.valor);
  if (patch.percLimiteAcumulado !== undefined) etapa.percLimiteAcumulado = Number(patch.percLimiteAcumulado);
  if (patch.mesProgramado !== undefined) etapa.mesProgramado = Number(patch.mesProgramado);
  afterMutation();
}

// Liberações reais do CAIXA (medições mensais efetivamente pagas pelo banco).

  });

// Itens que consumiram o recurso próprio (aba Parâmetros) — cada um
// editável/adicionável; o saldo é recalculado automaticamente pela soma.

function updateConsumoRecursoProprio(id, patch) {

  if (patch.descricao !== undefined) item.descricao = patch.descricao;

}
function deleteConsumoRecursoProprio(id) { STATE.consumosRecursoProprio = (STATE.consumosRecursoProprio || []).filter((c) => c.id !== id); afterMutation(); }

function addParcela(patch) {
  STATE.parcelas.push({
    id: newId('parcela'), label: patch.label || 'NOVA PARCELA',
    totalEmpreiteiroPix: Number(patch.totalEmpreiteiroPix) || 0, totalAdmPix: Number(patch.totalAdmPix) || 0,
    gastoCartao: Number(patch.gastoCartao) || 0, totalATransferir: Number(patch.totalATransferir) || 0,
    parcelaEvolucaoCaixa: Number(patch.parcelaEvolucaoCaixa) || 0, custoTotal: Number(patch.custoTotal) || 0,
    dataGeracaoCusto: patch.dataGeracaoCusto || null,
    vencimento: patch.vencimento || null, vencPlanejado: patch.vencPlanejado || null,
