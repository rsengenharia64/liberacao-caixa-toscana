<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Painel de acompanhamento financeiro da obra Casa Newton — Gran Park Toscana.">
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; padding: 0; }
  img { max-width: 100%; }
  [hidden]:not([hidden="until-found"]) { display: none !important; }
</style>
</head>
<body>

<title>Liberação Caixa Toscana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
  :root {
    --bg: #eef1f6;
    --surface: #ffffff;
    --surface-2: #f6f8fb;
    --border: #d7dee8;
    --ink: #0f2137;
    --ink-soft: #1f3b5c;
    --muted: #5b6b80;
    --accent: #c76b1c;
    --accent-soft: #fbead9;
    --accent-ink: #8a4a10;
    --good: #1f7a4d;
    --good-soft: #e4f4ea;
    --warn: #b3720c;
    --warn-soft: #fbf0da;
    --danger: #b3261e;
    --danger-soft: #fbe6e4;
    --grid-line: rgba(15, 33, 55, 0.06);
    --shadow: 0 1px 2px rgba(15, 33, 55, 0.06);
    --radius: 10px;
    font-family: "Archivo", Arial, Helvetica, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a1420;
      --surface: #10202f;
      --surface-2: #142838;
      --border: #24405e;
      --ink: #e7edf5;
      --ink-soft: #c3d3e6;
      --muted: #8fa2b8;
      --accent: #e08a3c;
      --accent-soft: #3a2b18;
      --accent-ink: #f3bd85;
      --good: #4cbb84;
      --good-soft: #123524;
      --warn: #dba63f;
      --warn-soft: #3a2f11;
      --danger: #e2685f;
      --danger-soft: #3a1815;
      --grid-line: rgba(231, 237, 245, 0.055);
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a1420;
    --surface: #10202f;
    --surface-2: #142838;
    --border: #24405e;
    --ink: #e7edf5;
    --ink-soft: #c3d3e6;
    --muted: #8fa2b8;
    --accent: #e08a3c;
    --accent-soft: #3a2b18;
    --accent-ink: #f3bd85;
    --good: #4cbb84;
    --good-soft: #123524;
    --warn: #dba63f;
    --warn-soft: #3a2f11;
    --danger: #e2685f;
    --danger-soft: #3a1815;
    --grid-line: rgba(231, 237, 245, 0.055);
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.45; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); font-size: 12.5px; }
  h1, h2, h3 { text-wrap: balance; font-family: "Archivo", sans-serif; }

  a { color: inherit; }

  /* ---------- Title block header ---------- */
  .titleblock {
    background:
      repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 28px),
      var(--ink);
    color: #eef3fa;
    padding: 18px 24px 0 24px;
    position: sticky;
    top: 0;
    z-index: 20;
    border-bottom: 3px solid var(--accent);
  }
  :root[data-theme="dark"] .titleblock, @media (prefers-color-scheme:dark){ .titleblock { background: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 28px), repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 28px), #05101c; } }
  .titleblock-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(238,243,250,0.18);
  }
  .titleblock-name { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  .titleblock-meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 11.5px; color: #b9c8dc; }
  .titleblock-meta strong { color: #eef3fa; font-weight: 600; }
  .titleblock-name .info-host { display: none; vertical-align: middle; margin-left: 6px; }
  .titleblock-name button.info-btn { border-color: rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #eef3fa; }
  .status-chip {
    font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .status-chip.saving { background: rgba(199,107,28,0.25); color: #ffd7ab; }
  .status-chip.saved { background: rgba(31,122,77,0.25); color: #a8e6c4; }
  .status-chip.readonly { background: rgba(179,38,30,0.25); color: #ffb3ae; }
  .status-chip.local { background: rgba(199,107,28,0.28); color: #ffd7ab; }
  .status-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .tabs { display: flex; gap: 2px; margin-top: 12px; flex-wrap: wrap; }
  .tab-btn {
    background: none; border: none; color: #b9c8dc; padding: 10px 14px 12px 14px;
    cursor: pointer; font: inherit; font-size: 12.8px; font-weight: 600;
    border-bottom: 2px solid transparent;
  }
  .tab-btn:hover { color: #eef3fa; }
  .tab-btn.active { color: #eef3fa; border-bottom-color: var(--accent); }

  main#app { padding: 14px 20px 48px 20px; max-width: 1400px; margin: 0 auto; overflow-x: clip; }
  .tab-panel { display: flex; flex-direction: column; gap: 12px; }
  .tab-panel[hidden] { display: none; }

  .titleblock-acoes { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  button.btn-sessao {
    font: 600 11.5px/1 "Archivo", sans-serif; padding: 6px 12px; border-radius: 999px; cursor: pointer;
    background: rgba(255,255,255,.10); color: #eef3fa; border: 1px solid rgba(255,255,255,.28);
  }
  button.btn-sessao:hover { background: rgba(255,255,255,.18); border-color: var(--accent); }
  button.btn-sessao.ativo { background: var(--accent); border-color: var(--accent); color: #fff; }

  .modo-banner {
    border-radius: var(--radius); padding: 10px 14px; font-size: 12.5px; font-weight: 600;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn);
  }
  .modo-banner.local { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
  .modo-banner .modo-acao { margin-left: auto; }

  .login-form { display: flex; flex-direction: column; gap: 12px; }
  .login-form label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  .login-form input {
    font: inherit; padding: 9px 10px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--surface); color: var(--ink);
  }
  .login-erro { color: var(--danger); font-size: 12.5px; font-weight: 600; }
  .login-nota { font-size: 11.5px; color: var(--muted); line-height: 1.5; }

  .readonly-banner {
    background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger);
    border-radius: var(--radius); padding: 10px 14px; font-size: 12.5px; font-weight: 600;
  }
  .alert-banner {
    background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn);
    border-radius: var(--radius); padding: 10px 14px; font-size: 12.5px; font-weight: 600; margin-bottom: 12px;
  }

  /* ---------- Cards ----------
     Os cards viram uma linha só, visualmente: todos com a mesma tarja no
     topo, o rótulo ocupando sempre duas linhas (mesmo quando cabe em uma) e
     o rodapé empurrado para baixo. Assim os valores nascem todos na mesma
     altura e a fileira lê como um bloco, não como peças soltas. */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; align-items: stretch; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--border);
    border-radius: var(--radius); padding: 11px 14px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; min-width: 0;
    container-type: inline-size;
  }

  .card .card-label {
    font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
    font-weight: 600; line-height: 1.3; min-height: 2.6em; margin-bottom: 5px;
  }
  .card .card-value {
    font-size: 21px; font-weight: 700; font-family: "IBM Plex Mono", monospace;
    line-height: 1.2; overflow-wrap: break-word;
  }
  .card .progress-bar { margin-top: 8px; }
  .card .card-sub { font-size: 11.5px; color: var(--muted); margin-top: auto; padding-top: 6px; line-height: 1.35; }

  /* O valor acompanha a largura da própria caixa: com muitas colunas na mesma
     linha, o número diminui em vez de quebrar no meio. Precisa vir depois da
     regra base acima para vencer no cascade (mesma especificidade). */
  @container (max-width: 215px) { .card .card-value { font-size: 17.5px; } }
  @container (max-width: 178px) { .card .card-value { font-size: 15.5px; } }
  @container (max-width: 148px) { .card .card-value { font-size: 13.5px; } }
  .card.accent { border-top-color: var(--accent); }
  .card.good { border-top-color: var(--good); }
  .card.warn { border-top-color: var(--danger); }

  /* ---------- Panels ---------- */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 15px; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; gap: 10px; flex-wrap: wrap; }
  .panel-header h2 { margin: 0; font-size: 15px; }
  .panel-header .muted { font-size: 12px; }

  /* ---------- Ajuda contextual (ícone "i") ---------- */
  /* Todo texto explicativo longo do app fica escondido atrás de um botão "i".
     A tela fica limpa; quem quiser o "porquê" clica e lê. */
  .info-host { position: relative; display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  button.info-btn {
    flex: none; width: 17px; height: 17px; min-width: 17px; padding: 0; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
    font: 700 11px/1 "Archivo", sans-serif; cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center; vertical-align: middle;
    text-transform: none; letter-spacing: 0;
  }
  button.info-btn:hover, button.info-btn[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
  button.info-btn:disabled { opacity: 1; cursor: pointer; }
  .info-pop {
    position: absolute; top: calc(100% + 7px); left: 0; z-index: 60; width: min(360px, 78vw);
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    box-shadow: 0 10px 28px rgba(0,0,0,.18); padding: 10px 12px;
    font-size: 12.5px; line-height: 1.5; color: var(--ink-soft); font-weight: 400;
    text-transform: none; letter-spacing: normal; white-space: normal; text-align: left;
  }
  .info-pop::before {
    content: ''; position: absolute; top: -5px; left: 12px; width: 8px; height: 8px;
    background: var(--surface); border-left: 1px solid var(--border); border-top: 1px solid var(--border);
    transform: rotate(45deg);
  }
  .info-pop.right { left: auto; right: 0; }
  .info-pop.right::before { left: auto; right: 12px; }

  /* Saldo em conta: filtro e valor lado a lado, para o painel não ficar alto. */
  .saldo-negativo {
    margin-top: 10px; padding: 9px 12px; border-radius: 8px; font-size: 12px; line-height: 1.45;
    background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn);
  }
  .saldo-negativo.critico { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }

  .saldo-conta-linha { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .saldo-conta-linha .saldoContaFiltroSlot { flex: 1; min-width: 190px; }
  .saldo-conta-valor { font-size: 24px; font-weight: 700; white-space: nowrap; }
  @media (max-width: 520px) { .saldo-conta-valor { font-size: 21px; } }

  /* ---------- Seletor de quinzenas (pílulas agrupadas por mês) ---------- */
  .qz-picker { display: flex; flex-direction: column; gap: 9px; margin: 2px 0 10px; }
  .qz-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .qz-count { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .qz-groups { display: flex; flex-wrap: wrap; gap: 8px; }
  .qz-group {
    display: inline-flex; align-items: stretch; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  .qz-month, button.qz-month, button.qz-chip {
    border: none; font-family: inherit; cursor: pointer; padding: 5px 9px;
    background: transparent; color: var(--muted); transition: background .12s, color .12s;
  }
  .qz-month, button.qz-month {
    font: 700 10.5px/1.4 "Archivo", sans-serif; text-transform: uppercase; letter-spacing: .05em;
    background: var(--surface-2); border-right: 1px solid var(--border); white-space: nowrap;
  }
  button.qz-month.on { color: var(--accent-ink); }
  button.qz-month:hover { background: var(--accent-soft); color: var(--accent-ink); }
  button.qz-chip {
    font: 600 12.5px/1.2 "IBM Plex Mono", monospace; border-left: 1px solid var(--border);
    min-width: 38px; text-align: center;
  }
  button.qz-chip:hover:not(.on) { background: var(--accent-soft); color: var(--accent-ink); }
  button.qz-chip.on { background: var(--accent); color: #fff; }
  /* Quinzena ainda planejada: marcada, vira pílula contornada em vez de
     preenchida — lê como "está no total, mas ainda não aconteceu" nos dois
     temas, sem depender de texto branco sobre amarelo claro. */
  button.qz-chip.planejada.on { background: var(--warn-soft); color: var(--warn); box-shadow: inset 0 0 0 2px var(--warn); }
  button.qz-chip:disabled, button.qz-month:disabled { opacity: 1; cursor: pointer; }

  /* ---------- Valor clicável que abre extrato ---------- */
  .value-drill {
    background: none; border: none; padding: 0; font: inherit; color: inherit; cursor: pointer;
    display: inline-flex; align-items: center; gap: 10px; line-height: 1.15;
    flex-wrap: wrap; text-align: left;
  }
  .value-drill.small { gap: 7px; }
  .value-drill.tiny { gap: 6px; font-size: inherit; color: var(--muted); }
  .value-drill.tiny .drill-value { border-bottom-width: 1px; }
  .value-drill.tiny .drill-hint { font-size: 9.5px; padding: 2px 6px; }

  /* Recorte por data no consumo de recurso próprio */
  .consumo-filtro { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 12px; }
  .consumo-filtro label { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  .consumo-filtro input[type="date"] { width: auto; min-width: 0; border-color: var(--border); }
  .consumo-leitura { font-size: 12.5px; color: var(--ink-soft); flex: 1; min-width: 220px; }
  .extrato-table tr.planejado-linha td { color: var(--warn); }
  .extrato-table tr.extrato-grupo td {
    background: var(--surface-2); font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; color: var(--ink-soft); padding-top: 10px; padding-bottom: 10px;
  }
  .extrato-table tr.extrato-residuo td { background: var(--accent-soft); color: var(--accent-ink); }
  .extrato-table td.sub-item { padding-left: 26px; color: var(--muted); font-size: 11.5px; }
  .extrato-table tr.fora-do-recorte td { opacity: .45; }
  .value-drill.small .drill-hint { font-size: 10px; padding: 3px 7px; }
  .value-drill .drill-value { border-bottom: 2px dashed var(--accent); }
  .value-drill:hover .drill-value { color: var(--accent-ink); }
  .value-drill:disabled { opacity: 1; cursor: pointer; }
  .value-drill .drill-hint {
    font: 600 11px/1 "Archivo", sans-serif; color: var(--accent-ink); background: var(--accent-soft);
    border-radius: 999px; padding: 5px 9px; letter-spacing: .02em; white-space: nowrap;
  }
  .modal.wide { max-width: 760px; }
  .extrato-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .extrato-table th, .extrato-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); text-align: left; }
  .extrato-table th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .extrato-table thead th { position: sticky; top: 0; background: var(--surface); z-index: 2; }
  .extrato-table tfoot td { position: sticky; bottom: 0; background: var(--surface); z-index: 2; }
  .extrato-table td.num, .extrato-table th.num { text-align: right; font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
  .extrato-table tbody tr.planejado td:first-child::after { content: ' (planejado)'; color: var(--warn); font-size: 11px; }
  .extrato-table tfoot td { font-weight: 700; border-top: 2px solid var(--ink); border-bottom: none; }
  .extrato-total-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 12px; background: var(--accent-soft); border-radius: 9px; }
  .extrato-total-line strong { font-size: 20px; font-family: "IBM Plex Mono", monospace; color: var(--accent-ink); }
  .viab-destaques { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; }
  .viab-num {
    display: flex; flex-direction: column; gap: 3px; padding: 11px 13px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px;
  }
  .viab-rotulo { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); line-height: 1.3; }
  .viab-valor { font-family: "IBM Plex Mono", monospace; font-size: 21px; font-weight: 700; color: var(--ink); }
  .viab-valor.bom { color: var(--good); }
  .viab-valor.ruim { color: var(--danger); }
  .viab-nota { font-size: 10.5px; color: var(--muted); line-height: 1.35; }

  .extrato-total-line.negativo { background: var(--danger-soft); }
  .extrato-total-line.negativo strong { color: var(--danger); }
  .divergencia-box {
    border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 9px;
    padding: 11px 13px; display: flex; flex-direction: column; gap: 8px;
  }
  .divergencia-titulo { font-size: 12.5px; font-weight: 700; color: var(--warn); }
  .divergencia-texto { font-size: 12px; color: var(--ink-soft); line-height: 1.45; }
  .divergencia-linha {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 12px; padding-top: 7px; border-top: 1px solid var(--warn);
  }
  .divergencia-linha .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-soft); }
  .divergencia-linha button { margin-left: auto; }

  .extrato-empty { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .extrato-table tr.extrato-linha-verba td { background: var(--good-soft); color: var(--good); }
  .extrato-table tfoot tr:last-child td { color: var(--accent-ink); font-size: 14px; }

  /* ---------- Marco: fatia do avanço (CAIXA/PLS x recurso próprio) ---------- */
  .scurve-seg { rx: 2; }
  .scurve-seg.caixa { fill: var(--accent); opacity: .45; }
  .scurve-seg.rp { fill: var(--good); }
  .scurve-seg-tick { stroke: var(--muted); stroke-width: 1; }
  .scurve-seg-tag {
    font-size: 10.5px; font-weight: 700; font-family: "Archivo", sans-serif;
    paint-order: stroke fill; stroke: var(--surface); stroke-width: 3.5px; stroke-linejoin: round;
  }
  .scurve-seg-tag.rp { fill: var(--good); }
  .scurve-seg-tag.caixa { fill: var(--accent-ink); }
  .scurve-marks { display: flex; gap: 8px; align-items: flex-start; font-size: 11.5px; color: var(--muted); margin-top: 10px; }
  .scurve-marks .mark-key { flex: none; display: block; width: 14px; height: 10px; border-radius: 2px; background: linear-gradient(to bottom, var(--good) 0 40%, color-mix(in srgb, var(--accent) 45%, transparent) 40% 100%); margin-top: 3px; }
  .scurve-marks .mark-text { flex: 1; line-height: 1.45; }
  .scurve-marks .info-host { margin-top: 1px; }

  /* ---------- Glossário de rastreabilidade ---------- */
  .glossary-grid { display: flex; flex-direction: column; gap: 10px; }
  .glossary-item { border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; background: var(--surface-2); }
  .glossary-item .glossary-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .glossary-item .glossary-label { font-weight: 700; font-size: 13.5px; }
  .glossary-item .glossary-value { font-weight: 700; font-size: 15px; color: var(--accent-ink); }
  .glossary-item .glossary-formula { font-size: 12.5px; margin-top: 4px; }
  .glossary-item .glossary-fonte { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  /* ---------- Tables ---------- */
  .table-scroll { overflow-x: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 12.7px; min-width: 640px; }
  table.data th, table.data td { padding: 7px 9px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  table.data th { background: var(--surface-2); font-weight: 600; color: var(--ink-soft); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; position: sticky; top: 0; }
  table.data tbody tr:hover { background: var(--surface-2); }
  table.data tfoot td { font-weight: 700; background: var(--surface-2); font-family: "IBM Plex Mono", monospace; }
  td.num, th.num { text-align: right; font-family: "IBM Plex Mono", monospace; }
  td.wrap { white-space: normal; min-width: 180px; }

  /* Contas a Pagar: fixa a coluna de excluir (🗑) na borda direita — a tabela
     é larga (14 colunas) e o ícone ficava fora da tela sem rolar até o fim. */
  #tblParcelas th:last-child, #tblParcelas td:last-child {
    position: sticky; right: 0; background: var(--surface); border-left: 1px solid var(--border);
  }
  #tblParcelas th:last-child { background: var(--surface-2); z-index: 2; }
  #tblParcelas tbody tr:hover td:last-child { background: var(--surface-2); }

  .cell-input {
    border: 1px solid transparent; background: transparent; font: inherit; color: var(--ink);
    width: 100%; min-width: 70px; padding: 3px 5px; border-radius: 5px; font-family: "IBM Plex Mono", monospace;
  }
  input.cell-input[type="text"], textarea.cell-input, select.cell-input { font-family: "Archivo", sans-serif; }
  .cell-input:hover { border-color: var(--border); }
  .cell-input:focus { border-color: var(--accent); background: var(--surface); outline: none; }
  .cell-input.manual { color: var(--accent-ink); font-weight: 600; }
  .cell-input.wide { min-width: 140px; }
  .badge-cell.manual { color: var(--accent-ink); font-weight: 600; }
  .badge-cell.auto { color: var(--ink); }
  .cell-input:disabled { color: var(--muted); cursor: default; }

  /* ---------- Status REALIZADO x PLANEJADO ----------
     O status era um <select> sem cor nenhuma, então "já pagou" e "ainda vai
     pagar" liam igual na tabela. Agora vira uma pílula colorida — verde para
     o que aconteceu, âmbar para o que é previsão — sem deixar de ser
     editável. A linha inteira também ganha um tom e uma tarja lateral. */
  select.cell-input.status-select {
    width: auto; min-width: 0; font-weight: 700; font-size: 11px; letter-spacing: .04em;
    border-radius: 999px; padding: 4px 6px 4px 9px; cursor: pointer;
  }
  select.cell-input.status-select.realizado { background: var(--good-soft); color: var(--good); border-color: var(--good); }
  select.cell-input.status-select.planejado { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
  select.cell-input.status-select:focus { border-color: var(--accent); }
  select.cell-input.status-select:disabled { color: inherit; opacity: 1; }

  table.data tbody tr.row-planejada { background: color-mix(in srgb, var(--warn-soft) 45%, transparent); }
  table.data tbody tr.row-planejada:hover { background: color-mix(in srgb, var(--warn-soft) 75%, transparent); }
  table.data tbody tr.row-planejada > td:first-child { box-shadow: inset 3px 0 0 0 var(--warn); }
  table.data tbody tr.row-realizada > td:first-child { box-shadow: inset 3px 0 0 0 var(--good); }
  /* A última coluna de Contas a Pagar é sticky e precisa de fundo opaco —
     senão o conteúdo passa por baixo dela. Aqui ela acompanha o tom da linha. */
  #tblParcelas tbody tr.row-planejada td:last-child { background: color-mix(in srgb, var(--warn-soft) 45%, var(--surface)); }
  #tblParcelas tbody tr.row-planejada:hover td:last-child { background: color-mix(in srgb, var(--warn-soft) 75%, var(--surface)); }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge.green { background: var(--good-soft); color: var(--good); }
  .badge.amber { background: var(--warn-soft); color: var(--warn); }
  .badge.accent { background: var(--accent-soft); color: var(--accent-ink); }
  .badge.red { background: var(--danger-soft); color: var(--danger); }
  .badge.gray { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }

  .progress-bar { background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; height: 8px; width: 100%; overflow: hidden; }
  .progress-bar > span { display: block; height: 100%; background: var(--accent); }
  .progress-bar.small { width: 70px; }

  .gantt-track { position: relative; height: 22px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; min-width: 220px; overflow: hidden; }
  .gantt-planned { position: absolute; top: 0; bottom: 0; background: var(--border); border-radius: 6px; }
  .gantt-actual { position: absolute; top: 4px; bottom: 4px; left: 0; background: var(--accent); border-radius: 4px; }
  .gantt-actual.status-atrasado { background: var(--danger); }
  .gantt-actual.status-concluido { background: var(--good); }
  .gantt-hoje { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--warn); }
  .gantt-legend { display: flex; gap: 16px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .gantt-legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* ---------- Dashboard Executivo: curva S ---------- */
  .scurve-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 12px; }
  .scurve-card { min-width: 0; }
  .scurve-legend { display: flex; gap: 14px; align-items: center; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
  .scurve-key { display: inline-block; width: 16px; height: 3px; margin-right: 6px; vertical-align: 2px; border-radius: 2px; }
  .scurve-key.executed { background: var(--accent); }
  .scurve-key.planned { background: var(--muted); }
  .scurve-key-sep { width: 1px; height: 14px; background: var(--border); margin: 0 2px; }

  .scurve-wrap { position: relative; margin-top: 8px; }
  .scurve-svg { width: 100%; height: auto; display: block; touch-action: none; }
  .scurve-grid { stroke: var(--grid-line); stroke-width: 1; }
  .scurve-axis-label { font-size: 9.5px; fill: var(--muted); font-family: inherit; }
  .scurve-line { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .scurve-line.executed { stroke: var(--accent); }
  .scurve-line.planned { stroke: var(--muted); }
  .scurve-dot { stroke: var(--surface); stroke-width: 2; }
  .scurve-dot.executed { fill: var(--accent); }
  .scurve-dot.planned { fill: var(--muted); }
  .scurve-hoje { stroke: var(--warn); stroke-width: 1.5; }
  .scurve-crosshair { stroke: var(--ink); stroke-opacity: 0.25; stroke-width: 1; }

  .scurve-tooltip {
    position: absolute; top: 8px; transform: translateX(-50%);
    background: var(--ink); color: var(--surface); border-radius: 8px; padding: 8px 10px;
    font-size: 12px; white-space: nowrap; pointer-events: none; box-shadow: var(--shadow);
    z-index: 5;
  }
  .scurve-tooltip-date { font-weight: 700; margin-bottom: 4px; }
  .scurve-tooltip-row { display: flex; align-items: center; gap: 6px; }
  .scurve-tooltip .scurve-key { width: 10px; }

  .scurve-gap-note { margin-top: 10px; padding: 8px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; }
  .scurve-gap-note.good { background: var(--good-soft); color: var(--good); }
  .scurve-gap-note.warn { background: var(--warn-soft); color: var(--warn); }

  .scurve-table-details { margin-top: 10px; font-size: 12.5px; }
  .scurve-table-details summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  .scurve-table-details .table-scroll { margin-top: 8px; max-height: 260px; overflow-y: auto; }

  .painel-select-body { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(260px, 1fr); gap: 18px; margin-top: 10px; }
  .painel-select-list { max-height: 420px; overflow-y: auto; }
  .clickable-row { cursor: pointer; }
  .clickable-row:hover { background: var(--accent-soft); }
  /* ---------- Avanço medido por categoria ---------- */
  .conf-cartao {
    border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 9px;
    padding: 11px 13px; margin-top: 10px; display: flex; flex-direction: column; gap: 9px;
  }
  .conf-cartao.ok { border-color: var(--good); background: var(--good-soft); }
  .conf-cartao.ok .conf-titulo { color: var(--good); }
  .conf-topo { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .conf-topo > div:first-child { flex: 1; min-width: 240px; }
  .conf-titulo { font-size: 12.5px; font-weight: 700; color: var(--warn); }
  .conf-texto { font-size: 12px; color: var(--ink-soft); line-height: 1.45; margin-top: 3px; }
  .conf-cartao .table-scroll { max-height: 260px; }
  .conf-cartao.auto { border-color: var(--accent); background: var(--accent-soft); }
  .conf-cartao.auto .conf-titulo { color: var(--accent-ink); }
  .conf-acoes { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .auto-switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--ink); }
  .auto-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .auto-switch .trilho {
    width: 38px; height: 21px; border-radius: 999px; background: var(--border);
    position: relative; transition: background .15s ease; flex: none;
  }
  .auto-switch .trilho::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3);
    transition: transform .15s ease;
  }
  .auto-switch input:checked + .trilho { background: var(--accent); }
  .auto-switch input:checked + .trilho::after { transform: translateX(17px); }
  .auto-switch input:focus-visible + .trilho { outline: 2px solid var(--accent); outline-offset: 2px; }
  td.forma-cell { min-width: 200px; }
  td.forma-cell > * { display: block; }
  td.forma-cell .fatura-input { margin-top: 4px; width: 100%; max-width: 170px; }
  tfoot tr.total-realizado td { color: var(--good); }
  tfoot tr.total-planejado td { color: var(--muted); font-weight: 500; }
  tfoot tr.total-geral td { border-top: 2px solid var(--border); }
  .parcelar-box { display: flex; align-items: center; gap: 5px; margin-top: 4px; }
  .parcelar-box::before { content: 'Parcelar em'; font-size: 11px; color: var(--ink-soft); }
  .parcelar-x { font-size: 11px; color: var(--ink-soft); margin-left: -2px; }
  .parcelas-input { width: 46px; text-align: center; padding-left: 4px; padding-right: 4px; }
  .parcelar-box .btn.small { padding: 2px 8px; font-size: 11px; white-space: nowrap; }
  .cell-input.derivado {
    background: var(--accent-soft); border-style: dashed; color: var(--ink-soft);
    cursor: not-allowed;
  }

  .cartao-origem { font-size: 11.5px; margin: 2px 0 10px; display: flex; flex-direction: column; gap: 3px; }
  .cartao-origem-titulo { font-weight: 700; color: var(--accent-ink); margin-bottom: 2px; }
  .cartao-origem-item { display: flex; justify-content: space-between; gap: 12px; color: var(--ink-soft); border-bottom: 1px dashed var(--border); padding-bottom: 2px; }
  .cartao-origem-item .mono { font-family: "IBM Plex Mono", monospace; }

  .fatura-input { margin-top: 4px; font-size: 11.5px; min-width: 0; width: auto; border-color: var(--border); }

  .cartao-destino {
    display: block; margin-top: 3px; font-size: 10.5px; font-weight: 600;
    color: var(--accent-ink); white-space: nowrap;
  }
  .cartao-destino.pendente { color: var(--warn); font-style: italic; }

  .avanco-td { min-width: 190px; }
  .avanco-cell { display: flex; flex-direction: column; gap: 4px; }
  .avanco-topo { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .avanco-pct { font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
  .avanco-tag {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    padding: 2px 7px; border-radius: 999px; white-space: nowrap;
  }
  .avanco-bar { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--border); }
  .avanco-bar > span { display: block; height: 100%; border-radius: 3px; }
  .avanco-hist { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .avanco-hist.sem { font-style: italic; opacity: .75; }

  .avanco-cell.concluido .avanco-pct { color: var(--good); }
  .avanco-cell.concluido .avanco-tag { background: var(--good-soft); color: var(--good); }
  .avanco-cell.concluido .avanco-bar > span { background: var(--good); }
  .avanco-cell.andamento .avanco-pct { color: var(--accent-ink); }
  .avanco-cell.andamento .avanco-tag { background: var(--accent-soft); color: var(--accent-ink); }
  .avanco-cell.andamento .avanco-bar > span { background: var(--accent); }
  .avanco-cell.nao-iniciado .avanco-pct { color: var(--muted); }
  .avanco-cell.nao-iniciado .avanco-tag { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }

  /* Linha do tempo das medições, dentro do quadro de detalhe */
  .avanco-timeline { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
  .avanco-timeline.vazio { font-size: 12px; color: var(--muted); font-style: italic; }
  .avanco-timeline-titulo { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 8px; }
  .avanco-passo {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 12px;
    padding: 5px 0 5px 14px; position: relative; border-left: 2px solid var(--accent); color: var(--ink-soft);
  }
  .avanco-passo::before {
    content: ''; position: absolute; left: -5px; top: 11px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--accent); border: 2px solid var(--accent-soft);
  }
  .avanco-passo.final { border-left-color: var(--good); }
  .avanco-passo.final::before { background: var(--good); border-color: var(--good-soft); }
  .avanco-passo:last-child { padding-bottom: 0; }
  .avanco-passo-data { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--muted); }
  .avanco-passo-salto { font-variant-numeric: tabular-nums; }
  .avanco-passo-delta { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--good); }

  .painel-select-body.sem-detalhe { grid-template-columns: 1fr; }
  .painel-select-body.sem-detalhe .painel-select-list { max-height: 480px; }
  .clickable-row.row-selected { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .painel-select-detail { background: var(--accent-soft); border-radius: 10px; padding: 16px; }
  .painel-select-detail h3 { margin: 0 0 6px 0; }
  .painel-detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .painel-detail-head h3 { flex: 1; }
  button.btn.painel-detail-close { flex: none; background: transparent; border-color: transparent; color: var(--muted); }
  button.btn.painel-detail-close:hover { border-color: var(--accent); color: var(--accent-ink); }
  .painel-detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; font-size: 13px; }
  @media (max-width: 800px) { .painel-select-body { grid-template-columns: 1fr; } }

  button.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 7px; padding: 7px 12px; font-size: 12.5px; cursor: pointer; font-weight: 600; color: var(--ink); font-family: inherit; }
  button.btn:hover { border-color: var(--accent); color: var(--accent-ink); }
  button.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.btn.primary:hover { opacity: .9; color: #fff; }
  button.btn.danger { color: var(--danger); }
  button.btn.danger:hover { border-color: var(--danger); }
  button.btn.small { padding: 4px 8px; font-size: 11.5px; }
  button.btn:disabled { opacity: .5; cursor: default; }
  button.icon-btn { background: none; border: none; cursor: pointer; font-size: 14px; color: var(--muted); padding: 2px 6px; }
  button.icon-btn:hover { color: var(--danger); }
  button.icon-btn:disabled { opacity: .3; cursor: default; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .legend .dot.manual { background: var(--accent); }
  .legend .dot.auto { background: var(--muted); }

  form.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  form.form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-soft); font-weight: 600; }
  form.form-grid input, form.form-grid select, form.form-grid textarea {
    font: inherit; padding: 8px 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--ink);
  }
  form.form-grid textarea { resize: vertical; min-height: 60px; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(10, 20, 32, .5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal { background: var(--surface); border-radius: 12px; width: 100%; max-width: 480px; max-height: 90vh; overflow: auto; box-shadow: 0 20px 50px rgba(0,0,0,.35); border: 1px solid var(--border); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .modal-header h3 { margin: 0; font-size: 15px; }
  .modal-close { border: none; background: none; font-size: 16px; cursor: pointer; color: var(--muted); }
  .modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }

  .toast { position: fixed; bottom: 18px; right: 18px; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .toast.error { background: var(--danger); color: #fff; }

  /* ---------- Instalar no celular ---------- */
  .app-install { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .app-icon-preview {
    width: 76px; height: 76px; border-radius: 17px; flex: none;
    box-shadow: 0 6px 18px rgba(15, 33, 55, .22); border: 1px solid var(--border);
  }
  .app-install-body { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 10px; }
  .app-install-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .app-install-steps summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 12.5px; }
  .app-install-steps ol { margin: 8px 0 0 0; padding-left: 20px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; }
  .app-install-steps li + li { margin-top: 5px; }

  .category-block { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  .category-block > .category-head { padding: 10px 14px; background: var(--surface-2); display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; flex-wrap: wrap; }
  .category-head .name { font-weight: 700; font-size: 13.5px; }
  .category-head .stats { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--muted); font-family: "IBM Plex Mono", monospace; }
  .category-body { padding: 12px 14px; display: none; }
  .category-block.open .category-body { display: block; }

  /* ==========================================================================
     Tablet e celular
     --------------------------------------------------------------------------
     Regra que vale para tudo aqui: encolher e reempilhar, nunca cortar. As
     tabelas largas continuam inteiras e rolam na horizontal dentro do próprio
     quadro; nada é escondido por falta de espaço.
     ========================================================================== */

  /* Tablet */
  @media (max-width: 1024px) {
    main#app { padding: 16px 16px 56px 16px; }
    .card .card-value { font-size: 19px; }
    .painel-select-body { grid-template-columns: 1fr; }
  }

  /* A barra de abas vira uma faixa que rola de lado, em vez de quebrar em
     quatro linhas e comer metade da tela do celular. */
  @media (max-width: 860px) {
    .tabs {
      flex-wrap: nowrap; overflow-x: auto; scroll-snap-type: x proximity;
      margin-top: 8px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn { flex: none; scroll-snap-align: start; padding: 9px 12px 11px 12px; }
  }

  /* Celular */
  @media (max-width: 720px) {
    main#app { padding: 12px 12px 56px 12px; }
    .titleblock { padding: 12px 12px 0 12px; }
    .titleblock-name { font-size: 17px; }
    /* No celular a ficha da obra (endereco, proprietario, responsavel, area)
       sai do cabecalho e vai para o "i" ao lado do nome — devolve uns 50px
       de tela util sem esconder nada de verdade. */
    .titleblock-meta { display: none; }
    .titleblock-name .info-host { display: inline-flex; }
    .titleblock-row { gap: 8px; }
    .panel { padding: 13px; }
    .tab-panel { gap: 13px; }
    .cards-grid { gap: 10px; }

/* ==========================================================================
   Motor de cálculo (mesma lógica do app original — puro, sem dependências)
   ========================================================================== */
function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
function sum(arr, fn) { return arr.reduce((acc, item) => acc + (Number(fn(item)) || 0), 0); }
function monthKeyFromDateStr(dateStr) {
  if (!dateStr) return null;
  const d = String(dateStr).slice(0, 7);
  return /^\d{4}-\d{2}$/.test(d) ? d : null;
}
function addMonthsToKey(monthKey, n) {
  const [y, m] = monthKey.split('-').map(Number);
  const total = (y * 12 + (m - 1)) + n;
  const ny = Math.floor(total / 12);
  const nm = (total % 12) + 1;
  return `${ny}-${String(nm).padStart(2, '0')}`;
}
const MONTH_LABEL = { '01': 'Janeiro', '02': 'Fevereiro', '03': 'Março', '04': 'Abril', '05': 'Maio', '06': 'Junho', '07': 'Julho', '08': 'Agosto', '09': 'Setembro', '10': 'Outubro', '11': 'Novembro', '12': 'Dezembro' };
function monthLabel(monthKey) {
  if (!monthKey) return 'Sem data';
  const [y, m] = monthKey.split('-');
  return `${MONTH_LABEL[m] || m}/${y}`;
}
function quinzenaFromDateStr(dateStr) {
  if (!dateStr) return null;
  const day = Number(String(dateStr).slice(8, 10));
  if (!day) return null;
  return day <= 15 ? 1 : 2;
}
function monthQuinzenaLabel(monthKey, quinzena) {
  if (!monthKey || monthKey === 'sem-data') return 'Sem data';
  const base = monthLabel(monthKey);
  return quinzena ? `${base} — ${quinzena}ª Parcela` : base;
}

function calcPercPrevisto(cronogramaPrevisto, dataRef) {
  if (!cronogramaPrevisto || !cronogramaPrevisto.inicio || !cronogramaPrevisto.termino) return 0;
  const inicio = new Date(cronogramaPrevisto.inicio + 'T00:00:00');
  const termino = new Date(cronogramaPrevisto.termino + 'T00:00:00');
  const ref = new Date(dataRef + 'T00:00:00');
  if (Number.isNaN(inicio.getTime()) || Number.isNaN(termino.getTime()) || Number.isNaN(ref.getTime())) return 0;
  if (ref <= inicio) return 0;
  if (ref >= termino) return 1;
  const totalMs = termino.getTime() - inicio.getTime();
  if (totalMs <= 0) return 1;
  return clamp((ref.getTime() - inicio.getTime()) / totalMs, 0, 1);
}

const ITEM_PLUG_REGEX = /m[ãa]o de obra/i;

function computeCategoria(cat, dataRef, tetoAvancoEfetivo) {
  const teto = Number.isFinite(tetoAvancoEfetivo) ? tetoAvancoEfetivo : 1;
  const valorOrcado = Number(cat.valorOrcado) || 0;
  const itensBrutos = cat.itens || [];
  const itemPlug = itensBrutos.find((it) => ITEM_PLUG_REGEX.test(it.descricao || ''));
  const somaOutrosItens = round2(sum(itensBrutos.filter((it) => it !== itemPlug), (it) => it.valorRealizado));
  const itensComPlug = itemPlug
    ? itensBrutos.map((it) => {
        if (it !== itemPlug) return it;
        const tetoPlug = Math.max(0, round2(valorOrcado - somaOutrosItens));
        const valorRealizadoOriginal = Number(it.valorRealizado) || 0;
        const valorRealizadoAjustado = Math.min(valorRealizadoOriginal, tetoPlug);
        return valorRealizadoAjustado === valorRealizadoOriginal
          ? it
          : { ...it, valorRealizado: valorRealizadoAjustado, valorRealizadoOriginal };
      })
    : itensBrutos;
  // Nota: itens individuais NÃO têm teto no seu próprio valorOrcado — um item
  // pode legitimamente custar mais do que a cotação inicial (ex.: "REGISTRO DO
  // LOTE" orçado em R$8.000 mas realizado em R$14.008,01, confirmado na planilha
  // original: 'Detalhamento F.C'!E16 soma os itens sem cap por linha). O teto de
  // medição "nunca mais que 100%" vale para a categoria como um todo — garantido
  // pelo item plug (que só encolhe, nunca infla) e pelo clamp de percAvancoEfetivo
  // logo abaixo — não para cada item isoladamente.
  const itens = itensComPlug;
  const valorRealizadoItens = round2(sum(itens, (it) => it.valorRealizado));
  const percAvancoItensCalculado = valorOrcado > 0 ? valorRealizadoItens / valorOrcado : 0;
  // "% itens (FC)" normalmente é só a soma dos itens do Detalhamento FC sobre
  // o orçado — mas pode ser sobrescrito manualmente (percItensManual), igual
  // aos outros campos "automático com override" do app. Só afeta o % avanço
  // efetivo quando NÃO há um percAvancoManual próprio (que sempre tem
  // prioridade) — nesse caso funciona como o novo "automático" de baixo.
  const temOverrideItens = cat.percItensManual !== null && cat.percItensManual !== undefined;
  const percAvancoItens = temOverrideItens ? Number(cat.percItensManual) : percAvancoItensCalculado;
  const temOverride = cat.percAvancoManual !== null && cat.percAvancoManual !== undefined;
  // Teto de medição: nunca mais que "teto" (padrão 100%) da categoria como um
  // todo — configurável em Parâmetros > Regras de cálculo (tetoAvancoEfetivo).
  const percAvancoEfetivo = clamp(temOverride ? Number(cat.percAvancoManual) : percAvancoItens, 0, teto);
  const valorMedido = round2(valorOrcado * percAvancoEfetivo);
  const percPrevisto = calcPercPrevisto(cat.cronogramaPrevisto, dataRef);
  const valorPrevisto = round2(valorOrcado * percPrevisto);
  const statusCronograma = !cat.cronogramaPrevisto
    ? 'sem-dados'
    : percAvancoEfetivo >= 1
      ? 'concluido'
      : percAvancoEfetivo + 0.0001 >= percPrevisto
        ? 'no-prazo'
        : 'atrasado';
  const verbaCaixa = Number(cat.verbaCaixa) || 0;
  const caixaLiberadoAutoCategoria = round2(verbaCaixa * percAvancoEfetivo);
  const temOverrideCaixa = cat.liberadoCaixaManual !== null && cat.liberadoCaixaManual !== undefined;
  const caixaLiberadoCategoria = temOverrideCaixa ? round2(Number(cat.liberadoCaixaManual)) : caixaLiberadoAutoCategoria;
  return {
    ...cat,
    itens,
    valorRealizadoItens,
    percAvancoItens: round2(percAvancoItens * 10000) / 10000,
    origemPercItens: temOverrideItens ? 'manual' : 'auto',
    percAvancoEfetivo: round2(percAvancoEfetivo * 10000) / 10000,
    origemPercAvanco: temOverride ? 'manual' : 'itens',
    valorMedido,
    saldoContratoCategoria: round2(valorOrcado - valorMedido),
    percPrevisto: round2(percPrevisto * 10000) / 10000,
    valorPrevisto,
    statusCronograma,
    verbaCaixa,
    caixaLiberadoAutoCategoria,
    caixaLiberadoCategoria,
    origemCaixaCategoria: temOverrideCaixa ? 'manual' : 'auto',
    saldoCaixaCategoria: round2(verbaCaixa - caixaLiberadoCategoria),
  };
}

// Recalcula cat.percAvancoManual a partir do avanço REALIZADO mais recente
// (por data) no histórico dessa categoria — avanços PLANEJADO não contam,
// igual à lógica de "parcela REALIZADO" em Contas a Pagar: um avanço fica
// visível e editável na aba Lançar Avanços, mas só passa a valer no % de
// avanço efetivo (e em tudo que depende dele — Execução financeira, Crédito
// CAIXA disponível etc.) quando confirmado como REALIZADO. Chamada sempre
// que um item do histórico é criado/editado/excluído/tem o status alterado.
// Se não houver nenhum avanço REALIZADO para a categoria (ex.: o único foi
// excluído), o valor atual de percAvancoManual é preservado — o % de obra
// não "volta atrás" para um estado sem histórico algum (ex.: os valores
// iniciais vindos da planilha, que não têm entrada correspondente aqui).
function recomputeCategoriaPercManual(categoria, historicoAvancos) {
  const realizados = (historicoAvancos || [])
    .filter((h) => h.categoriaId === categoria.id && h.status === 'REALIZADO')
    .sort((a, b) => (a.data || '').localeCompare(b.data || '') || (a.timestamp || '').localeCompare(b.timestamp || ''));
  if (realizados.length) {
    categoria.percAvancoManual = realizados[realizados.length - 1].percAvancoNovo;
  }
}

// Etapas do cronograma macro planejado (puramente informativo/planejamento —
// define o total de 1.5M e a curva "planejada"). O valor REALMENTE liberado
// pelo banco não segue esse cronograma por % de obra (confirmado contra a
// planilha original: o banco libera por medição mensal, em valores e datas
// que não batem com as 6 etapas) — é rastreado à parte em liberacoesCaixa.
function computeLiberacaoPCI(liberacaoPCI) {
  return [...liberacaoPCI].sort((a, b) => a.etapa - b.etapa);
}

function computeParcela(parcela) {
  const autoTotalATransferir = round2((Number(parcela.totalEmpreiteiroPix) || 0) + (Number(parcela.totalAdmPix) || 0));
  const autoCustoTotal = round2(autoTotalATransferir + (Number(parcela.gastoCartao) || 0) + (Number(parcela.parcelaEvolucaoCaixa) || 0));
  const overrides = parcela.overrides || {};

  const dataOcorrencia = parcela.vencimento || parcela.vencPlanejado || null;
  const mesReferencia = monthKeyFromDateStr(dataOcorrencia);
  const quinzena = quinzenaFromDateStr(dataOcorrencia);

  return {
    ...parcela,
    totalATransferir: overrides.totalATransferir ? Number(parcela.totalATransferir) : autoTotalATransferir,
    custoTotal: overrides.custoTotal ? Number(parcela.custoTotal) : autoCustoTotal,
    autoTotalATransferir, autoCustoTotal,
    mesReferencia,
    quinzena,
    mesReferenciaLabel: mesReferencia ? monthQuinzenaLabel(mesReferencia, quinzena || 1) : null,
  };
}

function recompute(state) {
  const dataRef = (state.meta && state.meta.dataReferenciaCronograma) || new Date().toISOString().slice(0, 10);
  // Teto de medição por categoria (padrão 100%) — parâmetro configurável em
  // Parâmetros > Regras de cálculo; ausente/limpo no estado = comportamento
  // original (100%), preservando os cálculos já lançados.
  const rawTeto = (state.parametros || {}).tetoAvancoEfetivo;
  const tetoAvancoEfetivo = (rawTeto !== null && rawTeto !== undefined && Number.isFinite(Number(rawTeto)))
    ? Number(rawTeto)
    : 1;
  const categoriasBase = (state.categorias || []).map((c) => computeCategoria(c, dataRef, tetoAvancoEfetivo));
  const totalOrcadoCategorias = round2(sum(categoriasBase, (c) => c.valorOrcado));
  const totalMedido = round2(sum(categoriasBase, (c) => c.valorMedido));
  const totalPrevistoCronograma = round2(sum(categoriasBase, (c) => c.valorPrevisto));
  const percObraGeral = totalOrcadoCategorias > 0 ? totalMedido / totalOrcadoCategorias : 0;
  const percPrevistoGeral = totalOrcadoCategorias > 0 ? totalPrevistoCronograma / totalOrcadoCategorias : 0;
  const totalVerbaCaixaCategorias = round2(sum(categoriasBase, (c) => c.verbaCaixa));
  const totalCaixaLiberadoCategorias = round2(sum(categoriasBase, (c) => c.caixaLiberadoCategoria));

  // Peso de cada categoria sobre o orçado total — o "peso já estipulado" usado
  // para ratear o avanço lançado na aba Fluxo de Caixa em valor financeiro.
  const categorias = categoriasBase.map((c) => ({
    ...c,
    peso: totalOrcadoCategorias > 0 ? round2((c.valorOrcado / totalOrcadoCategorias) * 10000) / 10000 : 0,
  }));

  const liberacaoPCI = computeLiberacaoPCI(state.liberacaoPCI || []);
  const creditoCaixaTotalPCI = round2(sum(liberacaoPCI, (e) => e.valor));

  // Custo do lote já executado (taxas e projetos, financiados pelo CAIXA) — ver
  // definição completa mais abaixo, junto de gastoAcumuladoPLS; extraído aqui
  // primeiro porque "Valor caixa liberado" também depende dele.
  const custoLoteExecutado = Number((state.parametros || {}).custoLoteExecutado) || 0;

  // Liberações reais do CAIXA (medições mensais efetivamente pagas pelo banco,
  // lançadas manualmente conforme o extrato) — substitui o cronograma de
  // etapas como fonte de "quanto já foi liberado", somadas ao valor que o
  // CAIXA já passou para o lote — "Valor caixa liberado" = medições + lote.
  const liberacoesCaixa = [...(state.liberacoesCaixa || [])].sort((a, b) => (a.data || '').localeCompare(b.data || ''));
  // Só medições REALIZADO contam no valor efetivamente liberado (e em tudo que
  // depende dele — % caixa liberada, saldo caixa disponível, saldo de recurso
  // próprio auto) — mesma lógica de "parcela REALIZADO"/"avanço REALIZADO".
  // Entradas sem status (dados antigos) são tratadas como REALIZADO.
  const liberacoesCaixaRealizadas = liberacoesCaixa.filter((l) => l.status !== 'PLANEJADO');
  const caixaLiberadaAcumulada = round2(custoLoteExecutado + sum(liberacoesCaixaRealizadas, (l) => l.valor));

  const parcelas = (state.parcelas || []).map(computeParcela).sort((a, b) => {
    const da = a.vencimento || a.vencPlanejado || '';
    const db_ = b.vencimento || b.vencPlanejado || '';
    return da.localeCompare(db_);
  });

  const parcelasRealizadas = parcelas.filter((p) => p.status === 'REALIZADO');
  const totalEmpreiteiroPago = round2(sum(parcelasRealizadas, (p) => p.totalEmpreiteiroPix));
  const totalAdmPago = round2(sum(parcelasRealizadas, (p) => p.totalAdmPix));
  const totalCartaoPago = round2(sum(parcelasRealizadas, (p) => p.gastoCartao));
  const totalEvolucaoCaixaPago = round2(sum(parcelasRealizadas, (p) => p.parcelaEvolucaoCaixa));
  const totalPagoDiretoProprietario = round2(sum(categoriasBase.filter((c) => c.pagoDiretoProprietario), (c) => c.valorRealizadoItens));
  // "GASTO PLS + Provisão da Quizena" — mesma métrica da aba Contas a Pagar da
  // planilha original (célula C6 = 356168 + soma do "Custo Total" de cada
  // parcela já realizada, respeitando overrides já ajustados manualmente).
  const gastoAcumuladoPLS = round2(custoLoteExecutado + sum(parcelasRealizadas, (p) => p.custoTotal));
  const totalGastoAcumulado = round2(gastoAcumuladoPLS + totalPagoDiretoProprietario);
  const parcelasPlanejadas = parcelas.filter((p) => p.status !== 'REALIZADO');
  const totalEmpreiteiroPlanejado = round2(sum(parcelasPlanejadas, (p) => p.totalEmpreiteiroPix));
  const totalPlanejadoFuturo = round2(sum(parcelasPlanejadas, (p) => p.custoTotal));

  const parametros = state.parametros || {};
  const contratoTotalEmpreiteiro = Number(parametros.contratoTotalEmpreiteiro) || totalOrcadoCategorias;
  const recursoProprioPlanejado = Number(parametros.recursoProprioPlanejado) || 0;

  /* Viabilidade do empreendimento.
     -----------------------------------------------------------------------
     Investimento total = tudo que entra na obra, venha do banco ou do bolso
     do proprietário. A margem é o VGV menos esse investimento, e o retorno
     sobre capital próprio (ROI) mede essa margem contra o dinheiro que o
     proprietário efetivamente colocou — que é a conta que importa para quem
     incorpora, já que o resto é financiado.
     Atenção: não desconta juros do financiamento nem impostos de venda. */
  const vgv = Number(parametros.vgv) || 0;
  /* Custo total da operação: tudo que a obra consome, venha do banco ou do
     bolso. Juros da evolução, tarifas e demais custos financeiros entram
     aqui — enquanto estiverem zerados, o retorno mostrado ainda não é o
     final, e a tela avisa isso. */
  const custosFinanceiros = Number(parametros.custosFinanceiros) || 0;
  const investimentoTotal = round2(creditoCaixaTotalPCI + recursoProprioPlanejado + custosFinanceiros);
  const margemBruta = round2(vgv - investimentoTotal);
  const margemSobreCusto = investimentoTotal > 0 ? margemBruta / investimentoTotal : 0;
  const multiploVgvCusto = investimentoTotal > 0 ? vgv / investimentoTotal : 0;
  const margemSobreVgv = vgv > 0 ? margemBruta / vgv : 0;
  const roiCapitalProprio = recursoProprioPlanejado > 0 ? margemBruta / recursoProprioPlanejado : 0;

  /* Resultado líquido: tira da venda o que não é seu.
     -----------------------------------------------------------------------
     Corretagem incide sobre o VGV (é percentual do valor de venda). O IR
     incide sobre o GANHO — receita de venda já líquida de corretagem, menos
     o custo total da operação — que é como funciona o ganho de capital.
     As duas alíquotas são editáveis; se o resultado antes do IR for
     negativo, não há imposto a pagar. */
  const corretagemPercent = Number(parametros.corretagemPercent) || 0;
  const irPercent = Number(parametros.irPercent) || 0;
  const corretagemValor = round2(vgv * corretagemPercent);
  const receitaLiquidaVenda = round2(vgv - corretagemValor);
  const lucroAntesIR = round2(receitaLiquidaVenda - investimentoTotal);
  const irValor = round2(Math.max(0, lucroAntesIR) * irPercent);
  const lucroLiquido = round2(lucroAntesIR - irValor);
  const margemLiquidaSobreVgv = vgv > 0 ? lucroLiquido / vgv : 0;
  const margemLiquidaSobreCusto = investimentoTotal > 0 ? lucroLiquido / investimentoTotal : 0;
  const roiLiquidoCapitalProprio = recursoProprioPlanejado > 0 ? lucroLiquido / recursoProprioPlanejado : 0;

  const totalConsumidoContrato = round2(totalEmpreiteiroPago + totalCartaoPago);
  const saldoAPagarEmpreiteiro = round2(totalMedido - totalConsumidoContrato);
  const saldoContratoRestante = round2(contratoTotalEmpreiteiro - totalMedido);
  const totalInvestidoDisponivel = round2(recursoProprioPlanejado + caixaLiberadaAcumulada);
  const saldoRecursoDisponivelAuto = round2(totalInvestidoDisponivel - totalGastoAcumulado);
  // "Saldo de Recurso Disponível" (F6 da planilha original) não é uma fórmula viva:
  // na planilha ela soma só o "Total a Transferir" das primeiras parcelas em que o
  // recurso próprio foi de fato usado (antes de a liberação do CAIXA começar a fluir)
  // — Maio/1ª, Maio/2ª, Junho/1ª — mais a entrada do lote e os serviços preliminares
  // pagos direto. Em vez de travar essa lista, o app deixa o proprietário lançar e
  // editar cada item que consumiu o recurso próprio (consumosRecursoProprio) —
  // o saldo é recalculado automaticamente como planejado menos a soma da lista.
  // Um valor manual único (saldoRecursoDisponivelManual) ainda tem prioridade sobre
  // tudo, para os casos em que nem a lista reflete o saldo real em conta.
  const consumosRecursoProprio = [...(state.consumosRecursoProprio || [])];
  const totalConsumoRecursoProprio = round2(sum(consumosRecursoProprio, (c) => c.valor));
  const saldoRecursoProprioPorItens = round2(recursoProprioPlanejado - totalConsumoRecursoProprio);
  const temOverrideSaldoRecurso = parametros.saldoRecursoDisponivelManual !== null && parametros.saldoRecursoDisponivelManual !== undefined;
  const temItensConsumoRecursoProprio = consumosRecursoProprio.length > 0;
  let saldoRecursoDisponivel;
  let origemSaldoRecurso;
  if (temOverrideSaldoRecurso) {
    saldoRecursoDisponivel = round2(Number(parametros.saldoRecursoDisponivelManual));
    origemSaldoRecurso = 'manual';
  } else if (temItensConsumoRecursoProprio) {
    saldoRecursoDisponivel = saldoRecursoProprioPorItens;
    origemSaldoRecurso = 'itens';
  } else {
    saldoRecursoDisponivel = saldoRecursoDisponivelAuto;
    origemSaldoRecurso = 'auto';
  }

  const sugestaoProximaParcelaEmpreiteiro = Math.max(0, saldoAPagarEmpreiteiro);
  const sugestaoProximaParcelaAdm = round2(sugestaoProximaParcelaEmpreiteiro * (Number(parametros.taxaAdministracaoPercent) || 0));

  const monthsMap = new Map();
  function bucket(monthKey, quinzena) {
    const q = monthKey === 'sem-data' ? null : (quinzena || 1);
    const key = monthKey === 'sem-data' ? 'sem-data' : `${monthKey}-Q${q}`;
    if (!monthsMap.has(key)) {
      monthsMap.set(key, { mes: monthKey, quinzena: q, label: monthQuinzenaLabel(monthKey, q), entradaRecursoProprio: 0, entradaCaixaPCI: 0, entradaAjusteManual: 0, entradaRealizada: 0, entradaPlanejada: 0, saidaEmpreiteiroPix: 0, saidaAdmPix: 0, saidaCartao: 0, saidaAjusteManual: 0, saidaRealizada: 0, saidaPlanejada: 0 });
    }
    return monthsMap.get(key);
  }
  const startMonthKey = monthKeyFromDateStr(state.meta?.dataInicio) || monthKeyFromDateStr(parcelas[0]?.vencimento) || 'sem-data';
  const bInicial = bucket(startMonthKey, 1);
  bInicial.entradaRecursoProprio += recursoProprioPlanejado;
  bInicial.entradaRealizada += recursoProprioPlanejado;
  for (const lib of liberacoesCaixa) {
    const mk = monthKeyFromDateStr(lib.data) || 'sem-data';
    const b = bucket(mk, quinzenaFromDateStr(lib.data) || 1);
    const valorLib = Number(lib.valor) || 0;
    b.entradaCaixaPCI += valorLib;
    if (lib.status === 'PLANEJADO') b.entradaPlanejada += valorLib;
    else b.entradaRealizada += valorLib;
  }
  for (const p of parcelas) {
    const dataOcorrencia = p.vencimento || p.vencPlanejado || null;
    const mk = monthKeyFromDateStr(dataOcorrencia) || 'sem-data';
    const b = bucket(mk, quinzenaFromDateStr(dataOcorrencia));
    const empreiteiro = Number(p.totalEmpreiteiroPix) || 0;
    const adm = Number(p.totalAdmPix) || 0;
    const cartao = Number(p.gastoCartao) || 0;
    b.saidaEmpreiteiroPix += empreiteiro;
    b.saidaAdmPix += adm;
    b.saidaCartao += cartao;
    if (p.status === 'REALIZADO') b.saidaRealizada += empreiteiro + adm + cartao;
    else b.saidaPlanejada += empreiteiro + adm + cartao;
  }
  for (const ajuste of state.fluxoCaixaAjustes || []) {
    const mk = monthKeyFromDateStr(ajuste.data) || 'sem-data';
    const b = bucket(mk, quinzenaFromDateStr(ajuste.data));
    const valorAjuste = Number(ajuste.valor) || 0;
    if (ajuste.tipo === 'entrada') { b.entradaAjusteManual += valorAjuste; b.entradaRealizada += valorAjuste; }
    else { b.saidaAjusteManual += valorAjuste; b.saidaRealizada += valorAjuste; }
  }
  const fluxoCaixaMensal = [...monthsMap.values()].sort((a, b) => {
    if (a.mes === 'sem-data') return 1;
    if (b.mes === 'sem-data') return -1;
    const c = a.mes.localeCompare(b.mes);
    return c !== 0 ? c : (a.quinzena || 0) - (b.quinzena || 0);
  }).map((b) => {
    const entradaTotal = round2(b.entradaRecursoProprio + b.entradaCaixaPCI + b.entradaAjusteManual);
    const saidaTotal = round2(b.saidaEmpreiteiroPix + b.saidaAdmPix + b.saidaCartao + b.saidaAjusteManual);
    return { ...b, entradaRecursoProprio: round2(b.entradaRecursoProprio), entradaCaixaPCI: round2(b.entradaCaixaPCI), entradaAjusteManual: round2(b.entradaAjusteManual), entradaRealizada: round2(b.entradaRealizada), entradaPlanejada: round2(b.entradaPlanejada), entradaTotal, saidaEmpreiteiroPix: round2(b.saidaEmpreiteiroPix), saidaAdmPix: round2(b.saidaAdmPix), saidaCartao: round2(b.saidaCartao), saidaAjusteManual: round2(b.saidaAjusteManual), saidaRealizada: round2(b.saidaRealizada), saidaPlanejada: round2(b.saidaPlanejada), saidaTotal };
  });
  let acumulado = 0;
  for (const m of fluxoCaixaMensal) { acumulado = round2(acumulado + m.entradaTotal - m.saidaTotal); m.saldoAcumuladoMes = acumulado; }

  const saldoCaixaDisponivel = round2(creditoCaixaTotalPCI - caixaLiberadaAcumulada);
  const verbaDisponivelFutura = round2(saldoCaixaDisponivel + saldoRecursoDisponivel);

  // "Saldo em conta": liberações do CAIXA menos custo total pago, contando só
  // a partir de Junho/2ª quinzena (25/06) — antes disso, Maio/1ª, Maio/2ª e
  // Junho/1ª foram cobertas por recurso próprio; a liberação do CAIXA só
  // passou a alimentar essa conta a partir daqui. Usa custoTotal tal como
  // armazenado (respeitando overrides), igual à coluna de Contas a Pagar.
  // Configurável em Parâmetros > Regras de cálculo (marcoSaldoConta); ausente
  // no estado = data original apurada na planilha (25/06/2026).
  const MARCO_SALDO_CONTA = (state.parametros && state.parametros.marcoSaldoConta) || '2026-06-25';
  function saldoContaNoPeriodo(ateData, incluirPlanejado) {
    const entradas = sum(
      liberacoesCaixa.filter((l) => (
        (incluirPlanejado || l.status !== 'PLANEJADO')
        && (l.data || '') >= MARCO_SALDO_CONTA
        && (!ateData || (l.data || '') <= ateData)
      )),
      (l) => l.valor,
    );
    const saidas = sum(
      parcelas.filter((p) => {
        if (!incluirPlanejado && p.status !== 'REALIZADO') return false;
        const dataOcorrencia = p.vencimento || p.vencPlanejado || '';
        return dataOcorrencia >= MARCO_SALDO_CONTA && (!ateData || dataOcorrencia <= ateData);
      }),
      (p) => p.custoTotal,
    );
    return round2(entradas - saidas);
  }
  const saldoContaRealizado = saldoContaNoPeriodo(null, false);

  const resumo = {
    totalOrcadoCategorias, contratoTotalEmpreiteiro, totalMedido,
    percObraGeral: round2(percObraGeral * 10000) / 10000,
    totalPrevistoCronograma,
    percPrevistoGeral: round2(percPrevistoGeral * 10000) / 10000,
    dataReferenciaCronograma: dataRef,
    totalVerbaCaixaCategorias,
    totalCaixaLiberadoCategorias,
    creditoCaixaTotalPCI, caixaLiberadaAcumulada,
    percCaixaLiberada: creditoCaixaTotalPCI > 0 ? round2((caixaLiberadaAcumulada / creditoCaixaTotalPCI) * 10000) / 10000 : 0,
    recursoProprioPlanejado, totalInvestidoDisponivel,
    vgv, investimentoTotal, custosFinanceiros, multiploVgvCusto,
    margemBruta, margemSobreCusto, margemSobreVgv, roiCapitalProprio,
    corretagemPercent, irPercent, corretagemValor, receitaLiquidaVenda,
    lucroAntesIR, irValor, lucroLiquido,
    margemLiquidaSobreVgv, margemLiquidaSobreCusto, roiLiquidoCapitalProprio,
    // % Execução financeira: mesma fórmula da aba "Contas a pagar"!I6 da planilha
    // original (=C6/(1500000+A6)) — usa GASTO PLS + Provisão da Quizena (C6) sobre
    // o total de financiamento disponível (crédito CAIXA total + recurso próprio).
    percExecucaoFinanceira: (creditoCaixaTotalPCI + recursoProprioPlanejado) > 0
      ? round2((gastoAcumuladoPLS / (creditoCaixaTotalPCI + recursoProprioPlanejado)) * 10000) / 10000
      : 0,
    totalEmpreiteiroPago, totalAdmPago, totalCartaoPago, totalEvolucaoCaixaPago, totalPagoDiretoProprietario,
    gastoAcumuladoPLS, totalGastoAcumulado, totalEmpreiteiroPlanejado,
    // "Crédito CAIXA disponível" (H6 da planilha) = crédito CAIXA total − gasto PLS.
    creditoCaixaDisponivelContabil: round2(creditoCaixaTotalPCI - gastoAcumuladoPLS),
    totalPlanejadoFuturo,
    saldoAPagarEmpreiteiro, saldoContratoRestante, saldoRecursoDisponivel,
    saldoRecursoDisponivelAuto,
    totalConsumoRecursoProprio,
    saldoRecursoProprioPorItens,
    origemSaldoRecurso,
    saldoCaixaDisponivel,
    totalConsumidoContrato,
    saldoContratoAPagarEmpreiteiro: round2(contratoTotalEmpreiteiro - totalConsumidoContrato),
    percValorTotalPago: contratoTotalEmpreiteiro > 0 ? round2((totalConsumidoContrato / contratoTotalEmpreiteiro) * 10000) / 10000 : 0,
    sugestaoProximaParcelaEmpreiteiro: round2(sugestaoProximaParcelaEmpreiteiro),
    sugestaoProximaParcelaAdm: round2(sugestaoProximaParcelaAdm),
    verbaDisponivelFutura,
    saldoParaFuturos: round2(verbaDisponivelFutura - totalPlanejadoFuturo),
    marcoSaldoConta: MARCO_SALDO_CONTA,
    saldoContaRealizado,
    tetoAvancoEfetivo,
  };

  return { meta: state.meta, parametros: state.parametros, categorias, liberacaoPCI, liberacoesCaixa, consumosRecursoProprio, parcelas, fluxoCaixaMensal, fluxoCaixaAjustes: state.fluxoCaixaAjustes || [], historicoAvancos: state.historicoAvancos || [], resumo, updatedAt: state.updatedAt };
}

/**
 * Reorganiza as parcelas PLANEJADAS para que o total (já realizado + ainda
 * planejado) do empreiteiro nunca ultrapasse o orçado do contrato
 * (parametros.contratoTotalEmpreiteiro). Só encolhe (nunca infla de volta)
 * e só mexe em totalEmpreiteiroPix/totalAdmPix — o cartão fica intocado.
 * Retorna um resumo do ajuste, ou `null` se nada precisou mudar. Muta
 * `state.parcelas` diretamente.
 */
function reorganizarPlanejamento(state, dataAjuste) {
  const parametros = state.parametros || {};
  const contratoTotalEmpreiteiro = Number(parametros.contratoTotalEmpreiteiro) || 0;
  if (!contratoTotalEmpreiteiro) return null;

  const parcelas = state.parcelas || [];
  const realizadas = parcelas.filter((p) => p.status === 'REALIZADO');
  const totalConsumidoRealizado = round2(sum(realizadas, (p) => (Number(p.totalEmpreiteiroPix) || 0) + (Number(p.gastoCartao) || 0)));
  const tetoRestante = Math.max(0, round2(contratoTotalEmpreiteiro - totalConsumidoRealizado));

  const planejadas = parcelas.filter((p) => p.status !== 'REALIZADO');
  const somaCartaoPlanejado = round2(sum(planejadas, (p) => p.gastoCartao));
  const tetoParaPix = Math.max(0, round2(tetoRestante - somaCartaoPlanejado));
  const somaPixPlanejado = round2(sum(planejadas, (p) => p.totalEmpreiteiroPix));

  if (somaPixPlanejado <= 0 || somaPixPlanejado <= tetoParaPix) return null;

  const fator = tetoParaPix / somaPixPlanejado;
  const taxaAdm = Number(parametros.taxaAdministracaoPercent) || 0;
  const data = dataAjuste || new Date().toISOString().slice(0, 10);
  const nota = `[Ajustado automaticamente em ${data} para caber no orçado restante do contrato]`;
  for (const p of planejadas) {
    p.totalEmpreiteiroPix = round2((Number(p.totalEmpreiteiroPix) || 0) * fator);
    p.totalAdmPix = round2((p.totalEmpreiteiroPix + (Number(p.gastoCartao) || 0)) * taxaAdm);
    if (p.overrides) { p.overrides.totalATransferir = false; p.overrides.custoTotal = false; }
    if (!p.obs || !p.obs.includes('[Ajustado automaticamente')) {
      p.obs = p.obs ? `${p.obs} ${nota}` : nota;
    }
  }
  return { fator: round2(fator * 10000) / 10000, tetoPlanejado: tetoParaPix, somaPlanejadoAnterior: somaPixPlanejado, qtd: planejadas.length };
}

</script>

<script>
'use strict';
/* Template bruto da página, capturado aqui — no início do ÚLTIMO <script> do
   documento — porque só neste ponto o parser já leu (e o DOM já contém) TODOS
   os blocos de script anteriores por inteiro; capturar mais cedo perderia o
   conteúdo dos scripts ainda não parseados. É a "fonte canônica" usada para
   publicar novas versões: nunca serializamos o DOM já renderizado, só
   trocamos o bloco de estado dentro deste template. */
const RAW_SHELL_HTML = document.documentElement.outerHTML;

function buildFullDocument(state) {
  const json = JSON.stringify(state).replace(/</g, '\\u003c');
  const newTag = `<script id="state-data" type="application/json">${json}<\/script>`;
  const html = RAW_SHELL_HTML.replace(/<script id="state-data" type="application\/json">[\s\S]*?<\/script>/, newTag);
  return '<!doctype html>\n' + html;
}

// Baixa uma cópia local do app inteiro (mesmo arquivo autocontido, com os
// dados atuais embutidos) — usa a capability "downloads" da plataforma, já
// que o Artifact roda num iframe sandbox onde um link <a download> comum não
// funciona (mesma limitação que afetava os botões de excluir).
async function exportarCopiaHtml() {
  const ns = (window.claude && typeof window.claude.use === 'function')
    ? await window.claude.use('downloads').catch(() => null)
    : null;
  if (!ns) { toast('Salvar arquivo não está disponível aqui.', true); return; }
  const filename = `liberacao-caixa-toscana-${new Date().toISOString().slice(0, 10)}.html`;
  try {
    await ns.save({ filename, data: buildFullDocument(STATE) });
    toast('Cópia salva.');
  } catch (e) {
    if (e && e.code === 'declined') return;
    toast('Não foi possível salvar a cópia agora.', true);
  }
}

/* ==========================================================================
   Ícone e instalação como app no celular / tablet
   --------------------------------------------------------------------------
   O ícone é desenhado aqui mesmo, no canvas — telhado da obra sobre barras
   de avanço — para não depender de nenhum arquivo externo (o app é um HTML
   só). A partir dele montamos o apple-touch-icon (iPhone), o favicon e um
   manifest em blob (Android), de modo que "Adicionar à tela de início"
   pegue o nome e o ícone certos e o painel abra em tela cheia.
   ========================================================================== */
const APP_NOME = 'Liberação Caixa — Casa Newton';
const APP_NOME_CURTO = 'Obra Toscana';

function desenharIconeApp(size = 512) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const x = c.getContext('2d');
  const u = size / 512;
  const rr = (px, py, w, h, r) => {
    x.beginPath();
    if (x.roundRect) x.roundRect(px, py, w, h, r);
    else { x.moveTo(px + r, py); x.arcTo(px + w, py, px + w, py + h, r); x.arcTo(px + w, py + h, px, py + h, r); x.arcTo(px, py + h, px, py, r); x.arcTo(px, py, px + w, py, r); }
    x.closePath();
  };

  const fundo = x.createLinearGradient(0, 0, size, size);
  fundo.addColorStop(0, '#1b3a5c');
  fundo.addColorStop(1, '#08131f');
  rr(0, 0, size, size, 112 * u); x.fillStyle = fundo; x.fill();

  // Telhado
  x.beginPath();
  x.moveTo(64 * u, 236 * u);
  x.lineTo(256 * u, 92 * u);
  x.lineTo(448 * u, 236 * u);
  x.lineTo(392 * u, 236 * u);
  x.lineTo(256 * u, 134 * u);
  x.lineTo(120 * u, 236 * u);
  x.closePath();
  x.fillStyle = '#e08a3c'; x.fill();

  // Barras de avanço
  const base = 420 * u;
  const barras = [[128, 64, 84], [224, 64, 130], [320, 64, 176]];
  x.fillStyle = '#eef3fa';
  for (const [bx, bw, bh] of barras) rr(bx * u, base - bh * u, bw * u, bh * u, 10 * u), x.fill();

  // Linha de base
  rr(104 * u, base + 8 * u, 304 * u, 14 * u, 7 * u);
  x.fillStyle = '#c76b1c'; x.fill();

  return c;
}

function iconeAppDataUrl(size) {
  try { return desenharIconeApp(size).toDataURL('image/png'); } catch (e) { return ''; }
}

let PROMPT_INSTALACAO = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  PROMPT_INSTALACAO = e;
  const btn = document.getElementById('btnInstalarApp');
  if (btn) btn.hidden = false;
});

function prepararInstalacaoApp() {
  try {
    const i192 = iconeAppDataUrl(192);
    const i512 = iconeAppDataUrl(512);
    if (!i192) return;
    const add = (tag, attrs) => {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      document.head.appendChild(el);
    };
    add('link', { rel: 'apple-touch-icon', href: i192 });
    add('link', { rel: 'icon', type: 'image/png', href: i192 });
    add('meta', { name: 'theme-color', content: '#0f2137' });
    add('meta', { name: 'mobile-web-app-capable', content: 'yes' });
    add('meta', { name: 'apple-mobile-web-app-capable', content: 'yes' });
    add('meta', { name: 'apple-mobile-web-app-title', content: APP_NOME_CURTO });
    const manifest = {
      name: APP_NOME,
      short_name: APP_NOME_CURTO,
      start_url: location.href,
      display: 'standalone',
      orientation: 'any',
      background_color: '#eef1f6',
      theme_color: '#0f2137',
      icons: [
        { src: i192, sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: i512, sizes: '512x512', type: 'image/png', purpose: 'maskable' },
      ],
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
    add('link', { rel: 'manifest', href: url });
  } catch (e) { /* sem ícone é degradação aceitável */ }
}

async function baixarIconeApp() {
  const ns = (window.claude && typeof window.claude.use === 'function')
    ? await window.claude.use('downloads').catch(() => null)
    : null;
  if (!ns) { toast('Salvar arquivo não está disponível aqui.', true); return; }
  const canvas = desenharIconeApp(512);
  const blob = await new Promise((res) => canvas.toBlob(res, 'image/png'));
  if (!blob) { toast('Não foi possível gerar o ícone.', true); return; }
  try {
    await ns.save({ filename: 'icone-obra-toscana-512.png', data: blob });
    toast('Ícone salvo.');
  } catch (e) {
    if (e && e.code === 'declined') return;
    toast('Não foi possível salvar o ícone agora.', true);
  }
}
