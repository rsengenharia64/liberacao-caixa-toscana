  });
  let ajusteOcorreu = false;
  if ((patch.status || 'PLANEJADO') === 'REALIZADO') {
    ajusteOcorreu = toastAjuste(reorganizarPlanejamento(STATE));
  }
  afterMutation();
  return ajusteOcorreu;
}

function updateParcela(id, patch) {
  const p = STATE.parcelas.find((x) => x.id === id); if (!p) return false;
  const fields = ['label', 'totalEmpreiteiroPix', 'totalAdmPix', 'gastoCartao', 'parcelaEvolucaoCaixa', 'dataGeracaoCusto', 'vencimento', 'vencPlanejado', 'status', 'obs'];
  for (const f of fields) if (patch[f] !== undefined) p[f] = patch[f];
  if (patch.totalATransferir !== undefined) { p.totalATransferir = Number(patch.totalATransferir); p.overrides.totalATransferir = true; }
  if (patch.custoTotal !== undefined) { p.custoTotal = Number(patch.custoTotal); p.overrides.custoTotal = true; }
  // Digitar na ADM assume o controle daquela célula; qualquer mexida na base
  // (PIX, cartão, evolução) devolve a ADM ao cálculo automático.
  if (patch.totalAdmPix !== undefined) { p.overrides.totalAdmPix = true; }
  if (patch.totalEmpreiteiroPix !== undefined || patch.gastoCartao !== undefined || patch.parcelaEvolucaoCaixa !== undefined) {
    recalcularCustoParcela(p);
  }
  let ajusteOcorreu = false;
  if (p.status === 'REALIZADO' && (patch.status !== undefined || patch.totalEmpreiteiroPix !== undefined)) {
    ajusteOcorreu = toastAjuste(reorganizarPlanejamento(STATE));
  }
  afterMutation();
  return ajusteOcorreu;
}

function deleteParcela(id) { STATE.parcelas = STATE.parcelas.filter((p) => p.id !== id); afterMutation(); }

// Data "de calendário" de uma quinzena (mês/1ª ou 2ª parcela): dia 10 para a
// 1ª, dia 25 para a 2ª — bate com os vencimentos reais extraídos da planilha.
function dataQuinzena(mes, quinzena) { return `${mes}-${quinzena === 2 ? '25' : '10'}`; }

// Soma o gasto no cartão já lançado no Detalhamento FC para a fatura de um mês
// específico (formaPagamento com "CARTÃO — fatura YYYY-MM") — sugestão automática
// ao lançar o avanço de uma quinzena.
/* Cartão da quinzena, buscado no Detalhamento FC.
   -------------------------------------------------------------------------
   Antes só contava item criado por "compra parcelada", que carrega a fatura
   no nome ("CARTÃO — fatura YYYY-MM"). Item lançado à mão como CARTÃO, com
   data de pagamento, ficava de fora — e o avanço saía sem descontar o
   cartão. Agora vale qualquer item de cartão: a fatura escrita no nome tem
   prioridade e, na falta dela, usa-se o mês da data de pagamento.
   Cartão é sempre cobrado na 1ª quinzena, então a 2ª nunca traz cartão. */
function sugestaoCartaoDoMes(mes, quinzena = 1) {
  if (Number(quinzena) === 2) return 0;
  let total = 0;
  for (const cat of STATE.categorias) {
    for (const it of cat.itens || []) {
      if (!ehCartao(it.formaPagamento)) continue;
      if (mesFaturaDoItem(it) === mes) total += Number(it.valorRealizado) || 0;
    }
  }
  return round2(total);
}

// Detalhe do cartão da quinzena — para mostrar de onde veio cada real.
function itensCartaoDoMes(mes, quinzena = 1) {
  if (Number(quinzena) === 2) return [];
  const out = [];
  for (const cat of STATE.categorias) {
    for (const it of cat.itens || []) {
      if (!ehCartao(it.formaPagamento)) continue;
      if (mesFaturaDoItem(it) === mes) out.push({ categoria: cat.nome, descricao: it.descricao, valor: Number(it.valorRealizado) || 0 });
    }
  }
  return out;
}

// Lançamento de avanço por quinzena (aba "Lançar Avanços"): 2 lançamentos por
// mês (1ª e 2ª parcela), cada um define o % acumulado de cada categoria que
// avançou naquela quinzena e gera automaticamente a parcela correspondente em
// Contas a Pagar. Cartão nunca é cobrado na 2ª quinzena (sempre pago na 1ª).
function lancamentoQuinzena(b) {
  const avancos = Array.isArray(b.avancos) ? b.avancos : [];
  if (!avancos.length) { toast('Informe o novo % de ao menos uma categoria.', true); return { ok: false }; }
  if (!/^\d{4}-\d{2}$/.test(b.mes || '')) { toast('Informe o mês (YYYY-MM).', true); return { ok: false }; }
  const quinzena = Number(b.quinzena) === 2 ? 2 : 1;
  const mes = b.mes;
  const vencPlanejado = dataQuinzena(mes, quinzena);

  let valorGeradoPeriodo = 0;
  const detalhes = [];

  for (const a of avancos) {
    const cat = STATE.categorias.find((c) => c.id === a.categoriaId);
    const novoPerc = Number(a.novoPerc);
    if (!cat || !Number.isFinite(novoPerc)) continue;
    const percAnteriorEfetivo = computeCategoria(cat).percAvancoEfetivo;
    if (Math.abs(novoPerc - percAnteriorEfetivo) < 0.0001) continue;

    const valorOrcado = Number(cat.valorOrcado) || 0;
    valorGeradoPeriodo += valorOrcado * (novoPerc - percAnteriorEfetivo);

    const percAvancoManualAnterior = cat.percAvancoManual;
    const statusAvanco = b.status === 'REALIZADO' ? 'REALIZADO' : 'PLANEJADO';
    // O avanço pertence à quinzena selecionada (vencPlanejado) — não à "data em
    // que o custo foi gerado" (dataGeracaoCusto), que é só um detalhe da parcela
    // de Contas a Pagar e por padrão vem preenchida com a data de hoje. Usar
    // dataGeracaoCusto aqui fazia o avanço "sumir" do filtro por quinzena sempre
    // que o usuário lançava um período retroativo sem trocar essa data.
    STATE.historicoAvancos.unshift({
      id: newId('avanco'), categoriaId: cat.id, categoriaNome: cat.nome,
      percAvancoAnterior: percAvancoManualAnterior, percAvancoNovo: novoPerc,
      data: vencPlanejado, status: statusAvanco, obs: b.obs || '', timestamp: new Date().toISOString(),
    });
    // Um avanço lançado como PLANEJADO fica registrado, mas só passa a
    // contar no % efetivo da categoria (e em tudo que depende dele) quando
    // confirmado como REALIZADO — ver recomputeCategoriaPercManual.
    if (statusAvanco === 'REALIZADO') cat.dataUltimoAvanco = vencPlanejado;
    recomputeCategoriaPercManual(cat, STATE.historicoAvancos);
    detalhes.push(`${cat.nome}: ${(percAnteriorEfetivo * 100).toFixed(1)}% → ${(novoPerc * 100).toFixed(1)}%`);
  }

  if (!detalhes.length) { toast('Nenhuma categoria teve o % alterado.', true); return { ok: false }; }

  valorGeradoPeriodo = round2(valorGeradoPeriodo);
  // Cartão sempre pago na 1ª quinzena — na 2ª, o gasto do cartão é sempre zero.
  const gastoCartao = quinzena === 2 ? 0 : round2(Number(b.gastoCartao) || 0);
  const taxaAdm = Number(STATE.parametros.taxaAdministracaoPercent) || 0;
  const totalEmpreiteiroPixGerado = round2(Math.max(0, valorGeradoPeriodo - gastoCartao));
  const obsAuto = `Avanço da quinzena (valor gerado: R$ ${valorGeradoPeriodo.toFixed(2)}) — ${detalhes.join('; ')}`;
  const label = monthQuinzenaLabel(mes, quinzena);
  const novoStatus = b.status || 'PLANEJADO';
  const novaObs = b.obs ? `${b.obs} — ${obsAuto}` : obsAuto;

  // Um segundo lançamento para o mesmo mês/quinzena (ex.: mais categorias
  // avançaram depois) atualiza a parcela já existente em vez de criar uma
  // duplicada: soma o PIX gerado por este lote de categorias e substitui o
  // cartão pelo valor atual (a sugestão automática já é o total da fatura da
  // quinzena, não um incremento). ADM/total a transferir/custo total são
  // recalculados ao vivo em recompute() a partir desses campos — exceto
  // quando há override manual, que é sempre preservado. Nunca funde numa
  // parcela já REALIZADO — nesse caso cria uma nova, como antes.
  let parcela = STATE.parcelas.find((p) => p.vencPlanejado === vencPlanejado && p.status !== 'REALIZADO');
  if (parcela) {
    parcela.totalEmpreiteiroPix = round2((Number(parcela.totalEmpreiteiroPix) || 0) + totalEmpreiteiroPixGerado);
    parcela.gastoCartao = gastoCartao;
    parcela.totalAdmPix = round2((parcela.totalEmpreiteiroPix + parcela.gastoCartao) * taxaAdm);
    parcela.status = novoStatus === 'REALIZADO' ? 'REALIZADO' : parcela.status;
    parcela.vencimento = parcela.status === 'REALIZADO' ? (b.vencimento || parcela.vencimento || vencPlanejado) : parcela.vencimento;
    parcela.obs = parcela.obs ? `${parcela.obs}\n${novaObs}` : novaObs;
  } else {
    const totalAdmPixGerado = round2((totalEmpreiteiroPixGerado + gastoCartao) * taxaAdm);
    parcela = {
      id: newId('parcela'), label,
      totalEmpreiteiroPix: totalEmpreiteiroPixGerado, totalAdmPix: totalAdmPixGerado, gastoCartao,
      totalATransferir: round2(totalEmpreiteiroPixGerado + totalAdmPixGerado),
      parcelaEvolucaoCaixa: 0,
      custoTotal: round2(totalEmpreiteiroPixGerado + totalAdmPixGerado + gastoCartao),
      dataGeracaoCusto: b.dataGeracaoCusto || vencPlanejado,
      vencimento: novoStatus === 'REALIZADO' ? (b.vencimento || vencPlanejado) : null,
      vencPlanejado,
      status: novoStatus,
      obs: novaObs,
      overrides: {},
    };
    STATE.parcelas.push(parcela);
  }
  let ajusteOcorreu = false;
  if (parcela.status === 'REALIZADO') {
    ajusteOcorreu = toastAjuste(reorganizarPlanejamento(STATE));
  }
  afterMutation();
  return { ok: true, ajusteOcorreu, label };
}

function addAjuste(patch) {
  STATE.fluxoCaixaAjustes.push({
    id: newId('ajuste'), data: patch.data || new Date().toISOString().slice(0, 10),
    tipo: patch.tipo === 'entrada' ? 'entrada' : 'saida', valor: Number(patch.valor) || 0, descricao: patch.descricao || '',
  });
  afterMutation();
}
function deleteAjuste(id) { STATE.fluxoCaixaAjustes = STATE.fluxoCaixaAjustes.filter((a) => a.id !== id); afterMutation(); }

// Cria (ou atualiza, se `parcelaExistente` for passada) a parcela de Contas a
// Pagar ligada a um avanço individual lançado em "Histórico de avanços" — o
// mesmo cálculo de "valor gerado" que "Lançar avanço da quinzena" já faz para
// vários avanços de uma vez (valorOrcado × delta de %), aqui para um avanço
// só. Sem isso, um avanço lançado/editado fora do painel de quinzena nunca
// aparecia em Contas a Pagar nem no Fluxo de Caixa — só mudava o % da
// categoria. Retorna a parcela (nova ou atualizada), ou `null` se o delta for
// zero (nada a gerar/atualizar). Fica de fora o efeito do "Detalhamento FC"
// (cartão) — não há campo de cartão no formulário de avanço.
function gerarOuAtualizarParcelaAvanco({ categoriaNome, valorOrcado, percAnterior, percNovo, status, data }, parcelaExistente) {
  const valorGerado = round2((Number(valorOrcado) || 0) * ((Number(percNovo) || 0) - (Number(percAnterior) || 0)));
  if (!valorGerado) {
    if (parcelaExistente) STATE.parcelas = STATE.parcelas.filter((p) => p !== parcelaExistente);
    return null;
  }
  const mes = monthKeyFromDateStr(data);
  const quinzena = quinzenaFromDateStr(data) || 1;
  const taxaAdm = Number(STATE.parametros.taxaAdministracaoPercent) || 0;
  const totalEmpreiteiroPix = valorGerado;
  const totalAdmPix = round2(valorGerado * taxaAdm);
  const custoTotal = round2(totalEmpreiteiroPix + totalAdmPix);
  const vencPlanejado = mes ? dataQuinzena(mes, quinzena) : data;
  const label = `${monthQuinzenaLabel(mes, quinzena)} — ${categoriaNome} (avanço)`;
  const obsAuto = `Avanço automático de ${categoriaNome}: ${((Number(percAnterior) || 0) * 100).toFixed(1)}% → ${((Number(percNovo) || 0) * 100).toFixed(1)}% (valor gerado: R$ ${valorGerado.toFixed(2)})`;
  const parcela = parcelaExistente || { id: newId('parcela'), overrides: {} };
  Object.assign(parcela, {
    label, totalEmpreiteiroPix, totalAdmPix, gastoCartao: 0,
    totalATransferir: custoTotal, parcelaEvolucaoCaixa: 0, custoTotal,
    dataGeracaoCusto: data, vencimento: status === 'REALIZADO' ? data : null,
    vencPlanejado, status, obs: obsAuto,
  });
  if (!parcelaExistente) STATE.parcelas.push(parcela);
  return parcela;
}

// ---- Histórico de avanços (aba Lançar Avanços — tabela única editável, com
// filtro por quinzena e status Planejado/Realizado). Só os avanços REALIZADO
// contam no % de avanço efetivo da categoria — ver recomputeCategoriaPercManual. ----
function addHistoricoAvanco(b) {
  const cat = STATE.categorias.find((c) => c.id === b.categoriaId);
  if (!cat) { toast('categoria não encontrada', true); return; }
  const novoPerc = Number(b.percAvancoNovo);
  if (!Number.isFinite(novoPerc)) { toast('percAvancoNovo é obrigatório', true); return; }
  const status = b.status === 'PLANEJADO' ? 'PLANEJADO' : 'REALIZADO';
  const data = b.data || new Date().toISOString().slice(0, 10);
  const percAvancoAnterior = computeCategoria(cat).percAvancoEfetivo;
  const entry = {
    id: newId('avanco'),
    categoriaId: cat.id,
    categoriaNome: cat.nome,
    percAvancoAnterior,
    percAvancoNovo: novoPerc,
    data,
    status,
    obs: b.obs || '',
    timestamp: new Date().toISOString(),
    parcelaId: null,
  };
  const parcela = gerarOuAtualizarParcelaAvanco({
    categoriaNome: cat.nome, valorOrcado: cat.valorOrcado, percAnterior: percAvancoAnterior, percNovo: novoPerc, status, data,
  });
  if (parcela) entry.parcelaId = parcela.id;
  STATE.historicoAvancos = STATE.historicoAvancos || [];
  STATE.historicoAvancos.unshift(entry);
  if (status === 'REALIZADO') cat.dataUltimoAvanco = data;
  recomputeCategoriaPercManual(cat, STATE.historicoAvancos);
  // Mesma regra de "Contas a Pagar": uma parcela nova marcada REALIZADO
  // reorganiza as planejadas restantes para caber no orçado do contrato.
  if (parcela && parcela.status === 'REALIZADO') toastAjuste(reorganizarPlanejamento(STATE));
  afterMutation();
}

function updateHistoricoAvanco(id, patch) {
  const h = (STATE.historicoAvancos || []).find((x) => x.id === id);
  if (!h) return;
  if (patch.percAvancoNovo !== undefined) h.percAvancoNovo = Number(patch.percAvancoNovo);
  if (patch.data !== undefined) h.data = patch.data;
  if (patch.status !== undefined) h.status = patch.status === 'PLANEJADO' ? 'PLANEJADO' : 'REALIZADO';
  if (patch.obs !== undefined) h.obs = patch.obs;
  const cat = STATE.categorias.find((c) => c.id === h.categoriaId);
  if (cat) {
    if (h.status === 'REALIZADO') cat.dataUltimoAvanco = h.data;
    recomputeCategoriaPercManual(cat, STATE.historicoAvancos);
    // Só sincroniza parcela dedicada se este avanço já nasceu vinculado a
    // uma (chave `parcelaId` presente — criado via "+ Novo avanço" depois
    // que essa funcionalidade passou a existir). Avanços antigos (lançados
    // em lote pelo painel de quinzena, ou do backfill inicial da planilha)
    // nunca tiveram parcela própria — o valor deles já está contabilizado
    // em outro lugar (uma parcela combinada de várias categorias, ou nem
    // chegou a entrar em Contas a Pagar). Gerar uma parcela agora para eles
    // duplicaria o valor inteiro do avanço (não só o incremento da edição).
    if ('parcelaId' in h) {
      const parcelaExistente = h.parcelaId ? STATE.parcelas.find((p) => p.id === h.parcelaId) : undefined;
      const parcela = gerarOuAtualizarParcelaAvanco({
        categoriaNome: cat.nome, valorOrcado: cat.valorOrcado, percAnterior: h.percAvancoAnterior, percNovo: h.percAvancoNovo, status: h.status, data: h.data,
      }, parcelaExistente);
      h.parcelaId = parcela ? parcela.id : null;
      if (parcela && parcela.status === 'REALIZADO') toastAjuste(reorganizarPlanejamento(STATE));
    }
  }
  afterMutation();
}

function deleteHistoricoAvanco(id) {
  const h = (STATE.historicoAvancos || []).find((x) => x.id === id);
  STATE.historicoAvancos = (STATE.historicoAvancos || []).filter((x) => x.id !== id);
  if (h) {
    if (h.parcelaId) STATE.parcelas = STATE.parcelas.filter((p) => p.id !== h.parcelaId);
    const cat = STATE.categorias.find((c) => c.id === h.categoriaId);
    if (cat) recomputeCategoriaPercManual(cat, STATE.historicoAvancos);
  }
  afterMutation();
}

function resetToSeed() {
  const fresh = JSON.parse(JSON.stringify(ORIGINAL_SEED));
  Object.keys(STATE).forEach((k) => delete STATE[k]);
  Object.assign(STATE, fresh);
  afterMutation();
}

/* ==========================================================================
   Helpers de célula editável
   ========================================================================== */
function numberInput({ value, onSave, manual = false, step = '0.01', wide = false, min }) {
  const input = document.createElement('input');
  input.type = 'number';
  input.step = step;
  if (min !== undefined) input.min = min;
  input.value = value ?? 0;
  input.className = `cell-input${manual ? ' manual' : ''}${wide ? ' wide' : ''}`;
  const commit = () => { const v = input.value === '' ? 0 : Number(input.value); if (v !== value) onSave(v); };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
  return input;
}

// input de valor monetário: exibe formatado ("R$ 31.000,00") em repouso; ao
// focar, troca para edição em número simples com vírgula decimal (mais fácil
// de digitar), reformatando ao sair do campo.
function moneyInput({ value, onSave, manual = false, wide = false, readOnly = false, titulo = '' }) {
  const input = document.createElement('input');
  input.type = 'text';
  input.inputMode = 'decimal';
  input.className = `cell-input${manual ? ' manual' : ''}${wide ? ' wide' : ''}${readOnly ? ' derivado' : ''}`;
  input.value = money(value);
  if (titulo) input.title = titulo;
  if (readOnly) {
    input.readOnly = true;
    input.tabIndex = -1;
    return input;
  }
  function parseMoneyText(s) {
    let cleaned = String(s).trim().replace(/^R\$\s*/i, '');
    if (!cleaned) return 0;
    // Uma vírgula seguida só de dígitos até o fim é sempre o separador decimal
    // (o BRL nunca usa vírgula como separador de milhar) — não travar em 1-2
    // dígitos: um valor com mais casas decimais (ex.: 24917,0755, vindo de
    // dados importados da planilha) sem essa correção tinha a vírgula tratada
    // como separador de milhar e removida, multiplicando o valor por 100/1000/etc.
    if (/,\d+$/.test(cleaned)) cleaned = cleaned.replace(/\./g, '').replace(',', '.');
    else cleaned = cleaned.replace(/,/g, '');
    const n = Number(cleaned);
    return Number.isFinite(n) ? n : 0;
  }
  input.addEventListener('focus', () => {
    const rounded = Math.round((Number(value) || 0) * 100) / 100;
    input.value = rounded === 0 ? '' : String(rounded).replace('.', ',');
    input.select();
  });
  const commit = () => {
    const v = parseMoneyText(input.value);
    input.value = money(v);
    if (v !== value) onSave(v);
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
  return input;
}

// Descrição curta da origem do "Saldo de recurso próprio disponível" — usada
// nos cards do Dashboard/Painel; 'itens' = calculado pela lista itemizada em
// Parâmetros, 'manual' = valor único forçado (avançado), 'auto' = cálculo
// simples de fallback (nenhuma lista lançada e nenhum manual).
/* Recorte por data no consumo de recurso próprio.
   -------------------------------------------------------------------------
   Cada item de consumo guarda a data em que o dinheiro próprio saiu. Com
   isso dá para perguntar "quanto de recurso próprio já tinha sido gasto até
   tal dia, e quanto sobrava naquela data". É uma LEITURA — o saldo oficial
   do app continua sendo o total de todos os itens, sem filtro, para que
   nenhum outro número da tela mude por causa desse recorte. */
let FILTRO_CONSUMO_RP_ATE = null;

function ordenarConsumos(a, b) {
  return (a.data || '9999-12-31').localeCompare(b.data || '9999-12-31');
}

function recorteConsumoRP(ate) {
  const itens = VIEW.consumosRecursoProprio || [];
  const planejado = Number(VIEW.resumo.recursoProprioPlanejado) || 0;
  if (!ate) {
    return {
      ate: null, itens, planejado, semData: 0,
      total: Number(VIEW.resumo.totalConsumoRecursoProprio) || 0,
      saldo: Number(VIEW.resumo.saldoRecursoProprioPorItens) || 0,
    };
  }
  const dentro = itens.filter((c) => c.data && c.data <= ate);
  const semData = itens.filter((c) => !c.data).length;
  const total = round2(dentro.reduce((a, c) => a + (Number(c.valor) || 0), 0));
  return { ate, itens: dentro, planejado, semData, total, saldo: round2(planejado - total) };
}

// Seletor "Contar até", reaproveitado pelo painel de Parâmetros e pelo extrato.
function renderFiltroConsumoAte(rerender) {
  const wrap = document.createElement('div');
  wrap.className = 'consumo-filtro';

  const label = document.createElement('label');
  label.textContent = 'Contar até';
  const input = document.createElement('input');
  input.type = 'date';
  input.className = 'cell-input filter-control';
  input.value = FILTRO_CONSUMO_RP_ATE || '';
  input.addEventListener('change', () => { FILTRO_CONSUMO_RP_ATE = input.value || null; rerender(); });
  label.appendChild(input);
  wrap.appendChild(label);

  const limpar = document.createElement('button');
  limpar.type = 'button';
  limpar.className = 'btn small filter-control';
  limpar.textContent = 'Todo o período';
  limpar.hidden = !FILTRO_CONSUMO_RP_ATE;
  limpar.onclick = () => { FILTRO_CONSUMO_RP_ATE = null; rerender(); };
  wrap.appendChild(limpar);

  const leitura = document.createElement('div');
  if (FILTRO_CONSUMO_RP_ATE) {
    const rec = recorteConsumoRP(FILTRO_CONSUMO_RP_ATE);
    leitura.className = 'consumo-leitura';
    leitura.innerHTML = `Até <strong>${dateBR(rec.ate)}</strong>: consumido <strong>${money(rec.total)}</strong> · saldo naquela data <strong>${money(rec.saldo)}</strong>`
      + (rec.semData ? ` <span class="muted">(${rec.semData} item(ns) sem data ficaram de fora)</span>` : '');
  } else {
    leitura.className = 'consumo-leitura muted';
    leitura.textContent = 'Sem recorte: contando todos os itens lançados.';
  }
  wrap.appendChild(leitura);
  return wrap;
}

/* Faturas do cartão, montadas a partir dos itens do Detalhamento FC.
   -------------------------------------------------------------------------
   O Detalhamento é a base: cada compra vai para a fatura do seu ciclo (fecha
   dia 5, vence dia 15) e é dali que sai todo valor de cartão do app — a
   coluna de Contas a Pagar, o card do Dashboard e este extrato. */
function faturasCartao() {
  const porMes = new Map();
  for (const cat of STATE.categorias || []) {
    for (const it of cat.itens || []) {
      if (!ehCartao(it.formaPagamento)) continue;
      const valor = round2(Number(it.valorRealizado) || 0);
      if (valor <= 0) continue;
      const mes = mesFaturaDoItem(it);
      if (!mes) continue;
      if (!porMes.has(mes)) porMes.set(mes, { mes, vencimento: vencimentoDaFatura(mes), total: 0, itens: [] });
      const f = porMes.get(mes);
      f.total = round2(f.total + valor);
      f.itens.push({ categoria: cat.nome, descricao: it.descricao, valor, dataCompra: it.dataPagamento || null });
    }
  }
  return [...porMes.values()].sort((a, b) => a.mes.localeCompare(b.mes));
}

// A fatura que está em jogo hoje: a próxima a vencer; se todas já venceram,
// a última — é o número que o Dashboard mostra.
function faturaCartaoAtual() {
  const lista = faturasCartao();
  if (!lista.length) return null;
  const hoje = (VIEW.resumo && VIEW.resumo.dataReferenciaCronograma) || new Date().toISOString().slice(0, 10);
  return lista.find((f) => (f.vencimento || '') >= hoje) || lista[lista.length - 1];
}

function abrirExtratoCartaoMes() {
  const lista = faturasCartao();
  const hoje = (VIEW.resumo && VIEW.resumo.dataReferenciaCronograma) || new Date().toISOString().slice(0, 10);
  const atual = faturaCartaoAtual();
  const totalGeral = round2(lista.reduce((a, f) => a + f.total, 0));
  const pago = round2(lista.filter((f) => (f.vencimento || '') < hoje).reduce((a, f) => a + f.total, 0));

  openModal('Extrato — despesas de cartão por fatura', (body) => {
    const topo = document.createElement('div');
    topo.className = 'extrato-total-line';
    topo.innerHTML = `<span>Fatura ${atual ? mesQuinzenaLabel(atual.mes, 1) : '—'} · vence ${atual ? dateBR(atual.vencimento) : '—'}</span>
      <strong>${money(atual ? atual.total : 0)}</strong>`;
    body.appendChild(topo);

    const nota = document.createElement('div');
    nota.className = 'muted';
    nota.style.margin = '6px 0 12px';
    nota.textContent = `Ciclo: fecha dia ${diaFechamentoCartao()}, vence dia ${diaVencimentoCartao()}. Compra feita antes do dia ${diaFechamentoCartao()} entra na fatura do próprio mês; do dia ${diaFechamentoCartao()} em diante vai para a do mês seguinte. Total lançado no cartão: ${money(totalGeral)} — ${money(pago)} em faturas já vencidas.`;
    body.appendChild(nota);

    if (!lista.length) {
      const vazio = document.createElement('div');
      vazio.className = 'muted';
      vazio.textContent = 'Nenhuma compra no cartão lançada no Detalhamento FC.';
      body.appendChild(vazio);
      return;
    }

    for (const f of lista) {
      const det = document.createElement('details');
      det.className = 'scurve-table-details';
      if (atual && f.mes === atual.mes) det.open = true;
      const vencida = (f.vencimento || '') < hoje;
      det.innerHTML = `<summary>${mesQuinzenaLabel(f.mes, 1)} · vence ${dateBR(f.vencimento)} — <strong>${money(f.total)}</strong> <span class="badge ${vencida ? 'gray' : 'accent'}">${vencida ? 'vencida' : 'a vencer'}</span></summary>`;
      const tw = document.createElement('div');
      tw.className = 'table-scroll';
      tw.innerHTML = `<table class="extrato-table">
        <thead><tr><th>Compra</th><th>Data da compra</th><th class="num">Valor</th></tr></thead>
        <tbody>${f.itens.map((i) => `<tr>
          <td>${esc(i.descricao)}<br><span class="muted" style="font-size:11px">${esc(i.categoria)}</span></td>
          <td>${i.dataCompra ? dateBR(i.dataCompra) : '—'}</td>
          <td class="num">${money(i.valor)}</td>
        </tr>`).join('')}
        <tr class="extrato-residuo"><td colspan="2"><strong>Total da fatura</strong></td><td class="num"><strong>${money(f.total)}</strong></td></tr>
        </tbody></table>`;
      det.appendChild(tw);
      body.appendChild(det);
    }
  });
}

/* Extrato do que já foi pago ao empreiteiro.
   -------------------------------------------------------------------------
   O empreiteiro recebe por três caminhos na mesma quinzena: o PIX da mão de
   obra, o cartão (material comprado pela obra, que é descontado do que ele
   tem a receber) e a transferência efetiva — PIX + ADM — que sai da conta.
   O "executado" do contrato é PIX + cartão; a ADM é da RS Engenharia, não do
   empreiteiro, então aparece separada e não entra na soma do contrato. */
function abrirExtratoEmpreiteiro() {
  const r = VIEW.resumo;
  const linhas = (VIEW.parcelas || [])
    .filter((p) => p.status === 'REALIZADO')
    .filter((p) => (Number(p.totalEmpreiteiroPix) || 0) || (Number(p.gastoCartao) || 0) || (Number(p.totalAdmPix) || 0))
    .sort((a, b) => (a.vencimento || a.vencPlanejado || '').localeCompare(b.vencimento || b.vencPlanejado || ''));
  const somaPix = round2(linhas.reduce((a, p) => a + (Number(p.totalEmpreiteiroPix) || 0), 0));
  const somaCartao = round2(linhas.reduce((a, p) => a + (Number(p.gastoCartao) || 0), 0));
  const somaAdm = round2(linhas.reduce((a, p) => a + (Number(p.totalAdmPix) || 0), 0));
  const somaTransf = round2(linhas.reduce((a, p) => a + (Number(p.totalATransferir) || 0), 0));

  openModal('Extrato — valor executado com o empreiteiro', (body) => {
    const topo = document.createElement('div');
    topo.className = 'extrato-total-line';
    topo.innerHTML = `<span>Executado do contrato (PIX + cartão)</span><strong>${money(round2(somaPix + somaCartao))}</strong>`;
    body.appendChild(topo);

    const nota = document.createElement('div');
    nota.className = 'muted';
    nota.style.margin = '6px 0 12px';
    nota.innerHTML = `Contrato total: <strong>${money(r.contratoTotalEmpreiteiro)}</strong> · já medido: <strong>${money(r.totalMedido)}</strong> · saldo do contrato a executar: <strong>${money(r.saldoContratoRestante)}</strong>.<br>
      Só quinzenas com status REALIZADO entram aqui. A ADM de ${pct(VIEW.parametros.taxaAdministracaoPercent)} é da RS Engenharia e não consome contrato — por isso fica fora da soma acima, mas aparece na coluna para conferir a transferência.`;
    body.appendChild(nota);

    const tw = document.createElement('div');
    tw.className = 'table-scroll';
    tw.innerHTML = `<table class="extrato-table">
      <thead><tr><th>Quinzena</th><th class="num">PIX mão de obra</th><th class="num">Cartão (material)</th><th class="num">Executado</th><th class="num">ADM (RS)</th><th class="num">Transferido</th></tr></thead>
      <tbody>${linhas.map((p) => {
        const pix = Number(p.totalEmpreiteiroPix) || 0;
        const cartao = Number(p.gastoCartao) || 0;
        return `<tr>
          <td>${esc(p.mesReferenciaLabel || p.label)}</td>
          <td class="num">${money(pix)}</td>
          <td class="num">${money(cartao)}</td>
          <td class="num"><strong>${money(round2(pix + cartao))}</strong></td>
          <td class="num muted">${money(p.totalAdmPix)}</td>
          <td class="num">${money(p.totalATransferir)}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="6" class="muted">Nenhuma quinzena realizada ainda.</td></tr>'}
      <tr class="extrato-residuo">
        <td><strong>Total</strong></td>
        <td class="num"><strong>${money(somaPix)}</strong></td>
        <td class="num"><strong>${money(somaCartao)}</strong></td>
        <td class="num"><strong>${money(round2(somaPix + somaCartao))}</strong></td>
        <td class="num"><strong>${money(somaAdm)}</strong></td>
        <td class="num"><strong>${money(somaTransf)}</strong></td>
      </tr>
      </tbody></table>`;
    body.appendChild(tw);

    const saldo = document.createElement('div');
    saldo.className = 'muted';
    saldo.style.marginTop = '10px';
    saldo.innerHTML = `Do que já foi <strong>medido</strong> (${money(r.totalMedido)}), o empreiteiro já recebeu ${money(round2(somaPix + somaCartao))} — ${r.saldoAPagarEmpreiteiro >= 0 ? `restam <strong>${money(r.saldoAPagarEmpreiteiro)}</strong> a pagar` : `há <strong>${money(Math.abs(r.saldoAPagarEmpreiteiro))}</strong> pagos além do medido (adiantamento)`}.`;
    body.appendChild(saldo);
  });
}

const DRILLS = {
  cartaoMes: () => abrirExtratoCartaoMes(),
  empreiteiro: () => abrirExtratoEmpreiteiro(),
  recursoProprio: () => abrirExtratoRecursoProprio(),
  caixaLiberado: () => abrirExtratoCaixaLiberado(),
  verbaDisponivel: () => abrirExtratoVerbaDisponivel(),
  viabilidade: () => abrirExtratoViabilidade(),
};

function ligarDrills(root) {
  root.querySelectorAll('[data-drill]').forEach((btn) => {
    const fn = DRILLS[btn.dataset.drill];
    if (fn) btn.onclick = fn;
  });
}

/* Viabilidade do empreendimento: VGV, margem e retorno.
   -------------------------------------------------------------------------
   Aqui o painel deixa de olhar só o caixa da obra e passa a olhar o negócio:
   quanto entra de investimento (banco + capital próprio), quanto se espera
   de venda (VGV) e o que sobra. O ROI é medido sobre o CAPITAL PRÓPRIO, não
   sobre o investimento total — é a conta que interessa a quem incorpora,
   porque o restante é dinheiro financiado. O VGV é editável aqui mesmo e
   todo o resto recalcula na hora. */
function abrirExtratoViabilidade() {
  const r = VIEW.resumo;
  const pci = Number(r.creditoCaixaTotalPCI) || 0;
  const rp = Number(r.recursoProprioPlanejado) || 0;
  const custo = Number(r.investimentoTotal) || 0;
  const vgv = Number(r.vgv) || 0;

  openModal('Viabilidade do empreendimento', (body) => {
    // Os três números que respondem as duas perguntas — a rentabilidade da
    // operação e a rentabilidade do capital que saiu do bolso.
    const painel = document.createElement('div');
    painel.className = 'viab-destaques';
    painel.innerHTML = `
      <div class="viab-num">
        <span class="viab-rotulo">VGV estimado</span>
        <strong class="viab-valor">${money(vgv)}</strong>
      </div>
      <div class="viab-num">
        <span class="viab-rotulo">Margem sobre o custo total</span>
        <strong class="viab-valor ${r.margemSobreCusto < 0 ? 'ruim' : 'bom'}">${pct(r.margemSobreCusto)}</strong>
        <span class="viab-nota">rentabilidade da operação, como se tudo fosse seu</span>
      </div>
      <div class="viab-num">
        <span class="viab-rotulo">ROI líquido sobre capital próprio</span>
        <strong class="viab-valor ${r.roiLiquidoCapitalProprio < 0 ? 'ruim' : 'bom'}">${pct(r.roiLiquidoCapitalProprio)}</strong>
        <span class="viab-nota">retorno do dinheiro que você colocou</span>
      </div>`;
    body.appendChild(painel);

    // Campos editáveis
    const edit = document.createElement('div');
    edit.className = 'consumo-filtro';
    const reabrir = () => {
      const bd = body.closest('.modal-backdrop');
      if (bd) bd.remove();
      abrirExtratoViabilidade();
    };
    const campo = (titulo, el) => {
      const label = document.createElement('label');
      label.textContent = titulo;
      el.classList.add('filter-control');
      el.style.maxWidth = '145px';
      label.appendChild(el);
      edit.appendChild(label);
    };
    campo('VGV (R$)', moneyInput({ value: vgv, onSave: (v) => { updateParametros({ vgv: v }); reabrir(); } }));
    campo('Corretagem (%)', percentInput({ value: r.corretagemPercent, onSave: (v) => { updateParametros({ corretagemPercent: v }); reabrir(); } }));
    campo('IR sobre o ganho (%)', percentInput({ value: r.irPercent, onSave: (v) => { updateParametros({ irPercent: v }); reabrir(); } }));
    campo('Custos financeiros (R$)', moneyInput({ value: r.custosFinanceiros, onSave: (v) => { updateParametros({ custosFinanceiros: v }); reabrir(); } }));
    body.appendChild(edit);

    // A ponte do cálculo
    const wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    wrap.style.maxHeight = '44vh';
    wrap.innerHTML = `
      <table class="extrato-table">
        <tbody>
          <tr class="extrato-grupo"><td colspan="2">Como o custo é bancado</td></tr>
          <tr><td>Financiamento CAIXA (PCI)</td><td class="num">${money(pci)}</td></tr>
          <tr><td>Capital próprio</td><td class="num">${money(rp)}</td></tr>
          ${r.custosFinanceiros ? `<tr><td>Custos financeiros (juros, tarifas)</td><td class="num">${money(r.custosFinanceiros)}</td></tr>` : ''}
          <tr class="extrato-residuo"><td><strong>Custo total da operação</strong></td><td class="num"><strong>${money(custo)}</strong></td></tr>

          <tr class="extrato-grupo"><td colspan="2">Resultado da operação</td></tr>
          <tr><td>VGV estimado</td><td class="num">${money(vgv)}</td></tr>
          <tr><td>Custo total da operação</td><td class="num">− ${money(custo)}</td></tr>
          <tr class="extrato-residuo"><td><strong>Resultado bruto</strong></td><td class="num"><strong>${money(r.margemBruta)}</strong></td></tr>
          <tr><td class="sub-item">múltiplo VGV ÷ custo <span class="muted">(não é margem)</span></td><td class="num">${fmtNum.format(r.multiploVgvCusto)}x</td></tr>

          <tr class="extrato-grupo"><td colspan="2">Do bruto ao líquido</td></tr>
          <tr><td>Corretagem sobre o VGV <span class="muted">(${pct(r.corretagemPercent)})</span></td><td class="num">− ${money(r.corretagemValor)}</td></tr>
          <tr><td>IR sobre o ganho <span class="muted">(${pct(r.irPercent)})</span></td><td class="num">− ${money(r.irValor)}</td></tr>
          <tr class="extrato-residuo"><td><strong>Lucro líquido</strong></td><td class="num"><strong>${money(r.lucroLiquido)}</strong></td></tr>
          <tr><td class="sub-item">sobre o capital próprio de ${money(rp)}</td><td class="num"><strong>${pct(r.roiLiquidoCapitalProprio)}</strong></td></tr>
        </tbody>
      </table>`;
    body.appendChild(wrap);

    /* O custo financeiro do financiamento NÃO está fora da conta: ele entra
       parcela a parcela pela coluna "Evolução CAIXA" de Contas a Pagar, que
       é a prestação da evolução de obra com juros e seguro já embutidos. O
       parâmetro "Custos financeiros" existe só para o que ficar DE FORA
       dessa coluna (tarifas avulsas, por exemplo) — dizer que está tudo
       zerado era errado e subestimava o que já foi lançado. */
    const evolucaoLancada = round2((VIEW.parcelas || []).reduce((a, p) => a + (Number(p.parcelaEvolucaoCaixa) || 0), 0));
    const evolucaoPaga = round2((VIEW.parcelas || []).filter((p) => p.status === 'REALIZADO').reduce((a, p) => a + (Number(p.parcelaEvolucaoCaixa) || 0), 0));
    if (evolucaoLancada > 0 || r.custosFinanceiros) {
      const info = document.createElement('div');
      info.className = 'muted';
      info.style.marginTop = '10px';
      info.innerHTML = `<strong>Evolução CAIXA já lançada: ${money(evolucaoLancada)}</strong> (${money(evolucaoPaga)} já pago, o restante planejado) — é a prestação da evolução de obra, com juros e seguro embutidos, e ela já entra no custo das quinzenas em Contas a Pagar.<br>
        Na conta de viabilidade acima o custo é <strong>crédito CAIXA (${money(r.creditoCaixaTotalPCI)}) + recurso próprio (${money(rp)})</strong>${r.custosFinanceiros ? ` + custos financeiros (${money(r.custosFinanceiros)})` : ''} — ou seja, o <em>principal</em> do financiamento. A parte da evolução que é juros e seguro fica <strong>acima</strong> desse principal: se quiser que ela reduza o ROI, lance só essa parcela de juros/seguro em "Custos financeiros", nos Parâmetros. Não lance a evolução inteira ali, senão o principal conta duas vezes.`;
      body.appendChild(info);
    } else if (!r.custosFinanceiros) {
      const alerta = document.createElement('div');
      alerta.className = 'modo-banner';
      alerta.innerHTML = '<span>Nenhuma parcela de <strong>evolução CAIXA</strong> foi lançada ainda e o campo "Custos financeiros" está zerado. Enquanto o custo do financiamento não entrar por um dos dois, este ROI é uma estimativa otimista.</span>';
      body.appendChild(alerta);
    }

    const nota = document.createElement('div');
    nota.className = 'muted';
    nota.innerHTML = r.lucroLiquido < 0
      ? '<strong>Atenção:</strong> com esse VGV a operação fecha no negativo depois de corretagem e imposto.'
      : `A <strong>margem sobre o custo total</strong> mede a operação inteira, não importa se o dinheiro veio do banco ou do bolso: cada R$ 1,00 de custo gera ${fmtNum.format(r.margemSobreCusto)} de resultado bruto. O <strong>ROI sobre capital próprio</strong> mede só o seu dinheiro — é a alavancagem: o financiamento reduz o capital que você precisa pôr, mas continua compondo o custo da operação.`;
    body.appendChild(nota);
  }, { wide: true });
}

// Extrato do "Valor caixa liberado": abre a composição do que o banco já
// soltou — o pagamento do lote (etapa 1 do PCI, financiado junto com a
// aquisição do terreno) e cada medição do PLS liberada depois, na data real

  const somaMedicoes = round2(realizadas.reduce((a, l) => a + (Number(l.valor) || 0), 0));
  const totalLiberado = Number(r.caixaLiberadaAcumulada) || 0;
  const totalPCI = Number(r.creditoCaixaTotalPCI) || 0;
  const aLiberar = round2(totalPCI - totalLiberado);
  const somaPlanejadas = round2(planejadas.reduce((a, l) => a + (Number(l.valor) || 0), 0));

  openModal('Extrato — Valor caixa liberado', (body) => {

    topo.className = 'extrato-total-line';

    body.appendChild(resumo);

    const wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    wrap.style.maxHeight = '46vh';
    wrap.innerHTML = `
      <table class="extrato-table">
        <thead><tr><th>Origem</th><th>Data</th><th class="num">Valor</th></tr></thead>
        <tbody>
          <tr class="extrato-linha-verba">
            <td><strong>Pagamento do lote</strong><br><span class="muted">Etapa 1 do PCI — aquisição do terreno, taxas e projetos</span></td>
            <td>${dateBR(VIEW.meta && VIEW.meta.dataInicio)}</td>
            <td class="num"><strong>${money(lote)}</strong></td>
          </tr>
          ${realizadas.map((l) => `
            <tr>
              <td>${esc(l.obs || 'Medição')} <span class="muted">— PLS</span></td>
              <td>${dateBR(l.data)}</td>
              <td class="num">${money(l.valor)}</td>
            </tr>`).join('')}
        </tbody>
        <tfoot>
          <tr><td>Medições PLS liberadas</td><td></td><td class="num">${money(somaMedicoes)}</td></tr>
          <tr><td>Total liberado (lote + PLS)</td><td></td><td class="num">${money(totalLiberado)}</td></tr>
        </tfoot>
      </table>`;
    body.appendChild(wrap);

    if (planejadas.length) {
      const prev = document.createElement('div');
      prev.innerHTML = `<div class="muted" style="margin-bottom:6px">Ainda planejadas — não entram no valor acima:</div>
        <table class="extrato-table">
          <tbody>${planejadas.map((l) => `<tr class="planejado-linha"><td>${esc(l.obs || 'Medição')}</td><td>${dateBR(l.data)}</td><td class="num">${money(l.valor)}</td></tr>`).join('')}</tbody>
          <tfoot><tr><td>Soma planejada</td><td></td><td class="num">${money(somaPlanejadas)}</td></tr></tfoot>
        </table>`;
      body.appendChild(prev);

    const nota = document.createElement('div');
    nota.className = 'muted';
    nota.textContent = 'O pagamento do lote é financiamento liberado, mas não é medição de obra: entrou junto com a aquisição do terreno (etapa 1 do PCI). As medições do PLS são as liberações por avanço físico, lançadas na aba Liberação PCI.';
    body.appendChild(nota);
  }, { wide: true });
}

function origemSaldoRecursoLabel(origem, r) {

}

// input percentual: mostra "42,5%" em repouso; ao focar, edita em número
// simples (0-100), reformatando ao sair. Valor salvo/recebido é sempre
// fração (0-1), igual aos demais campos de percentual do app.
function percentInput({ value, onSave, wide = false, manual = false, max100 = true }) {
  const input = document.createElement('input');
  input.type = 'text';
  input.inputMode = 'decimal';
  input.className = `cell-input${wide ? ' wide' : ''}${manual ? ' manual' : ''}`;
  input.value = pct(value);
  input.addEventListener('focus', () => {
    input.value = String(Math.round((Number(value) || 0) * 1000) / 10).replace('.', ',');
    input.select();
  });
  const commit = () => {
    const raw = input.value.trim().replace(',', '.');
    const n = Number(raw);
    const clamped = max100 ? Math.min(100, Math.max(0, n)) : Math.max(0, n);
    const v = Number.isFinite(n) ? clamped / 100 : 0;
    input.value = pct(v);
    if (v !== value) onSave(v);
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
  return input;
}

function textInput({ value, onSave, wide = false }) {
  const input = document.createElement('input');
  input.type = 'text';
  input.value = value ?? '';
  input.className = `cell-input${wide ? ' wide' : ''}`;
  const commit = () => { if (input.value !== value) onSave(input.value); };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
  return input;
}

function dateInput({ value, onSave }) {
  const input = document.createElement('input');
  input.type = 'date';
  input.value = value ? String(value).slice(0, 10) : '';
  input.className = 'cell-input';
  const commit = () => { if (input.value !== value) onSave(input.value || null); };
  input.addEventListener('change', commit);
  return input;
}

function selectInput({ value, options, onSave }) {
  const select = document.createElement('select');
  select.className = 'cell-input';
  for (const opt of options) {
    const o = document.createElement('option');
    o.value = opt; o.textContent = opt;
    if (opt === value) o.selected = true;
    select.appendChild(o);
  }
  select.addEventListener('change', () => onSave(select.value));
  return select;
}

// Select de status com destaque de cor: verde = já aconteceu (REALIZADO),
// âmbar = ainda é previsão (PLANEJADO). Continua editável como antes.
function statusSelect({ value, onSave }) {
  const sel = selectInput({ value: value || 'REALIZADO', options: ['PLANEJADO', 'REALIZADO'], onSave });
  sel.classList.add('status-select');
  const pintar = () => {
    const ok = sel.value === 'REALIZADO';
    sel.classList.toggle('realizado', ok);
    sel.classList.toggle('planejado', !ok);
    sel.title = ok ? 'Realizado — já aconteceu' : 'Planejado — ainda é previsão';
  };
  pintar();
  sel.addEventListener('change', pintar);
  return sel;
}

// Marca a linha inteira conforme o status, para dar pra varrer a tabela sem
// precisar ler a coluna de status.
function marcarLinhaStatus(tr, status) {
  tr.classList.add(status === 'REALIZADO' ? 'row-realizada' : 'row-planejada');

function td(el) {

/* ==========================================================================
   TAB — Dashboard Executivo (curva S + seleção "o que pagar")
   ========================================================================== */
function calcPercPrevistoClient(cronogramaPrevisto, dataRef) {
  if (!cronogramaPrevisto || !cronogramaPrevisto.inicio || !cronogramaPrevisto.termino) return 0;
  const inicio = new Date(cronogramaPrevisto.inicio + 'T00:00:00');
  const termino = new Date(cronogramaPrevisto.termino + 'T00:00:00');
  const ref = new Date(dataRef + 'T00:00:00');
  if (Number.isNaN(inicio.getTime()) || Number.isNaN(termino.getTime()) || Number.isNaN(ref.getTime())) return 0;
  if (ref <= inicio) return 0;
  if (ref >= termino) return 1;
  const totalMs = termino.getTime() - inicio.getTime();
  if (totalMs <= 0) return 1;
  return Math.max(0, Math.min(1, (ref.getTime() - inicio.getTime()) / totalMs));
}

function addMonthsISO(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setMonth(d.getMonth() + n);
  return d.toISOString().slice(0, 10);
}

function buildMonthlyCheckpoints(startStr, endStr) {
  const out = [];
  let cur = startStr;
  let i = 0;
  while (cur < endStr && i < 60) {
    out.push(cur);
    i += 1;
    cur = addMonthsISO(startStr, i);
  }
  out.push(endStr);
  return out;
}

function buildCurvaEmpreiteiro(checkpoints) {
  const categorias = VIEW.categorias;
  const totalValue = VIEW.resumo.contratoTotalEmpreiteiro;

  const planned = checkpoints.map((cp) => {
    let total = 0;
    for (const c of categorias) {
      total += (Number(c.valorOrcado) || 0) * calcPercPrevistoClient(c.cronogramaPrevisto, cp);
    }
    return Math.round(total * 100) / 100;
  });

  const realizadas = VIEW.parcelas
    .filter((p) => p.status === 'REALIZADO')
    .map((p) => ({ data: (p.vencimento || p.vencPlanejado || '').slice(0, 10), valor: (Number(p.totalEmpreiteiroPix) || 0) + (Number(p.gastoCartao) || 0) }))
    .filter((p) => p.data)
    .sort((a, b) => a.data.localeCompare(b.data));

  let acc = 0;
  const executedRaw = realizadas.map((p) => { acc += p.valor; return { data: p.data, valor: Math.round(acc * 100) / 100 }; });

  const executed = checkpoints.map((cp) => {
    let last = 0;
    for (const e of executedRaw) { if (e.data <= cp) last = e.valor; else break; }
    return last;
  });

  return { checkpoints, planned, executed, executedRaw, totalValue };
}

function buildCurvaCaixa(checkpoints, dataInicio) {
  const totalValue = VIEW.resumo.creditoCaixaTotalPCI;
  const etapasComData = VIEW.liberacaoPCI.map((e) => ({
    data: addMonthsISO(dataInicio, Math.max(0, (Number(e.mesProgramado) || 1) - 1)),
    valor: Number(e.valor) || 0,
  }));

  const planned = checkpoints.map((cp) => {
    let total = 0;
    for (const e of etapasComData) if (e.data <= cp) total += e.valor;
    return Math.round(total * 100) / 100;
  });

  // Executado: acumulado real das liberações do CAIXA — começa com o valor que
  // o CAIXA já passou do lote (taxas e projetos, financiado junto com a
  // aquisição do lote, etapa 1 do PCI) e soma as medições mensais lançadas
  // pelo proprietário, na data real de cada uma. Esse total precisa bater com
  // "Valor caixa liberado" do resumo (resumo.caixaLiberadaAcumulada).
  const custoLoteExecutado = Number((VIEW.parametros || {}).custoLoteExecutado) || 0;
  const liberacoes = [...(VIEW.liberacoesCaixa || [])].sort((a, b) => (a.data || '').localeCompare(b.data || ''));
  let accLib = custoLoteExecutado;
  const executedRaw = custoLoteExecutado > 0
    ? [{ data: dataInicio, valor: Math.round(accLib * 100) / 100 }]
    : [];
  liberacoes.forEach((l) => { accLib += Number(l.valor) || 0; executedRaw.push({ data: l.data, valor: Math.round(accLib * 100) / 100 }); });
  const executed = checkpoints.map((cp) => {
    let last = 0;
    for (const e of executedRaw) { if (e.data <= cp) last = e.valor; else break; }
    return last;
  });

  return { checkpoints, planned, executed, executedRaw, totalValue };
}

/* Decomposição do avanço na Curva S do Empreiteiro.
   -------------------------------------------------------------------------
   Lendo os dois gráficos lado a lado, o empreiteiro aparece à frente do
   planejado por um valor maior do que o CAIXA aparece à frente do PCI. Essa
   diferença NÃO é distorção de leitura: é exatamente a parcela bancada com
   recurso próprio. O marco abaixo separa, no ponto "hoje", quanto do avanço
   acima do planejado veio do CAIXA (PCI/PLS) e quanto veio de recurso
   próprio — mostrando que o valor final não muda e que as duas curvas
   contam a mesma história. */
function buildMarcoAvanco(curvaEmp, curvaCaixa, hojeStr) {
  const n = curvaEmp.checkpoints.length;
  const idx = curvaEmp.checkpoints.findIndex((cp) => cp >= hojeStr);
  const i = idx === -1 ? n - 1 : idx;

  const execEmp = curvaEmp.executed[i] ?? 0;
  const planEmp = curvaEmp.planned[i] ?? 0;
  const gapEmp = execEmp - planEmp;

  const execCx = curvaCaixa.executed[i] ?? 0;
  const planCx = curvaCaixa.planned[i] ?? 0;
  const gapCx = execCx - planCx;

  // Só faz sentido fatiar quando o empreiteiro está adiantado e essa dianteira
  // é maior do que a do CAIXA — aí a sobra é o recurso próprio.
  if (!(gapEmp > 0 && gapCx > 0 && gapEmp >= gapCx)) return null;
  const rp = gapEmp - gapCx;

  return {
    idx: i,
    planejado: planEmp,
    executado: execEmp,
    gapEmp,
    gapCaixa: gapCx,
    rp,
    legenda: `Dos ${money(gapEmp)} que o empreiteiro está acima do planejado hoje, ${money(gapCx)} correspondem ao que o CAIXA já pagou acima do PCI (via PLS) e ${money(rp)} são recurso próprio.`,
    explicacaoHtml: `
      <strong>Não há distorção significativa entre os dois gráficos</strong><br><br>
      À primeira vista o Empreiteiro parece muito mais adiantado que o CAIXA.
      Comparando os dois no mesmo ponto (hoje), a conta fecha:<br><br>
      <strong>Empreiteiro acima do planejado:</strong> ${money(gapEmp)}<br>
      <strong>CAIXA acima do PCI (pago via PLS):</strong> ${money(gapCx)}<br>
      <strong>Diferença — recurso próprio:</strong> ${money(rp)}<br><br>
      Ou seja: ${money(gapCx)} do avanço estão cobertos pelo financiamento e
      apenas ${money(rp)} saíram do bolso do proprietário. O valor final não
      muda — é a mesma obra vista pelos dois lados, e o descolamento entre as
      curvas é justamente essa parcela de recurso próprio, não um
      adiantamento do banco nem crédito sobrando.
    `,
  };
}

function renderSCurveCard({ title, subtitle, curve, hojeStr, marker = null }) {
  const card = document.createElement('div');
  card.className = 'panel scurve-card';

  const W = 720, H = 300, padL = 46, padR = 16, padT = 14, padB = 34;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = curve.checkpoints.length;
  const xAt = (i) => padL + (n > 1 ? (i / (n - 1)) * plotW : 0);
  const maxVal = Math.max(curve.totalValue, ...curve.planned, ...curve.executed) * 1.02 || 1;
  const yAt = (v) => padT + plotH - (v / maxVal) * plotH;

  const pathFrom = (arr) => arr.map((v, i) => `${i === 0 ? 'M' : 'L'}${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(' ');
  const plannedPath = pathFrom(curve.planned);
  const executedPath = pathFrom(curve.executed);
  const areaPath = `${executedPath} L${xAt(n - 1).toFixed(1)},${(padT + plotH).toFixed(1)} L${xAt(0).toFixed(1)},${(padT + plotH).toFixed(1)} Z`;

  const gridFracs = [0, 0.25, 0.5, 0.75, 1];
  const hojeIdx = curve.checkpoints.findIndex((cp) => cp >= hojeStr);
  const hojeI = hojeIdx === -1 ? n - 1 : hojeIdx;

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('class', 'scurve-svg');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', `${title}: curva planejado x executado`);

  const gradId = `scurveFill-${title.replace(/\W+/g, '')}`;
  let defs = `<defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.16" />
    <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.01" />
  </linearGradient></defs>`;

  let grid = '';
  for (const f of gridFracs) {
    const y = padT + plotH - f * plotH;
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" class="scurve-grid" />`;
    grid += `<text x="${padL - 8}" y="${(y + 3).toFixed(1)}" class="scurve-axis-label" text-anchor="end">${Math.round(f * 100)}%</text>`;
  }

  let xlabels = '';
  const step = Math.max(1, Math.round(n / 8));
  for (let i = 0; i < n; i += step) {
    const [y, m] = curve.checkpoints[i].split('-');
    xlabels += `<text x="${xAt(i).toFixed(1)}" y="${H - 10}" class="scurve-axis-label" text-anchor="middle">${MONTH_NAMES_PT[Number(m) - 1].slice(0, 3)}/${y.slice(2)}</text>`;
  }

  const hojeX = xAt(hojeI).toFixed(1);
  const hojeLine = `<line x1="${hojeX}" y1="${padT}" x2="${hojeX}" y2="${padT + plotH}" class="scurve-hoje" />`;

  const endPlanned = curve.planned[hojeI] ?? curve.planned[n - 1];
  const endExecuted = curve.executed[hojeI] ?? curve.executed[n - 1];

  // Marco: no ponto "hoje", a distância entre o planejado e o executado é
  // fatiada em duas — o pedaço coberto pelo CAIXA (PCI/PLS) e o pedaço de
  // recurso próprio. É a identificação de que a dianteira do empreiteiro
  // sobre a curva de liberação é exatamente o capital próprio aplicado, e
  // não uma distorção entre os dois gráficos.
  let markerSvg = '';
  if (marker && marker.rp > 0) {
    const bx = xAt(marker.idx) + 7;
    const yBase = yAt(marker.planejado);
    const yCaixa = yAt(marker.planejado + marker.gapCaixa);
    const yTopo = yAt(marker.executado);
    const meio = (a, b) => ((a + b) / 2).toFixed(1);
    markerSvg = `
      <rect x="${bx.toFixed(1)}" y="${yCaixa.toFixed(1)}" width="9" height="${Math.max(1, yBase - yCaixa).toFixed(1)}" class="scurve-seg caixa"></rect>
      <rect x="${bx.toFixed(1)}" y="${yTopo.toFixed(1)}" width="9" height="${Math.max(2, yCaixa - yTopo).toFixed(1)}" class="scurve-seg rp"></rect>
      <line x1="${(bx - 3).toFixed(1)}" y1="${yBase.toFixed(1)}" x2="${(bx + 14).toFixed(1)}" y2="${yBase.toFixed(1)}" class="scurve-seg-tick"></line>
      <line x1="${(bx - 3).toFixed(1)}" y1="${yTopo.toFixed(1)}" x2="${(bx + 14).toFixed(1)}" y2="${yTopo.toFixed(1)}" class="scurve-seg-tick"></line>
      <text x="${(bx + 18).toFixed(1)}" y="${(yTopo - 13).toFixed(1)}" class="scurve-seg-tag rp">Recurso próprio ${esc(money(marker.rp))}</text>
      <text x="${(bx + 18).toFixed(1)}" y="${meio(yCaixa, yBase)}" dy="4" class="scurve-seg-tag caixa">CAIXA via PLS ${esc(money(marker.gapCaixa))}</text>
    `;
  }

  svg.innerHTML = `
    ${defs}
    <g>${grid}</g>
    ${markerSvg}
    <path d="${areaPath}" fill="url(#${gradId})" stroke="none"></path>
    <path d="${plannedPath}" class="scurve-line planned"></path>
    <path d="${executedPath}" class="scurve-line executed"></path>
    ${hojeLine}
    <circle cx="${hojeX}" cy="${yAt(endExecuted).toFixed(1)}" r="4.5" class="scurve-dot executed"></circle>
    <circle cx="${hojeX}" cy="${yAt(endPlanned).toFixed(1)}" r="4.5" class="scurve-dot planned"></circle>
    <g>${xlabels}</g>
  `;

  const wrap = document.createElement('div');
  wrap.className = 'scurve-wrap';
  const tooltip = document.createElement('div');
  tooltip.className = 'scurve-tooltip';
  tooltip.hidden = true;
  wrap.appendChild(svg);
  wrap.appendChild(tooltip);

  const hitArea = document.createElementNS(svgNS, 'rect');
  hitArea.setAttribute('x', padL); hitArea.setAttribute('y', padT);
  hitArea.setAttribute('width', plotW); hitArea.setAttribute('height', plotH);
  hitArea.setAttribute('fill', 'transparent');
  svg.appendChild(hitArea);
  const crosshair = document.createElementNS(svgNS, 'line');
  crosshair.setAttribute('class', 'scurve-crosshair');
  crosshair.setAttribute('y1', padT); crosshair.setAttribute('y2', padT + plotH);
  crosshair.setAttribute('hidden', 'true');
  svg.appendChild(crosshair);

  const onMove = (evt) => {
    const rect = svg.getBoundingClientRect();
    const xFrac = (evt.clientX - rect.left) / rect.width;
    const xSvg = xFrac * W;
    let idx = Math.round(((xSvg - padL) / plotW) * (n - 1));
    idx = Math.max(0, Math.min(n - 1, idx));
    crosshair.removeAttribute('hidden');
    crosshair.setAttribute('x1', xAt(idx)); crosshair.setAttribute('x2', xAt(idx));
    const [y, m, d] = curve.checkpoints[idx].split('-');
    tooltip.hidden = false;
    tooltip.style.left = `${(xAt(idx) / W) * 100}%`;
    tooltip.innerHTML = `
      <div class="scurve-tooltip-date">${d}/${m}/${y}</div>
      <div class="scurve-tooltip-row"><span class="scurve-key executed"></span>Executado <strong>${money(curve.executed[idx])}</strong> (${pct(curve.totalValue > 0 ? curve.executed[idx] / curve.totalValue : 0)})</div>
      <div class="scurve-tooltip-row"><span class="scurve-key planned"></span>Planejado <strong>${money(curve.planned[idx])}</strong> (${pct(curve.totalValue > 0 ? curve.planned[idx] / curve.totalValue : 0)})</div>
    `;
  };
  const onLeave = () => { crosshair.setAttribute('hidden', 'true'); tooltip.hidden = true; };
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerleave', onLeave);

  const gapVal = endExecuted - endPlanned;
  const gapPct = curve.totalValue > 0 ? gapVal / curve.totalValue : 0;

  card.innerHTML = `
    <div class="panel-header">
      <div>
        <h2>${esc(title)}</h2>
        <div class="muted">${esc(subtitle)}</div>
      </div>
      <div class="scurve-legend">

    // "i" — quem só quer o número não precisa ler o parágrafo.
    marks.appendChild(makeInfoHost(null, marker.explicacaoHtml));
    card.appendChild(marks);
  }

  const gapNote = document.createElement('div');
  gapNote.className = `scurve-gap-note ${gapVal >= 0 ? 'good' : 'warn'}`;
  gapNote.textContent = gapVal >= 0
    ? `Adiantado/em dia: ${money(gapVal)} acima do planejado até hoje (${pct(Math.abs(gapPct))}).`
    : `Atrasado: falta ${money(Math.abs(gapVal))} para alcançar o planejado até hoje (${pct(Math.abs(gapPct))}).`;
  card.appendChild(gapNote);

  const details = document.createElement('details');
  details.className = 'scurve-table-details';
  details.innerHTML = `<summary>Ver tabela de apoio (valores por mês)</summary>`;
  const tblWrap = document.createElement('div');
  tblWrap.className = 'table-scroll';
  tblWrap.innerHTML = `<table class="data"><thead><tr>

  </tr></thead><tbody>${curve.checkpoints.map((cp, i) => {
    const diff = curve.executed[i] - curve.planned[i];
    return `<tr><td>${dateBR(cp)}</td><td class="num">${money(curve.planned[i])}</td><td class="num">${money(curve.executed[i])}</td><td class="num">${diff >= 0 ? '+' : ''}${money(diff)}</td></tr>`;
  }).join('')}</tbody></table>`;
  details.appendChild(tblWrap);
  card.appendChild(details);

  return card;
}

/* Avanço de cada categoria, cruzado com o histórico de medições.
   -------------------------------------------------------------------------
   A coluna "% avanço" era só um número solto. Aqui ela ganha barra, rótulo
   de estado e — o que interessa de verdade — a amarração com o histórico:
   a data da última medição realizada e quantos pontos percentuais aquela
   medição acrescentou. 100% deixa de ser "100%" e passa a ser "Medido /
   concluído", que é o que o número quer dizer. */
function historicoDaCategoria(catId, apenasRealizados = true) {
  return (VIEW.historicoAvancos || [])
    .filter((h) => h.categoriaId === catId && (!apenasRealizados || h.status === 'REALIZADO'))
    .sort((a, b) => String(a.data || '').localeCompare(String(b.data || '')));
}

function estadoAvanco(perc) {
  if (perc >= 0.9999) return { classe: 'concluido', rotulo: 'Medido / concluído' };
  if (perc > 0) return { classe: 'andamento', rotulo: 'Em execução' };
  return { classe: 'nao-iniciado', rotulo: 'Não iniciado' };
}

// Célula de avanço: barra + percentual + estado + última medição do histórico.
function celulaAvanco(c) {
  const perc = Number(c.percAvancoEfetivo) || 0;
  const est = estadoAvanco(perc);
  const hist = historicoDaCategoria(c.id);
  const ultimo = hist[hist.length - 1] || null;
  const delta = ultimo && ultimo.percAvancoAnterior != null
    ? (Number(ultimo.percAvancoNovo) || 0) - (Number(ultimo.percAvancoAnterior) || 0)
    : (ultimo ? Number(ultimo.percAvancoNovo) || 0 : 0);

  const rodape = ultimo
    ? `<span class="avanco-hist" title="Última medição registrada no histórico de avanços">${dateBR(ultimo.data)} · +${fmtNum.format(delta * 100)} p.p.${hist.length > 1 ? ` · ${hist.length} medições` : ''}</span>`
    : '<span class="avanco-hist sem">sem medição no histórico</span>';

  return `<div class="avanco-cell ${est.classe}">
      <div class="avanco-topo"><span class="avanco-pct">${pct(perc)}</span><span class="avanco-tag">${est.rotulo}</span></div>
      <div class="avanco-bar"><span style="width:${Math.min(100, Math.max(0, perc * 100)).toFixed(1)}%"></span></div>
      ${rodape}
    </div>`;
}

/* Aviso de rascunho local em uso.
   -------------------------------------------------------------------------
   Só aparece quando a tela está mostrando uma cópia guardada neste navegador
   em vez da versão publicada. Traz o botão para descartá-la — é a saída
   quando um número corrigido na publicação não aparece porque o rascunho
   antigo está por cima. */
/* Conciliação do empreiteiro.
   -------------------------------------------------------------------------
   A palavra "empreiteiro" aparece em quatro números diferentes na tela e eles
   nunca vão ser iguais, porque respondem a perguntas diferentes: quanto foi
   CONTRATADO, quanto de obra já foi MEDIDO, quanto ele já RECEBEU e o que
   sobra de cada um. Sem ver os quatro lado a lado, a impressão é de erro.
   Este quadro mostra a conta inteira e, principalmente, o número que importa:
   a diferença entre o medido e o recebido — se ele recebeu adiantado ou se
   ainda tem valor medido a receber. */
function renderConciliacaoEmpreiteiro() {
  const r = VIEW.resumo;
  const parcelas = VIEW.parcelas || [];
  const realizadas = parcelas.filter((p) => p.status === 'REALIZADO');
  const planejadas = parcelas.filter((p) => p.status !== 'REALIZADO');
  const som = (lista, f) => round2(lista.reduce((a, p) => a + (Number(p[f]) || 0), 0));
  const pixReal = som(realizadas, 'totalEmpreiteiroPix');
  const cartaoReal = som(realizadas, 'gastoCartao');
  const pixPlan = som(planejadas, 'totalEmpreiteiroPix');
  const cartaoPlan = som(planejadas, 'gastoCartao');
  const adiantado = round2(r.totalConsumidoContrato - r.totalMedido);

  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `
    <div class="panel-header">
      <div>
        <h2>Conciliação do empreiteiro</h2>
        <div class="muted">Os números de empreiteiro espalhados pela tela não são versões diferentes do mesmo valor — são perguntas diferentes. Aqui estão todos, com a conta que liga um ao outro.</div>
      </div>
    </div>
    <div class="table-scroll">
      <table class="extrato-table">
        <tbody>
          <tr class="extrato-grupo"><td colspan="3">Quanto ele já recebeu (só quinzenas REALIZADAS)</td></tr>
          <tr><td>PIX de mão de obra</td><td class="num">${money(pixReal)}</td><td class="muted">soma da coluna "Empreiteiro (PIX)" nas quinzenas realizadas</td></tr>
          <tr><td>+ Cartão (material descontado do que ele tem a receber)</td><td class="num">${money(cartaoReal)}</td><td class="muted">soma da coluna "Cartão" nas quinzenas realizadas</td></tr>
          <tr class="extrato-residuo"><td><strong>= Consumido do contrato</strong></td><td class="num"><strong>${money(r.totalConsumidoContrato)}</strong></td><td class="muted">é o valor do card "Avanço empreiteiro (% pago)" e do extrato do Dashboard</td></tr>

          <tr class="extrato-grupo"><td colspan="3">Quanto de obra ele já entregou</td></tr>
          <tr><td>Medido (avanço das categorias)</td><td class="num">${money(r.totalMedido)}</td><td class="muted">${pct(r.percObraGeral)} do orçado — vem da aba Lançar Avanços, não das parcelas</td></tr>
          <tr class="${adiantado > 0.02 ? 'extrato-residuo' : ''}"><td><strong>${adiantado > 0.02 ? 'Recebido além do medido (adiantamento)' : 'Medido ainda não pago'}</strong></td><td class="num"><strong>${money(Math.abs(adiantado))}</strong></td><td class="muted">consumido − medido${adiantado > 0.02 ? ' — ele está adiantado em relação à obra entregue' : ''}</td></tr>

          <tr class="extrato-grupo"><td colspan="3">Quanto ainda cabe no contrato</td></tr>
          <tr><td>Contrato total</td><td class="num">${money(r.contratoTotalEmpreiteiro)}</td><td class="muted">parâmetro fixo</td></tr>
          <tr><td>− Consumido</td><td class="num">${money(r.totalConsumidoContrato)}</td><td class="muted">${pct(r.percValorTotalPago)} do contrato</td></tr>
          <tr class="extrato-residuo"><td><strong>= Saldo do contrato</strong></td><td class="num"><strong>${money(r.saldoContratoAPagarEmpreiteiro)}</strong></td><td class="muted">é o card "Saldo empreiteiro (falta do contrato)"</td></tr>

          <tr class="extrato-grupo"><td colspan="3">O que ainda está só planejado (não entra em nenhum card de valor pago)</td></tr>
          <tr><td>PIX planejado</td><td class="num">${money(pixPlan)}</td><td class="muted">${planejadas.length} quinzena(s) com status PLANEJADO</td></tr>
          <tr><td>Cartão planejado</td><td class="num">${money(cartaoPlan)}</td><td class="muted">faturas de cartão de quinzenas ainda não realizadas</td></tr>
          <tr><td><strong>Total da tabela abaixo (realizado + planejado)</strong></td><td class="num"><strong>${money(round2(pixReal + pixPlan))}</strong></td><td class="muted">é o rodapé "TOTAL" de Contas a Pagar na coluna Empreiteiro — por isso ele é maior que o consumido</td></tr>
        </tbody>
      </table>
    </div>
  `;
  return panel;
}

function renderAvisoRascunho() {
  if (!RASCUNHO_RESTAURADO) return null;
  const wrap = document.createElement('div');

    ? ` de ${dateBR(RASCUNHO_RESTAURADO.slice(0, 10))}`

      <div class="card-label">Saldo empreiteiro (falta do contrato)</div>
      <div class="card-value">${money(r.saldoContratoAPagarEmpreiteiro)}</div>
      <div class="card-sub">Contrato total − já consumido (PIX + cartão)</div>
    </div>
    <div class="card accent">
      <div class="card-label">% Execução financeira</div>
      <div class="card-value">${pct(r.percExecucaoFinanceira)}</div>
      <div class="progress-bar" style="margin-top:6px"><span style="width:${Math.min(100, r.percExecucaoFinanceira * 100)}%"></span></div>
      <div class="card-sub">Gasto PLS + provisão da quinzena (${money(r.gastoAcumuladoPLS)}) sobre o financiamento total disponível: crédito CAIXA (${money(r.creditoCaixaTotalPCI)}) + recurso próprio planejado (${money(r.recursoProprioPlanejado)})</div>
